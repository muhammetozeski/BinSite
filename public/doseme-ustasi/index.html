<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tile Workshop — Build a geometric surface</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1050px;margin:auto;padding:24px}h1{font:32px Georgia}p{line-height:1.7}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;padding:9px 13px;border:1px solid #b8b8b8;background:#fff;color:inherit;border-radius:0;cursor:pointer}button:hover{background:#ffffff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}label{display:flex;align-items:center;gap:7px}input[type=color]{width:40px;height:33px;border:0}canvas{width:100%;height:auto;display:block;background:#ffffff;touch-action:none}.swatch{width:35px;height:35px;padding:0}.hint{font-size:12px;color:#b8b8b8}#status{min-height:25px}</style>
<style data-static-readability="calm">
html[data-bs-theme="dark"]{color-scheme:dark;background:#15191f;color:#edf2f7}
html[data-bs-theme="dark"] body,html[data-bs-theme="dark"] header{background:#15191f;color:#edf2f7}
body{font-size:16px;line-height:1.5}h1{font-size:clamp(25px,3vw,32px);line-height:1.15;margin-bottom:8px}h2{line-height:1.3}p{line-height:1.55}
html[data-bs-theme="dark"] a{color:#acc9df}
html[data-bs-theme="dark"] :is(.panel,.paper,.stage,.resource,.metric,.aside,aside,.filters,.recipe,.settings,.canvas-wrap){background:#1d252e;color:#edf2f7;border-color:#465564}
html[data-bs-theme="dark"] :is(.notice,.message,.status,.delta){background:#25323d;color:#edf2f7;border-color:#7f9fac}
html[data-bs-theme="dark"] :is(.fine,.hint,.muted,small,footer,header p){color:#c3cdd7}
html[data-bs-theme="dark"] :is(input:not([type="color"]),select,textarea){background:#202a34;color:#edf2f7;border-color:#657585}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell){background:#28343f;color:#edf2f7;border-color:#607181;border-radius:5px}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell):hover{background:#354653}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell):disabled{opacity:1;color:#bac5d0;background:#242d36;border-color:#465564}
html[data-bs-theme="dark"] :is(.accent,.primary),html[data-bs-theme="dark"] button[aria-pressed="true"]:not(.swatch):not(.pad):not(.tile):not(.cell){background:#405e6d;color:#f4f8fa;border-color:#8baab9}
html[data-bs-theme="dark"] :is(.stat,.recipe,.filters){background:#1d252e;color:#edf2f7;border-color:#465564}
input[type="range"],input[type="checkbox"],progress{accent-color:#8baebd}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #b1d0df;outline-offset:3px}
details.readability-help{border-top:1px solid #50606e;padding-top:10px;margin:18px 0;font-size:14px;line-height:1.6}
details.readability-help summary{cursor:pointer;font-weight:650;min-height:34px;display:list-item}
details.readability-help p{max-width:75ch;margin:10px 0}
html[data-bs-theme="dark"] #demo{background:#405e6d;color:#f4f8fa;border:1px solid #91b0be;font-weight:700}
</style>

<link rel="stylesheet" href="../assets/appearance.css" data-binsite-appearance="style">
<script src="../assets/appearance.js" defer data-binsite-appearance="script"></script>
<main><h1>Tile Workshop</h1><p>Paint and rotate tiles to make a repeating pattern.</p><div class="bar"><label>Tile shape<select id="shape"><option value="square">Square tiles</option><option value="triangle">Triangular tiles</option><option value="hex">Hexagonal tiles</option></select></label><label>Paint color<input id="color" type="color" value="#2d715f"></label><label><input id="motif" type="checkbox" checked> Add a motif to each tile</label><label><input id="rotate" type="checkbox"> Click to rotate a tile</label></div><div class="bar" id="palette"></div><canvas id="floor" width="900" height="600" aria-label="Paintable geometric tile surface"></canvas><div class="bar"><button id="demo">Coastal pattern example</button><button id="blank">Single-color start</button><button id="random">Generate a color pattern</button><button id="png">Download surface</button><button id="save">Save pattern locally</button><button id="load">Open saved pattern</button></div><p id="status" role="status" aria-live="polite">Click or drag to paint tiles. In rotation mode, click to turn a motif.</p><details class="readability-help"><summary>Help</summary><p class="hint">Changing shape starts a new tiling. Export preserves the colors and motifs. This tool creates a design rather than ordering physical goods.</p></details></main><script>
'use strict';const $=id=>document.getElementById(id),c=$('floor'),ctx=c.getContext('2d'),colors=['#2d715f','#dea35a','#f6f0d8','#9b514a','#4c6c87'];let tiles=[],drawing=false;function polygon(points){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();}function build(){tiles=[];const shape=$('shape').value;if(shape==='square'||shape==='triangle')for(let y=0;y<600;y+=60)for(let x=0;x<900;x+=60){if(shape==='square')tiles.push({points:[[x,y],[x+60,y],[x+60,y+60],[x,y+60]],x:x+30,y:y+30,color:'#f6f0d8',turn:0});else for(const points of [[[x,y],[x+60,y],[x+60,y+60]],[[x,y],[x+60,y+60],[x,y+60]]])tiles.push({points,x:points.reduce((s,p)=>s+p[0],0)/3,y:points.reduce((s,p)=>s+p[1],0)/3,color:'#f6f0d8',turn:0});}else{const r=35,h=Math.sqrt(3)*r;for(let col=-1;col<19;col++)for(let row=-1;row<12;row++){const x=col*r*1.5,y=row*h+(col%2)*h/2;tiles.push({points:Array.from({length:6},(_,i)=>[x+Math.cos(i*Math.PI/3)*r,y+Math.sin(i*Math.PI/3)*r]),x,y,color:'#f6f0d8',turn:0});}}draw();}function draw(){ctx.fillStyle='#fafbf4';ctx.fillRect(0,0,900,600);for(const tile of tiles){polygon(tile.points);ctx.fillStyle=tile.color;ctx.fill();ctx.strokeStyle='#385045';ctx.lineWidth=.8;ctx.stroke();if($('motif').checked){ctx.save();polygon(tile.points);ctx.clip();ctx.translate(tile.x,tile.y);ctx.rotate(tile.turn*Math.PI/3);ctx.fillStyle=tile.color==='#f6f0d8'?'#2d715f':'#f6f0d8';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(15,13);ctx.lineTo(-15,13);ctx.closePath();ctx.fill();ctx.restore();}}}function hit(e){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*900,y=(e.clientY-r.top)/r.height*600;for(let i=tiles.length-1;i>=0;i--){polygon(tiles[i].points);if(ctx.isPointInPath(x,y))return tiles[i];}return null;}function paint(e){const tile=hit(e);if(!tile)return;if($('rotate').checked)tile.turn=(tile.turn+1)%6;else tile.color=$('color').value;draw();}c.onpointerdown=e=>{if(e.button!==0)return;drawing=true;c.setPointerCapture(e.pointerId);paint(e);};c.onpointermove=e=>{if(drawing&&!$('rotate').checked)paint(e);};c.onpointerup=c.onpointercancel=c.onlostpointercapture=()=>{drawing=false;};$('shape').onchange=build;$('motif').onchange=draw;colors.forEach(color=>{const b=document.createElement('button');b.className='swatch';b.style.background=color;b.setAttribute('aria-label','Color '+color);b.onclick=()=>{$('color').value=color;};$('palette').append(b);});function example(random=false){tiles.forEach((tile,i)=>{tile.color=colors[random?Math.floor(Math.random()*colors.length):(Math.floor(tile.x/60)+Math.floor(tile.y/60)*2)%colors.length]||colors[0];tile.turn=random?Math.floor(Math.random()*6):i%6;});draw();}$('demo').onclick=()=>example();$('random').onclick=()=>example(true);$('blank').onclick=build;$('png').onclick=()=>c.toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='tile-pattern.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);});$('save').onclick=()=>{try{localStorage.setItem('doseme-ustasi',JSON.stringify({shape:$('shape').value,motif:$('motif').checked,tiles:tiles.map(t=>[t.color,t.turn])}));$('status').textContent='Pattern saved in this browser.';}catch{$('status').textContent='Browser storage is unavailable.';}};$('load').onclick=()=>{try{const s=JSON.parse(localStorage.getItem('doseme-ustasi'));if(!s||!['square','triangle','hex'].includes(s.shape)||!Array.isArray(s.tiles)||s.tiles.some(t=>!Array.isArray(t)||!/^#[0-9a-f]{6}$/i.test(t[0])||!Number.isInteger(t[1])||t[1]<0||t[1]>5))throw Error();$('shape').value=s.shape;$('motif').checked=s.motif;build();if(s.tiles.length!==tiles.length)throw Error();tiles.forEach((t,i)=>{t.color=s.tiles[i][0];t.turn=s.tiles[i][1];});draw();$('status').textContent='Saved surface opened.';}catch{$('status').textContent='No valid save was found.';}};build();example();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
