<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rule Detective</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f1f3;color:#26364a;font:16px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0}a{color:#315d96}.layout{display:grid;grid-template-columns:1fr 350px;gap:25px}.panel{padding:20px;background:white;border:1px solid #b9c4d1;margin:18px 0}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:block;font-size:.85rem}select,button{font:inherit;padding:10px;background:#fff;border:1px solid #8c9caf;color:#26364a}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:#254b75;color:white}.sample{display:flex;gap:17px;align-items:center;padding:18px;border:1px dashed #9aabbd;margin:20px 0}.shape{font-size:3rem;line-height:1}.striped{}.observations{display:grid;grid-template-columns:1fr 1fr;gap:10px}.observation{padding:12px;background:#f6f8fb;border-left:4px solid #66a080;font-size:.85rem}.observation.no{border-left-color:#ba7070}.notice{padding:13px;background:#e4ecf6;border-left:4px solid #4b76a6;min-height:50px}.metrics{font-weight:bold;display:flex;gap:20px;flex-wrap:wrap}.hypotheses{padding-left:20px}.hypotheses li{margin:10px 0;font-size:.9rem}input{width:100%;padding:9px}small{color:#617084}@media(max-width:780px){main{padding:14px}.layout{grid-template-columns:1fr}header{display:block}}
body{background:#fff;color:#111}header{background:#fff;color:#111}a{color:#0645ad}.panel,.paper,.stage,.resource,.metric,.aside,aside{background:#fff;color:#111}.notice,.message,.status,.delta{background:#f0f0f0;color:#111;border-left-color:#111}.fine,.muted{color:#444}button:not(.pad):not(.tile){background:#111;color:#fff;border:1px solid #111}input,textarea,select{background:#fff;color:#111;border:1px solid #111}.pad.lit{box-shadow:none}

<style data-static-readability="calm">

html[data-bs-theme="dark"] a{color:#acc9df}

html[data-bs-theme="dark"] :is(.accent,.primary),html[data-bs-theme="dark"] button[aria-pressed="true"]:not(.swatch):not(.pad):not(.tile):not(.cell){background:#405e6d;color:#f4f8fa;border-color:#8baab9}

</style>

<main><header><div><h1>Rule Detective</h1><p>Find the rule behind ACCEPT and REJECT.</p></div><a href="../">Tools</a></header><p class="metrics"><span id="remaining"></span><span id="candidates"></span><span id="case"></span></p><div class="layout"><div><section class="panel"><h2>Test a sample</h2><p>Six experiments; then submit one of the eight rules.</p><div class="controls"><label>Color<select id="color"><option value="red">Red</option><option value="blue">Blue</option><option value="green">Green</option></select></label><label>Shape<select id="shape"><option value="circle">Circle</option><option value="triangle">Triangle</option><option value="square">Square</option></select></label><label>Number<select id="number"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>Pattern<select id="pattern"><option value="0">Plain</option><option value="1">Striped</option></select></label></div><div id="preview" class="sample"></div><button id="test" class="primary">Test sample</button></section><h2>Observations</h2><div id="observations" class="observations"></div><p id="status" class="notice" role="status" aria-live="polite"></p><div class="controls"><button id="reset">Restart case</button><button id="new">New case</button><button id="share">Copy case link</button></div><input id="link" hidden readonly aria-label="Case link"></div><aside class="panel"><h2>Possible rules</h2><ol id="hypotheses" class="hypotheses"></ol><label>Choose a rule<select id="guess"></select></label><button id="submit" class="primary">Submit final answer</button>
</aside></div></main><script>
'use strict';const $=i=>document.getElementById(i),colors={red:"Red",blue:"Blue",green:"Green"},shapes={circle:"Circle",triangle:"Triangle",square:"Square"},glyphs={circle:'●',triangle:'▲',square:'■'},ink={red:'#bb4c4c',blue:'#3971ac',green:'#45815a'};const rules=[{name:"Red samples with even numbers",accept:x=>x.color==='red'&&x.number%2===0},{name:"Samples that are triangular or blue",accept:x=>x.shape==='triangle'||x.color==='blue'},{name:"Exactly one condition is true: striped or odd-numbered",accept:x=>x.striped!==(x.number%2===1)},{name:"Numbers above 3 on shapes other than circles",accept:x=>x.number>3&&x.shape!=='circle'},{name:"Blue or striped samples, excluding triangles",accept:x=>(x.color==='blue'||x.striped)&&x.shape!=='triangle'},{name:"Prime-numbered samples that are not green",accept:x=>[2,3,5].includes(x.number)&&x.color!=='green'},{name:"Plain squares or striped red samples",accept:x=>(x.shape==='square'&&!x.striped)||(x.color==='red'&&x.striped)},{name:"Numbers 1 or 6; otherwise only green circles",accept:x=>x.number===1||x.number===6||(x.color==='green'&&x.shape==='circle')}];const universe=[];for(const color of Object.keys(colors))for(const shape of Object.keys(shapes))for(let number=1;number<=6;number++)for(const striped of[false,true])universe.push({color,shape,number,striped});let seed=Number(new URLSearchParams(location.search).get('seed'))>>>0||Math.floor(Math.random()*1e9),hidden,observations,tests,ended;function rng(s){return()=>((s=Math.imul(s,1664525)+1013904223>>>0)/4294967296)}function key(x){return[x.color,x.shape,x.number,x.striped].join(',')}function describe(x){return colors[x.color]+' '+shapes[x.shape].toLowerCase()+' · '+x.number+' · '+(x.striped?"striped":"plain")}function sample(){return{color:$('color').value,shape:$('shape').value,number:Number($('number').value),striped:$('pattern').value==='1'}}function matching(){return rules.map((rule,i)=>({rule,i})).filter(({rule})=>observations.every(o=>rule.accept(o.sample)===o.accepted))}function preview(){const x=sample(),shape=document.createElement('span');shape.className='shape'+(x.striped?' striped':'');shape.style.color=ink[x.color];shape.textContent=glyphs[x.shape];const caption=document.createElement('span');caption.textContent=describe(x);$('preview').replaceChildren(shape,caption);const duplicate=observations.some(o=>key(o.sample)===key(x));$('test').disabled=ended||tests>=6||duplicate;$('test').textContent=duplicate?"Already in log":"Test sample"}function render(){$('remaining').textContent="Experiments remaining: "+(6-tests)+' / 6';$('candidates').textContent="Rules consistent with observations: "+matching().length;$('case').textContent="Case "+seed;$('observations').replaceChildren(...observations.map((o,i)=>{const div=document.createElement('article');div.className='observation'+(o.accepted?'':' no');div.textContent=(i<3?"Start":"Experiment "+(i-2))+': '+describe(o.sample)+' → '+(o.accepted?"ACCEPT":"REJECT");return div}));$('test').disabled=ended||tests>=6;$('submit').disabled=ended;$('guess').disabled=ended;preview()}function reset(){const r=rng(seed);hidden=Math.floor(r()*rules.length);const yes=universe.filter(x=>rules[hidden].accept(x)),no=universe.filter(x=>!rules[hidden].accept(x));const first=yes[Math.floor(r()*yes.length)],second=no[Math.floor(r()*no.length)];observations=[{sample:first,accepted:true},{sample:second,accepted:false}];let third;do{third=universe[Math.floor(r()*universe.length)]}while(observations.some(o=>key(o.sample)===key(third)));observations.push({sample:third,accepted:rules[hidden].accept(third)});tests=0;ended=false;$('status').textContent="Three starting observations are ready.";render();preview()}$('test').onclick=()=>{if(ended||tests>=6)return;const x=sample(),prior=observations.find(o=>key(o.sample)===key(x));if(prior){$('status').textContent="This sample is already in your log: "+(prior.accepted?"accept":"reject")+". No experiment was spent.";return}const accepted=rules[hidden].accept(x);observations.push({sample:x,accepted});tests++;$('status').textContent=describe(x)+' → '+(accepted?"Accepted.":"Rejected.");render()};$('submit').onclick=()=>{if(ended)return;const guess=Number($('guess').value);ended=true;if(guess===hidden)$('status').textContent="Rule discovered! "+tests+" experiments, "+(1000-tests*90)+" points. Hidden rule: "+rules[hidden].name+'.';else{const witness=universe.find(x=>rules[guess].accept(x)!==rules[hidden].accept(x));$('status').textContent="Your hypothesis was incorrect. Actual rule: "+rules[hidden].name+". Distinguishing sample: "+describe(witness)+". Your hypothesis says "+(rules[guess].accept(witness)?"accept":"reject")+", while the machine says "+(rules[hidden].accept(witness)?"accept":"reject")+" ."}render()};$('hypotheses').replaceChildren(...rules.map(rule=>{const li=document.createElement('li');li.textContent=rule.name;return li}));$('guess').replaceChildren(...rules.map((rule,i)=>{const o=document.createElement('option');o.value=i;o.textContent='Rule '+(i+1);return o}));for(const id of['color','shape','number','pattern'])$(id).onchange=preview;$('color').value='red';$('shape').value='circle';$('number').value='1';$('pattern').value='0';$('guess').value='0';$('reset').onclick=reset;$('new').onclick=()=>{seed=Math.floor(Math.random()*1e9);reset()};$('share').onclick=async()=>{const u=new URL(location.href);u.search='?seed='+seed;$('link').hidden=false;$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent="The link to this hidden rule and starting observations was copied."}catch{$('link').select()}};reset();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
