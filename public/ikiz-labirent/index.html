<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twin Maze</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0ea;color:#343b4d;font:16px/1.6 system-ui}main{max-width:1050px;margin:auto;padding:25px}header{display:flex;align-items:center;justify-content:space-between}h1{margin:0}a{color:#4d6298}.boards{display:grid;grid-template-columns:1fr 1fr;gap:24px}.maze{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:12px;border:3px solid var(--color);background:#e1e4eb}.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fffdf6;font-size:1.5rem;position:relative}.wall{background:#3c465a}.goal{background:#c7ddc3;color:#345839;font-size:.9rem;border:2px dashed #658d5c}.person{color:var(--color);font-weight:bold;font-size:2rem}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}button{font:inherit;background:white;color:#343b4d;padding:10px 15px;border:1px solid #9aa3b5;cursor:pointer}button:disabled{opacity:.4;cursor:default}.arrows{display:grid;grid-template-columns:repeat(3,70px);gap:6px;justify-content:center}.arrows button:first-child{grid-column:2}.arrows button:nth-child(2){grid-column:1}.notice{padding:13px;background:white;border-left:4px solid #8a6ba7;min-height:50px}.metrics{display:flex;gap:20px;flex-wrap:wrap;font-weight:bold}.help{background:white;padding:20px;border:1px solid #c3c8d2;margin-top:20px}input{width:100%;padding:9px}@media(max-width:600px){main{padding:13px}header{display:block}.boards{gap:10px}.maze{padding:6px;gap:3px}.cell{font-size:1rem}.person{font-size:1.6rem}}

<main><header><div><h1>Twin Maze</h1><p>Move both characters onto EXIT on the same turn.</p></div><a href="../">Tools</a></header><p class="metrics"><span id="moves"></span><span id="hintCount"></span><span id="seed"></span></p><div class="boards"><section style="--color:#3c77ad"><h2>Blue · Normal</h2><div id="mazeA" class="maze" aria-label="Blue character maze"></div></section><section style="--color:#a45b84"><h2>Pink · Left/right mirrored</h2><div id="mazeB" class="maze" aria-label="Pink character maze"></div></section></div><div class="bar"><button id="undo">Undo</button><button id="hint">Hint (−150 points)</button><button id="reset">Restart pair</button><button id="new">New maze pair</button><button id="share">Copy maze link</button></div><div class="arrows"><button data-dir="0" aria-label="Move up">↑</button><button data-dir="2" aria-label="Move left">←</button><button data-dir="1" aria-label="Move down">↓</button><button data-dir="3" aria-label="Move right">→</button></div><p id="status" class="notice" role="status" aria-live="polite"></p><input id="link" readonly hidden aria-label="Twin maze link"><section class="help"><p>A wall stops one character without stopping the other. Neither character freezes on EXIT.</p><details><summary>Scoring</summary>
<p>2000 − moves × 25 − hints × 150.</p>
</details></section></main><script>
'use strict';const $=i=>document.getElementById(i),directions=[[0,-1],[0,1],[-1,0],[1,0]],arrow=['↑','↓','←','→'];let seed=Number(new URLSearchParams(location.search).get('seed'))>>>0||Math.floor(Math.random()*1e9),wallsA,wallsB,a,b,history,hints,won;function rng(s){return()=>((s=Math.imul(s,1664525)+1013904223>>>0)/4294967296)}function moveOne(position,dx,dy,walls){const x=position%5+dx,y=Math.floor(position/5)+dy;if(x<0||x>=5||y<0||y>=5||walls.has(y*5+x))return position;return y*5+x}function transition(one,two,d,wa=wallsA,wb=wallsB){const[dx,dy]=directions[d];return[moveOne(one,dx,dy,wa),moveOne(two,-dx,dy,wb)]}function solve(one,two,wa=wallsA,wb=wallsB){const start=one*25+two,queue=[start],parents=new Map([[start,null]]);for(let head=0;head<queue.length;head++){const key=queue[head],x=Math.floor(key/25),y=key%25;if(x===4&&y===0){const path=[];let node=key;while(parents.get(node)){const p=parents.get(node);path.push(p.d);node=p.from}return path.reverse()}for(let d=0;d<4;d++){const[nextA,nextB]=transition(x,y,d,wa,wb),next=nextA*25+nextB;if(parents.has(next))continue;parents.set(next,{from:key,d});queue.push(next)}}return null}function generate(s){const r=rng(s);for(let attempt=0;attempt<200;attempt++){const wa=new Set,wb=new Set;for(let p=0;p<25;p++){if(![20,4].includes(p)&&r()<.21)wa.add(p);if(![24,0].includes(p)&&r()<.21)wb.add(p)}const route=solve(20,24,wa,wb);if(route&&route.length>=10)return{wa,wb,route}}const wa=new Set([7,12,17]),wb=new Set([6,11,16]);return{wa,wb,route:solve(20,24,wa,wb)}}function paint(){for(const[container,walls,position,goal]of[['mazeA',wallsA,a,4],['mazeB',wallsB,b,0]]){$(container).replaceChildren(...Array.from({length:25},(_,i)=>{const div=document.createElement('div');div.className='cell'+(walls.has(i)?' wall':'')+(goal===i?' goal':'');if(goal===i)div.textContent="EXIT";if(position===i){const person=document.createElement('span');person.className='person';person.textContent='●';div.append(person)}return div}))}$('moves').textContent="Moves "+history.length;$('hintCount').textContent="Hints "+hints;$('seed').textContent="Pair "+seed;$('undo').disabled=!history.length;$('hint').disabled=won;document.querySelectorAll('[data-dir]').forEach(button=>button.disabled=won)}function step(d){if(won)return;const[nextA,nextB]=transition(a,b,d);if(nextA===a&&nextB===b){$('status').textContent="Both characters are blocked. Try another direction.";return}history.push([a,b]);a=nextA;b=nextB;if(a===4&&b===0){won=true;$('status').textContent="Both exits reached together! "+history.length+" moves, "+Math.max(0,2000-history.length*25-hints*150)+" points."}else $('status').textContent="Blue "+arrow[d]+", pink "+arrow[d===2?3:d===3?2:d]+".";paint()}function reset(){const generated=generate(seed);wallsA=generated.wa;wallsB=generated.wb;a=20;b=24;history=[];hints=0;won=false;$('status').textContent="Use the arrow keys or on-screen buttons.";paint()}document.querySelectorAll('[data-dir]').forEach(button=>button.onclick=()=>step(Number(button.dataset.dir)));document.addEventListener('keydown',e=>{const d={ArrowUp:0,ArrowDown:1,ArrowLeft:2,ArrowRight:3}[e.key];if(d!==undefined&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();step(d)}});$('undo').onclick=()=>{if(!history.length)return;[a,b]=history.pop();won=false;$('status').textContent="One move undone.";paint()};$('hint').onclick=()=>{const route=solve(a,b);if(!route?.length){$('status').textContent="No solution was found from these positions. Undo a move and try another route.";return}hints++;$('status').textContent="Next step on a joint solution: "+arrow[route[0]]+'.';paint()};$('reset').onclick=reset;$('new').onclick=()=>{seed=Math.floor(Math.random()*1e9);reset()};$('share').onclick=async()=>{const u=new URL(location.href);u.search='?seed='+seed;$('link').hidden=false;$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent="The link to this maze pair was copied."}catch{$('link').select()}};reset();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
