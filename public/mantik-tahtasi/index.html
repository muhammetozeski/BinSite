<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logic Board — Build a digital circuit</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1150px;margin:auto;padding:24px}h1{font-size:31px}p{line-height:1.8}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}button,select{font:inherit;padding:9px 12px;background:#fff;border:1px solid #b8b8b8;color:inherit;cursor:pointer}button:hover{background:#ffffff}button:focus-visible,select:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}canvas{width:100%;height:auto;display:block;background:#ffffff;border:1px solid #b8b8b8;touch-action:none}#status{min-height:30px;color:#b8b8b8}table{border-collapse:collapse;margin-top:15px}th,td{padding:8px 18px;border:1px solid #ffffff;text-align:center}#link{width:100%;box-sizing:border-box;padding:8px;font-size:11px}.hint{font-size:12px}</style>

<main><h1>Logic Board</h1><p>Connect logic gates and see how each input changes the output.</p><div class="bar"><select id="gate" aria-label="Gate type"><option>INPUT</option><option>NOT</option><option>AND</option><option>OR</option><option>XOR</option><option>NAND</option><option>OUTPUT</option></select><button id="add">Add gate</button><button id="delete" disabled>Delete selected gate</button><button id="example">Half-adder example</button><button id="table">Generate truth table</button><button id="share">Share circuit</button></div><canvas id="board" width="1100" height="540" aria-label="Connectable digital logic circuit"></canvas><p id="status" role="status" aria-live="polite">Tap an INPUT box to switch 0/1. Connect a right port to a left port.</p><input id="link" hidden readonly aria-label="Logic circuit link"><div id="truth"></div><details class="readability-help"><summary>Help</summary><p class="hint">Drag boxes to move them. Tap a left port without selecting a source to disconnect it. Loops show ?. Truth tables support up to four inputs.</p></details></main><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d'),types=['INPUT','NOT','AND','OR','XOR','NAND','OUTPUT'];let nodes=[],wires=[],selected=null,connecting=null,drag=null,nextId=1;function inputs(type){return type==='INPUT'?0:['NOT','OUTPUT'].includes(type)?1:2;}function evaluate(id,overrides=new Map(),visiting=new Set(),memo=new Map()){if(memo.has(id))return memo.get(id);const node=nodes.find(n=>n.id===id);if(!node||visiting.has(id))return null;if(node.type==='INPUT')return overrides.has(id)?overrides.get(id):node.value;visiting.add(id);const values=Array.from({length:inputs(node.type)},(_,port)=>{const w=wires.find(w=>w.to===id&&w.port===port);return w?evaluate(w.from,overrides,visiting,memo):false;});visiting.delete(id);if(values.includes(null)){memo.set(id,null);return null;}let value=node.type==='NOT'?!values[0]:node.type==='OUTPUT'?values[0]:node.type==='AND'?values.every(Boolean):node.type==='OR'?values.some(Boolean):node.type==='XOR'?values[0]!==values[1]:!values.every(Boolean);memo.set(id,value);return value;}function inputPoint(n,p){return{x:n.x,y:n.y+20+p*25};}function outputPoint(n){return{x:n.x+110,y:n.y+32};}function draw(){$('delete').disabled=selected===null;ctx.fillStyle='#f9fcf4';ctx.fillRect(0,0,1100,540);for(const w of wires){const from=nodes.find(n=>n.id===w.from),to=nodes.find(n=>n.id===w.to);if(!from||!to)continue;const a=outputPoint(from),b=inputPoint(to,w.port);ctx.strokeStyle=evaluate(from.id)?'#d08f25':'#8a9e86';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.bezierCurveTo(a.x+50,a.y,b.x-50,b.y,b.x,b.y);ctx.stroke();}for(const n of nodes){const v=evaluate(n.id);ctx.fillStyle=n.type==='INPUT'?(v?'#f4cd75':'#d5dfcd'):'#fff';ctx.strokeStyle=n.id===selected?'#9d732c':'#59734e';ctx.lineWidth=n.id===selected?3:1.5;ctx.fillRect(n.x,n.y,110,65);ctx.strokeRect(n.x,n.y,110,65);ctx.fillStyle='#28402e';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.fillText(n.type+' '+n.id,n.x+55,n.y+26);ctx.font='14px monospace';ctx.fillText(v===null?'?':v?'1':'0',n.x+55,n.y+48);for(let p=0;p<inputs(n.type);p++){const point=inputPoint(n,p);ctx.fillStyle='#6a8b62';ctx.beginPath();ctx.arc(point.x,point.y,7,0,Math.PI*2);ctx.fill();}if(n.type!=='OUTPUT'){const p=outputPoint(n);ctx.fillStyle=connecting===n.id?'#e1a440':'#6a8b62';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();}}}function position(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1100,y:(e.clientY-r.top)/r.height*540};}canvas.onpointerdown=e=>{if(e.button!==0)return;const p=position(e);for(const n of nodes){if(n.type!=='OUTPUT'){const o=outputPoint(n);if(Math.hypot(p.x-o.x,p.y-o.y)<13){connecting=n.id;selected=n.id;draw();$('status').textContent='Choose an input port on the destination gate.';return;}}for(let port=0;port<inputs(n.type);port++){const i=inputPoint(n,port);if(Math.hypot(p.x-i.x,p.y-i.y)<13){wires=wires.filter(w=>!(w.to===n.id&&w.port===port));if(connecting!==null)wires.push({from:connecting,to:n.id,port});connecting=null;draw();$('status').textContent=nodes.some(n=>evaluate(n.id)===null)?'The connection creates a cycle; its value is shown as unknown.':'Connection updated.';return;}}}const n=[...nodes].reverse().find(n=>p.x>=n.x&&p.x<=n.x+110&&p.y>=n.y&&p.y<=n.y+65);selected=n?n.id:null;connecting=null;if(n){drag={node:n,dx:p.x-n.x,dy:p.y-n.y,start:p,moved:false};canvas.setPointerCapture(e.pointerId);}draw();};canvas.onpointermove=e=>{if(!drag)return;const p=position(e);if(Math.hypot(p.x-drag.start.x,p.y-drag.start.y)>4)drag.moved=true;if(drag.moved){drag.node.x=Math.max(15,Math.min(975,p.x-drag.dx));drag.node.y=Math.max(15,Math.min(460,p.y-drag.dy));draw();}};function finish(){if(drag&&!drag.moved&&drag.node.type==='INPUT')drag.node.value=!drag.node.value;drag=null;draw();}canvas.onpointerup=finish;canvas.onpointercancel=()=>{drag=null;};$('add').onclick=()=>{if(nodes.length>=24){$('status').textContent='Use up to 24 gates.';return;}nodes.push({id:nextId++,type:$('gate').value,x:50+nodes.length%6*155,y:60+Math.floor(nodes.length/6)*100,value:false});draw();};$('delete').onclick=()=>{nodes=nodes.filter(n=>n.id!==selected);wires=wires.filter(w=>w.from!==selected&&w.to!==selected);selected=null;draw();};function example(){nodes=[{id:1,type:'INPUT',x:65,y:100,value:false},{id:2,type:'INPUT',x:65,y:330,value:true},{id:3,type:'XOR',x:430,y:110,value:false},{id:4,type:'AND',x:430,y:320,value:false},{id:5,type:'OUTPUT',x:845,y:110,value:false},{id:6,type:'OUTPUT',x:845,y:320,value:false}];wires=[{from:1,to:3,port:0},{from:2,to:3,port:1},{from:1,to:4,port:0},{from:2,to:4,port:1},{from:3,to:5,port:0},{from:4,to:6,port:0}];nextId=7;selected=null;draw();}$('example').onclick=example;$('table').onclick=()=>{const ins=nodes.filter(n=>n.type==='INPUT'),outs=nodes.filter(n=>n.type==='OUTPUT');if(ins.length>4||!outs.length){$('status').textContent='A truth table needs at least one output and no more than four inputs.';return;}const table=document.createElement('table'),head=document.createElement('tr');[...ins.map((n,i)=>'Input '+n.id),...outs.map((n,i)=>'Output '+n.id)].forEach(text=>{const th=document.createElement('th');th.textContent=text;head.append(th);});const caption=document.createElement('caption');caption.textContent='Circuit snapshot — regenerate after editing.';table.append(caption,head);for(let mask=0;mask<2**ins.length;mask++){const overrides=new Map(ins.map((n,i)=>[n.id,Boolean(mask&(1<<i))])),row=document.createElement('tr');[...ins.map(n=>overrides.get(n.id)),...outs.map(n=>evaluate(n.id,overrides))].forEach(v=>{const td=document.createElement('td');td.textContent=v===null?'?':v?'1':'0';row.append(td);});table.append(row);}$('truth').replaceChildren(table);};$('share').onclick=async()=>{const u=new URL(location.href);u.hash='c='+btoa(JSON.stringify({nodes,wires}));$('link').hidden=false;$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Circuit link copied.';}catch{$('link').select();}};example();if(location.hash.startsWith('#c='))try{if(location.hash.length>20000)throw Error();const s=JSON.parse(atob(location.hash.slice(3)));if(!s||!Array.isArray(s.nodes)||s.nodes.length>24||!Array.isArray(s.wires)||s.wires.length>48||s.nodes.some(n=>!Number.isInteger(n.id)||!types.includes(n.type)||!Number.isFinite(n.x)||!Number.isFinite(n.y)||n.x<0||n.x>980||n.y<0||n.y>465||typeof n.value!=='boolean')||new Set(s.nodes.map(n=>n.id)).size!==s.nodes.length||s.wires.some(w=>!s.nodes.some(n=>n.id===w.from&&n.type!=='OUTPUT')||!s.nodes.some(n=>n.id===w.to&&Number.isInteger(w.port)&&w.port>=0&&w.port<inputs(n.type))))throw Error();nodes=s.nodes;wires=s.wires;nextId=1+Math.max(0,...nodes.map(n=>n.id));draw();}catch{$('status').textContent='The circuit link could not be opened. An example is ready.';}
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
