<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaleidoscope — Symmetry from a single stroke</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#ffffff;color:#181818}main{max-width:1150px;margin:auto;padding:25px;display:grid;grid-template-columns:250px 1fr;gap:26px}h1{font:33px Georgia;margin:0}h2{font-size:16px}p{font-size:13px;line-height:1.8;color:#b8b8b8}label{display:grid;gap:7px;margin:20px 0;font-size:12px}button,input,select{font:inherit}button,select{width:100%;padding:10px;border:1px solid #b8b8b8;border-radius:0;background:#ffffff;color:inherit;margin:5px 0;cursor:pointer}button:hover{background:#ffffff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}input[type=color]{width:100%;height:40px;border:0}input[type=range]{accent-color:#b8b8b8}canvas{width:100%;height:auto;display:block;border-radius:0;background:#fff;box-shadow:none;touch-action:none;cursor:crosshair}#status{min-height:28px}.tools{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:730px){main{display:grid;grid-template-columns:1fr}.settings{display:contents}.settings h1{grid-row:1}.settings>p:first-of-type{grid-row:2}main>section{grid-row:3}.settings label{margin:8px 0}canvas{box-shadow:none}}</style>
<style data-static-readability="calm">

html[data-bs-theme="dark"] body,html[data-bs-theme="dark"] header{background:#15191f;color:#edf2f7}
body{font-size:16px;line-height:1.5}h1{font-size:clamp(25px,3vw,32px);line-height:1.15;margin-bottom:8px}h2{line-height:1.3}p{line-height:1.55}

<main><aside class="settings"><h1>Kaleidoscope</h1><p>Draw a stroke and watch it repeat into a symmetrical pattern.</p><label>Sectors: <output id="count">8</output><input id="sectors" type="range" min="2" max="16" value="8"></label><label>Symmetry<select id="mirror"><option value="yes">Reflection and rotation</option><option value="no">Rotation only</option></select></label><label>New stroke color<input id="color" type="color" value="#9c3b85"></label><label>New stroke width<input id="size" type="range" min="1" max="18" value="4"></label><label>Background<input id="background" type="color" value="#fff9f3"></label><button id="undo">Undo last stroke</button><button id="clear">Clear drawing</button><button id="demo">Flower rosette example</button><details class="readability-help"><summary>Help</summary><p>Changing sectors or reflection rebuilds every stroke. Draw once and explore different symmetries.</p></details></aside><section><canvas id="art" width="800" height="800" aria-label="Symmetric pattern drawing canvas"></canvas><p id="status" role="status" aria-live="polite">Drag on the canvas to add a mirrored stroke.</p><div class="tools"><button id="png">Download pattern PNG</button><button id="save">Download project file</button><button id="open">Open project file</button><button id="rotate">Rotate pattern 15°</button><input id="file" type="file" accept=".json,application/json" hidden></div></section></main><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('art'),ctx=canvas.getContext('2d');let strokes=[],active=null,rotation=0;function state(){return{version:1,sectors:Number($('sectors').value),mirror:$('mirror').value==='yes',background:$('background').value,rotation,strokes};}function render(){ctx.fillStyle=$('background').value;ctx.fillRect(0,0,800,800);ctx.save();ctx.translate(400,400);ctx.rotate(rotation);const count=Number($('sectors').value),angle=Math.PI*2/count;for(let i=0;i<count;i++)for(let flip=0;flip<($('mirror').value==='yes'?2:1);flip++){ctx.save();ctx.rotate(i*angle);if(flip)ctx.scale(1,-1);for(const stroke of strokes){ctx.strokeStyle=stroke.color;ctx.lineWidth=stroke.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();stroke.points.forEach((p,index)=>index?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}ctx.restore();}ctx.restore();$('count').textContent=count;}function point(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*800-400,y=(e.clientY-r.top)/r.height*800-400;return[x*Math.cos(-rotation)-y*Math.sin(-rotation),x*Math.sin(-rotation)+y*Math.cos(-rotation)];}canvas.onpointerdown=e=>{if(e.button!==0)return;if(strokes.length>=80){$('status').textContent='The 80-stroke limit is reached. Save the project and start a new pattern.';return;}active={color:$('color').value,size:Number($('size').value),points:[point(e)]};strokes.push(active);canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(active&&active.points.length<1000){active.points.push(point(e));render();}};function finish(){active=null;render();}canvas.onpointerup=finish;canvas.onpointercancel=finish;canvas.onlostpointercapture=finish;['sectors','mirror','background'].forEach(id=>$(id).oninput=render);$('undo').onclick=()=>{strokes.pop();render();};$('clear').onclick=()=>{strokes=[];render();};$('rotate').onclick=()=>{rotation=(rotation+Math.PI/12)%(Math.PI*2);render();};function demo(){strokes=[];for(const [r,color,size]of [[120,'#b55f97',4],[230,'#447f80',3],[310,'#b78d3b',2]]){const points=[];for(let i=0;i<=100;i++){const t=i/100*Math.PI*2;points.push([r+Math.cos(t)*r*.3,Math.sin(t)*r*.17]);}strokes.push({color,size,points});}render();}$('demo').onclick=demo;function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}$('png').onclick=()=>canvas.toBlob(b=>{if(b)download(b,'kaleidoscope.png');});$('save').onclick=()=>download(new Blob([JSON.stringify(state())],{type:'application/json'}),'kaleidoscope.json');$('open').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>2000000)throw Error('The file must be no larger than 2 MB.');const s=JSON.parse(await f.text());if(!s||s.version!==1||!Number.isInteger(s.sectors)||s.sectors<2||s.sectors>16||typeof s.mirror!=='boolean'||!/^#[0-9a-f]{6}$/i.test(s.background)||!Number.isFinite(s.rotation)||!Array.isArray(s.strokes)||s.strokes.length>80||s.strokes.some(stroke=>!/^#[0-9a-f]{6}$/i.test(stroke.color)||!Number.isFinite(stroke.size)||stroke.size<1||stroke.size>18||!Array.isArray(stroke.points)||stroke.points.length>1000||stroke.points.some(p=>!Array.isArray(p)||p.length!==2||!p.every(v=>Number.isFinite(v)&&Math.abs(v)<=1000))))throw Error('Invalid project data.');$('sectors').value=s.sectors;$('mirror').value=s.mirror?'yes':'no';$('background').value=s.background;rotation=s.rotation;strokes=s.strokes;render();$('status').textContent='Pattern project opened.';}catch(e){$('status').textContent=e.message;}$('file').value='';};demo();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
