<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaleydoskop — Bir çizgiden simetrik dünya</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f1e9ec;color:#422d43}main{max-width:1150px;margin:auto;padding:25px;display:grid;grid-template-columns:250px 1fr;gap:26px}h1{font:33px Georgia;margin:0}h2{font-size:16px}p{font-size:13px;line-height:1.8;color:#7c617c}label{display:grid;gap:7px;margin:20px 0;font-size:12px}button,input,select{font:inherit}button,select{width:100%;padding:10px;border:1px solid #b99bb6;border-radius:5px;background:#fffbfc;color:inherit;margin:5px 0;cursor:pointer}button:hover{background:#e0c9de}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bb519f;outline-offset:2px}input[type=color]{width:100%;height:40px;border:0}input[type=range]{accent-color:#9a4382}canvas{width:100%;height:auto;display:block;border-radius:50%;background:#fff;box-shadow:0 0 0 8px #ddcbd8;touch-action:none;cursor:crosshair}#status{min-height:28px}.tools{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:730px){main{display:flex;flex-direction:column-reverse}.settings{display:grid;grid-template-columns:1fr 1fr;gap:15px}.settings label{margin:0}.settings h1,.settings p{grid-column:1/-1}canvas{box-shadow:0 0 0 4px #ddcbd8}}</style><main><aside class="settings"><h1>Kaleydoskop</h1><p>Bir dilime çizdiğin her iz, aynalar ve dönüşlerle bütün bir rozete dönüşür.</p><label>Dilim sayısı: <output id="count">8</output><input id="sectors" type="range" min="2" max="16" value="8"></label><label>Simetri<select id="mirror"><option value="yes">Yansıma + dönüş</option><option value="no">Yalnız dönüş</option></select></label><label>Çizgi rengi<input id="color" type="color" value="#9c3b85"></label><label>Fırça kalınlığı<input id="size" type="range" min="1" max="18" value="4"></label><label>Zemin<input id="background" type="color" value="#fff9f3"></label><button id="undo">Son izi geri al</button><button id="clear">Boş desen</button><button id="demo">Çiçek rozeti örneği</button><p>Dilim ve ayna değişikliği çizilmiş bütün izleri yeniden kurar. Bir kez çizip birçok simetri dene.</p></aside><section><canvas id="art" width="800" height="800" aria-label="Simetrik desen çizim alanı"></canvas><p id="status" role="status" aria-live="polite">Merkezin dışından başlayıp sürükle. Örneği temizleyerek kendi desenini kurabilirsin.</p><div class="tools"><button id="png">Deseni PNG indir</button><button id="save">Proje dosyasını indir</button><button id="open">Proje dosyası aç</button><button id="rotate">Deseni 15° döndür</button><input id="file" type="file" accept=".json,application/json" hidden></div></section></main><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('art'),ctx=canvas.getContext('2d');let strokes=[],active=null,rotation=0;function state(){return{version:1,sectors:Number($('sectors').value),mirror:$('mirror').value==='yes',background:$('background').value,rotation,strokes};}function render(){ctx.fillStyle=$('background').value;ctx.fillRect(0,0,800,800);ctx.save();ctx.translate(400,400);ctx.rotate(rotation);const count=Number($('sectors').value),angle=Math.PI*2/count;for(let i=0;i<count;i++)for(let flip=0;flip<($('mirror').value==='yes'?2:1);flip++){ctx.save();ctx.rotate(i*angle);if(flip)ctx.scale(1,-1);for(const stroke of strokes){ctx.strokeStyle=stroke.color;ctx.lineWidth=stroke.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();stroke.points.forEach((p,index)=>index?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}ctx.restore();}ctx.restore();$('count').textContent=count;}function point(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*800-400,y=(e.clientY-r.top)/r.height*800-400;return[x*Math.cos(-rotation)-y*Math.sin(-rotation),x*Math.sin(-rotation)+y*Math.cos(-rotation)];}canvas.onpointerdown=e=>{if(e.button!==0)return;if(strokes.length>=80){$('status').textContent='80 iz sınırına ulaştın; proje dosyanı saklayıp yeni bir desen açabilirsin.';return;}active={color:$('color').value,size:Number($('size').value),points:[point(e)]};strokes.push(active);canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(active&&active.points.length<1000){active.points.push(point(e));render();}};function finish(){active=null;render();}canvas.onpointerup=finish;canvas.onpointercancel=finish;canvas.onlostpointercapture=finish;['sectors','mirror','background'].forEach(id=>$(id).oninput=render);$('undo').onclick=()=>{strokes.pop();render();};$('clear').onclick=()=>{strokes=[];render();};$('rotate').onclick=()=>{rotation=(rotation+Math.PI/12)%(Math.PI*2);render();};function demo(){strokes=[];for(const [r,color,size]of [[120,'#b55f97',4],[230,'#447f80',3],[310,'#b78d3b',2]]){const points=[];for(let i=0;i<=100;i++){const t=i/100*Math.PI*2;points.push([r+Math.cos(t)*r*.3,Math.sin(t)*r*.17]);}strokes.push({color,size,points});}render();}$('demo').onclick=demo;function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}$('png').onclick=()=>canvas.toBlob(b=>{if(b)download(b,'kaleydoskop.png');});$('save').onclick=()=>download(new Blob([JSON.stringify(state())],{type:'application/json'}),'kaleydoskop.json');$('open').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>2000000)throw Error('Dosya en fazla 2 MB olmalı.');const s=JSON.parse(await f.text());if(!s||s.version!==1||!Number.isInteger(s.sectors)||s.sectors<2||s.sectors>16||typeof s.mirror!=='boolean'||!/^#[0-9a-f]{6}$/i.test(s.background)||!Number.isFinite(s.rotation)||!Array.isArray(s.strokes)||s.strokes.length>80||s.strokes.some(stroke=>!/^#[0-9a-f]{6}$/i.test(stroke.color)||!Number.isFinite(stroke.size)||stroke.size<1||stroke.size>18||!Array.isArray(stroke.points)||stroke.points.length>1000||stroke.points.some(p=>!Array.isArray(p)||p.length!==2||!p.every(v=>Number.isFinite(v)&&Math.abs(v)<=1000))))throw Error('Proje verisi geçersiz.');$('sectors').value=s.sectors;$('mirror').value=s.mirror?'yes':'no';$('background').value=s.background;rotation=s.rotation;strokes=s.strokes;render();$('status').textContent='Desen projesi açıldı.';}catch(e){$('status').textContent=e.message;}$('file').value='';};demo();
</script></html>
