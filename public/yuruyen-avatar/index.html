<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Walking Avatar — Animate a skeleton</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1100px;padding:24px;margin:auto;display:grid;grid-template-columns:300px 1fr;gap:25px}h1{font-size:29px}label{display:grid;gap:6px;margin:15px 0}input[type=range]{width:100%;accent-color:#b8b8b8}button,input{font:inherit}button{background:#fff;border:1px solid #b8b8b8;color:inherit;padding:9px 12px;border-radius:0;cursor:pointer}button:hover{background:#ffffff}button:focus-visible,input:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}#stage svg{width:100%;height:auto;max-height:650px;background:#fff;border:1px solid #ffffff}p{line-height:1.8;font-size:13px}#status{min-height:25px}#link{width:100%;box-sizing:border-box;padding:8px;font-size:11px}@media(max-width:700px){main{display:flex;flex-direction:column-reverse}}</style><main><aside><h1>Walking Avatar</h1><p>Set two poses using four joint angles. The skeleton calculates the motion between them.</p><div id="angles"></div><label>Leg bone length<input id="leg" type="range" min="40" max="100" value="72"></label><label>Torso length<input id="torso" type="range" min="45" max="100" value="75"></label><label>Clothing color<input id="color" type="color" value="#5d87b4"></label><label>Loop duration<input id="duration" type="range" min="5" max="40" value="16"><span>From 0.5 to 4 seconds</span></label><div class="bar"><button id="storeA">Save this as pose A</button><button id="storeB">Save this as pose B</button><button id="showA">Show A</button><button id="showB">Show B</button></div><p>Changing an angle pauses playback. Smooth interpolation between poses A and B creates the motion loop.</p></aside><section><div id="stage"></div><div class="bar"><button id="play">▶ Play loop</button><button id="walk">Walking example</button><button id="dance">Dancing example</button><button id="svg">Download pose SVG</button><button id="share">Share rig</button></div><input id="link" readonly aria-label="Avatar link"><p id="status" role="status" aria-live="polite">The sample walk uses opposing poses. Create your own pair to explore another motion.</p></section></main><script>
'use strict';const $=id=>document.getElementById(id),names=['Left arm','Right arm','Left leg','Right leg'];let pose=[35,-35,-28,28],a=pose.slice(),b=pose.map(x=>-x),playing=false,frame=0,start=0;for(let i=0;i<4;i++){const label=document.createElement('label');label.textContent=names[i];const slider=document.createElement('input');slider.id='angle'+i;slider.type='range';slider.min=-110;slider.max=110;slider.value=pose[i];slider.oninput=()=>{stop();pose[i]=Number(slider.value);render();};label.append(slider);$('angles').append(label);}function end(x,y,length,degrees){const t=degrees*Math.PI/180;return[x+Math.sin(t)*length,y+Math.cos(t)*length];}function source(){const torso=Number($('torso').value),leg=Number($('leg').value),hipY=230,shoulderY=hipY-torso,stroke=$('color').value;let lines='';function bone(x,y,p,color,width){lines+=`<path d="M${x} ${y} L${p[0]} ${p[1]}" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/><circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#d39d6c"/>`;}for(let side=0;side<2;side++){const x=250+(side?13:-13),knee=end(x,hipY,leg*.6,pose[2+side]),foot=end(...knee,leg*.6,pose[2+side]+15);bone(x,hipY,knee,'#334c66',14);bone(...knee,foot,'#334c66',12);const elbow=end(x,shoulderY,48,pose[side]),hand=end(...elbow,40,pose[side]-18);bone(x,shoulderY,elbow,stroke,13);bone(...elbow,hand,stroke,11);}return `<svg xmlns="http://www.w3.org/2000/svg" width="500" height="430" viewBox="0 0 500 430"><rect width="500" height="430" fill="#f9fbfe"/><path d="M40 390 H460" stroke="#cbd6e0" stroke-width="2"/><ellipse cx="250" cy="390" rx="80" ry="8" fill="#e0e7ee"/>${lines}<path d="M232 ${shoulderY-9} Q250 ${shoulderY-18} 268 ${shoulderY-9} L273 ${hipY+8} H227 Z" fill="${stroke}"/><circle cx="250" cy="${shoulderY-42}" r="29" fill="#edbc8e"/><path d="M222 ${shoulderY-48} Q230 ${shoulderY-83} 271 ${shoulderY-57}" stroke="#3e3a37" stroke-width="12" fill="none"/><circle cx="241" cy="${shoulderY-43}" r="2"/><circle cx="259" cy="${shoulderY-43}" r="2"/><path d="M243 ${shoulderY-31} Q250 ${shoulderY-25} 258 ${shoulderY-32}" fill="none" stroke="#624d40" stroke-width="2"/></svg>`;}function render(){$('stage').innerHTML=source();pose.forEach((v,i)=>$('angle'+i).value=v);}function stop(){playing=false;cancelAnimationFrame(frame);$('play').textContent='▶ Play loop';}function tick(time){if(!playing)return;const t=(1-Math.cos((time-start)/(Number($('duration').value)*100)*Math.PI*2))/2;pose=a.map((v,i)=>v+(b[i]-v)*t);render();frame=requestAnimationFrame(tick);}$('play').onclick=()=>{if(playing){stop();return;}playing=true;start=performance.now();$('play').textContent='Ⅱ Pause';frame=requestAnimationFrame(tick);};$('storeA').onclick=()=>{a=pose.slice();$('status').textContent='Pose A saved.';};$('storeB').onclick=()=>{b=pose.slice();$('status').textContent='Pose B saved.';};$('showA').onclick=()=>{stop();pose=a.slice();render();};$('showB').onclick=()=>{stop();pose=b.slice();render();};['leg','torso','color'].forEach(id=>$(id).oninput=render);$('walk').onclick=()=>{stop();a=[35,-35,-28,28];b=a.map(v=>-v);pose=a.slice();render();};$('dance').onclick=()=>{stop();a=[-100,65,18,-18];b=[65,-100,-18,18];pose=a.slice();render();};$('svg').onclick=()=>{const u=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'})),link=document.createElement('a');link.href=u;link.download='avatar-pose.svg';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('share').onclick=async()=>{const s={a,b,leg:Number($('leg').value),torso:Number($('torso').value),duration:Number($('duration').value),color:$('color').value},u=new URL(location.href);u.hash='rig='+btoa(JSON.stringify(s));$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Two-pose rig link copied.';}catch{$('link').select();}};if(location.hash.startsWith('#rig='))try{if(location.hash.length>2000)throw Error();const s=JSON.parse(atob(location.hash.slice(5)));if([s.a,s.b].some(p=>!Array.isArray(p)||p.length!==4||p.some(v=>!Number.isFinite(v)||v< -110||v>110))||!Number.isFinite(s.leg)||s.leg<40||s.leg>100||!Number.isFinite(s.torso)||s.torso<45||s.torso>100||!Number.isFinite(s.duration)||s.duration<5||s.duration>40||!/^#[0-9a-f]{6}$/i.test(s.color))throw Error();a=s.a;b=s.b;pose=a.slice();for(const id of ['leg','torso','duration','color'])$(id).value=s[id];}catch{$('status').textContent='The shared rig could not be opened. A walking example is ready.';}render();
</script><script src="/assets/revenue.js" data-binsite-revenue defer></script></html>
