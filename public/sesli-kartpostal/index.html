<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Postcard — Send a small melody</title><style>*{box-sizing:border-box}body{font:16px Georgia,serif;background:#ffffff;color:#181818;margin:0}main{max-width:1000px;margin:30px auto;padding:20px;display:grid;grid-template-columns:1fr 300px;gap:25px}h1{font-size:30px;margin:5px 0 12px}.card{min-height:470px;background:#ffffff;border:1px solid #ffffff;padding:36px;position:relative;box-shadow:none}#to{font-size:15px;color:#b8b8b8}#message{font-size:27px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}#from{font-style:italic}canvas{width:100%;height:110px}button,input,textarea,select{font:14px system-ui}label{display:grid;gap:6px;margin:14px 0;font:13px system-ui}input,textarea,select{padding:9px;border:1px solid #ffffff;background:#ffffff;color:#181818;width:100%}button{padding:11px 15px;border:1px solid #b8b8b8;background:#181818;color:white;cursor:pointer}button:hover{background:#b8b8b8}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}#link{font-size:11px}#status{font:13px/1.7 system-ui;min-height:40px}small{font:12px/1.6 system-ui;color:#b8b8b8}@media(max-width:700px){main{grid-template-columns:1fr;margin:5px auto}.card{padding:24px;min-height:400px}}</style>
<style data-static-readability="calm">
html[data-bs-theme="dark"]{color-scheme:dark;background:#15191f;color:#edf2f7}
html[data-bs-theme="dark"] body,html[data-bs-theme="dark"] header{background:#15191f;color:#edf2f7}
body{font-size:16px;line-height:1.5}h1{font-size:clamp(25px,3vw,32px);line-height:1.15;margin-bottom:8px}h2{line-height:1.3}p{line-height:1.55}
html[data-bs-theme="dark"] a{color:#acc9df}
html[data-bs-theme="dark"] :is(.panel,.paper,.stage,.resource,.metric,.aside,aside,.filters,.recipe,.settings,.canvas-wrap){background:#1d252e;color:#edf2f7;border-color:#465564}

html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell):disabled{opacity:1;color:#bac5d0;background:#242d36;border-color:#465564}
html[data-bs-theme="dark"] :is(.accent,.primary),html[data-bs-theme="dark"] button[aria-pressed="true"]:not(.swatch):not(.pad):not(.tile):not(.cell){background:#405e6d;color:#f4f8fa;border-color:#8baab9}

<script src="../assets/appearance.js" defer data-binsite-appearance="script"></script>
<main><section><h1>Audio Postcard</h1><p>Write a message and give it a melody.</p><article class="card" data-appearance-preserve><p id="to"></p><p id="message"></p><p id="from"></p><canvas id="visual" width="700" height="110" aria-label="Card melody visualization"></canvas><div class="actions"><button id="play">Play melody</button><button id="stop">Stop</button></div></article><p id="status" role="status" aria-live="polite">Your card is ready.</p></section><aside><label>To<input id="recipient" maxlength="40" value="Have a good day"></label><label>Card message<textarea id="text" maxlength="350" rows="6">A small sound for you today. I hope you find a quiet moment in the middle of everything.</textarea></label><label>From<input id="sender" maxlength="40" value="From a friend"></label><details><summary>Melody number</summary><label>Use a number to repeat the same tune<input id="seed" type="number" min="1" max="999999" value="2481"></label></details><label>Musical mood<select id="mood"><option value="warm">Warm / major</option><option value="dream">Dreamy / pentatonic</option><option value="night">Night / minor</option></select></label><label>Paper color<input id="paper" type="color" value="#fbf7ec"></label><button id="shuffle">Find another melody</button><p><button id="share">Copy card link</button></p><input id="link" hidden readonly aria-label="Postcard link"><small>Anyone with the link can read the card and play its melody.</small></aside></main><script>
'use strict';const $=id=>document.getElementById(id);let audio=null,nodes=[],timer=0;const ids=['recipient','text','sender','seed','mood','paper'];function state(){return{version:1,recipient:$('recipient').value,text:$('text').value,sender:$('sender').value,seed:Number($('seed').value),mood:$('mood').value,paper:$('paper').value};}function melody(seed,mood){let n=seed>>>0;const scale={warm:[0,4,7,9,12],dream:[0,2,7,9,14],night:[0,3,7,10,12]}[mood];return Array.from({length:12},()=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return 220*2**(scale[n%scale.length]/12);});}function paint(){const s=state();$('to').textContent=s.recipient;$('message').textContent=s.text;$('from').textContent=s.sender;document.querySelector('.card').style.background=s.paper;const channels=[1,3,5].map(i=>parseInt(s.paper.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4),ink=channels[0]*.2126+channels[1]*.7152+channels[2]*.0722>.179?'#000000':'#ffffff';for(const id of ['to','message','from'])$(id).style.color=ink;const ctx=$('visual').getContext('2d');ctx.clearRect(0,0,700,110);ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.beginPath();melody(s.seed,s.mood).forEach((frequency,i)=>{const x=15+i*60,y=95-(frequency-200)/7;ctx.moveTo(x,100);ctx.lineTo(x,y);ctx.arc(x,y,4,0,Math.PI*2);});ctx.stroke();try{localStorage.setItem('sesli-kartpostal',JSON.stringify(s));}catch{}}
function stop(){clearTimeout(timer);nodes.forEach(node=>{try{node.stop();}catch{}});nodes=[];}
$('play').onclick=async()=>{try{stop();const T=window.AudioContext||window.webkitAudioContext;if(!T)throw Error('Audio support is unavailable.');if(!audio)audio=new T();await audio.resume();const notes=melody(state().seed,state().mood),start=audio.currentTime+.03;notes.forEach((frequency,i)=>{const osc=audio.createOscillator(),gain=audio.createGain(),time=start+i*.43;osc.type='sine';osc.frequency.value=frequency;gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(.16,time+.03);gain.gain.exponentialRampToValueAtTime(.0001,time+.9);osc.connect(gain);gain.connect(audio.destination);osc.start(time);osc.stop(time+1);nodes.push(osc);});$('status').textContent='Playing the twelve-note card melody.';timer=setTimeout(()=>{$('status').textContent='The melody has finished. Send the card to someone.';},6500);}catch(e){$('status').textContent=e.message;}};$('stop').onclick=()=>{stop();$('status').textContent='Audio stopped.';};ids.forEach(id=>$(id).oninput=paint);$('shuffle').onclick=()=>{$('seed').value=1+Math.floor(Math.random()*999999);paint();};function encode(s){return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(s)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}function valid(s){if(!s||s.version!==1||!Number.isInteger(s.seed)||s.seed<1||s.seed>999999||!['warm','dream','night'].includes(s.mood)||!/^#[a-f0-9]{6}$/i.test(s.paper))throw Error('Invalid card data.');for(const [key,max]of [['recipient',40],['text',350],['sender',40]])if(typeof s[key]!=='string'||s[key].length>max)throw Error('Invalid card message.');return s;}$('share').onclick=async()=>{try{const s=valid(state()),url=new URL(location.href);url.hash='card='+encode(s);$('link').hidden=false;$('link').value=url.href;try{await navigator.clipboard.writeText(url.href);$('status').textContent='Your card link was copied.';}catch{$('link').select();$('status').textContent='Copy the selected link.';}}catch(e){$('status').textContent=e.message;}};try{let data=null;if(location.hash.startsWith('#card=')){if(location.hash.length>5000)throw Error();data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(location.hash.slice(6).replace(/-/g,'+').replace(/_/g,'/')),x=>x.charCodeAt(0))));}else{const raw=localStorage.getItem('sesli-kartpostal');if(raw)data=JSON.parse(raw);}if(data){valid(data);ids.forEach(id=>$(id).value=data[id]);}}catch{$('status').textContent='The card could not be opened. A new card is ready.';}paint();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
