<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Postcard — Send a small melody</title><style>*{box-sizing:border-box}body{font:16px Georgia,serif;background:#ffffff;color:#181818;margin:0}main{max-width:1000px;margin:30px auto;padding:20px;display:grid;grid-template-columns:1fr 300px;gap:25px}h1{font-size:30px;margin:5px 0 12px}.card{min-height:470px;background:#ffffff;border:1px solid #ffffff;padding:36px;position:relative;box-shadow:none}#to{font-size:15px;color:#b8b8b8}#message{font-size:27px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}#from{font-style:italic}canvas{width:100%;height:110px}button,input,textarea,select{font:14px system-ui}label{display:grid;gap:6px;margin:14px 0;font:13px system-ui}input,textarea,select{padding:9px;border:1px solid #ffffff;background:#ffffff;color:#181818;width:100%}button{padding:11px 15px;border:1px solid #b8b8b8;background:#181818;color:white;cursor:pointer}button:hover{background:#b8b8b8}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}#link{font-size:11px}#status{font:13px/1.7 system-ui;min-height:40px}small{font:12px/1.6 system-ui;color:#b8b8b8}@media(max-width:700px){main{grid-template-columns:1fr;margin:5px auto}.card{padding:24px;min-height:400px}}</style><main><section><h1>Audio Postcard</h1><p>A message, a color and a melody made for this card.</p><article class="card"><p id="to"></p><p id="message"></p><p id="from"></p><canvas id="visual" width="700" height="110" aria-label="Card melody visualization"></canvas><div class="actions"><button id="play">Listen to card</button><button id="stop">Stop</button></div></article><p id="status" role="status" aria-live="polite">Audio starts only when you press Listen.</p></section><aside><label>To<input id="recipient" maxlength="40" value="Have a good day"></label><label>Card message<textarea id="text" maxlength="350" rows="6">A small sound for you today. I hope you find a quiet moment in the middle of everything.</textarea></label><label>From<input id="sender" maxlength="40" value="From a friend"></label><label>Melody seed<input id="seed" type="number" min="1" max="999999" value="2481"></label><label>Musical mood<select id="mood"><option value="warm">Warm / major</option><option value="dream">Dreamy / pentatonic</option><option value="night">Night / minor</option></select></label><label>Paper color<input id="paper" type="color" value="#fbf7ec"></label><button id="shuffle">Find another melody</button><p><button id="share">Playable card link</button></p><input id="link" readonly aria-label="Postcard link"><small>The link carries the message and melody recipe. Recipients listen in their own browser. No voice recording is used.</small></aside></main><script>
'use strict';const $=id=>document.getElementById(id);let audio=null,nodes=[],timer=0;const ids=['recipient','text','sender','seed','mood','paper'];function state(){return{version:1,recipient:$('recipient').value,text:$('text').value,sender:$('sender').value,seed:Number($('seed').value),mood:$('mood').value,paper:$('paper').value};}function melody(seed,mood){let n=seed>>>0;const scale={warm:[0,4,7,9,12],dream:[0,2,7,9,14],night:[0,3,7,10,12]}[mood];return Array.from({length:12},()=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return 220*2**(scale[n%scale.length]/12);});}function paint(){const s=state();$('to').textContent=s.recipient;$('message').textContent=s.text;$('from').textContent=s.sender;document.querySelector('.card').style.background=s.paper;const ctx=$('visual').getContext('2d');ctx.clearRect(0,0,700,110);ctx.strokeStyle='#806248';ctx.lineWidth=2;ctx.beginPath();melody(s.seed,s.mood).forEach((frequency,i)=>{const x=15+i*60,y=95-(frequency-200)/7;ctx.moveTo(x,100);ctx.lineTo(x,y);ctx.arc(x,y,4,0,Math.PI*2);});ctx.stroke();try{localStorage.setItem('sesli-kartpostal',JSON.stringify(s));}catch{}}
function stop(){clearTimeout(timer);nodes.forEach(node=>{try{node.stop();}catch{}});nodes=[];}
$('play').onclick=async()=>{try{stop();const T=window.AudioContext||window.webkitAudioContext;if(!T)throw Error('Audio support is unavailable.');if(!audio)audio=new T();await audio.resume();const notes=melody(state().seed,state().mood),start=audio.currentTime+.03;notes.forEach((frequency,i)=>{const osc=audio.createOscillator(),gain=audio.createGain(),time=start+i*.43;osc.type='sine';osc.frequency.value=frequency;gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(.16,time+.03);gain.gain.exponentialRampToValueAtTime(.0001,time+.9);osc.connect(gain);gain.connect(audio.destination);osc.start(time);osc.stop(time+1);nodes.push(osc);});$('status').textContent='Playing the twelve-note card melody.';timer=setTimeout(()=>{$('status').textContent='The melody has finished. Send the card to someone.';},6500);}catch(e){$('status').textContent=e.message;}};$('stop').onclick=()=>{stop();$('status').textContent='Audio stopped.';};ids.forEach(id=>$(id).oninput=paint);$('shuffle').onclick=()=>{$('seed').value=1+Math.floor(Math.random()*999999);paint();};function encode(s){return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(s)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}function valid(s){if(!s||s.version!==1||!Number.isInteger(s.seed)||s.seed<1||s.seed>999999||!['warm','dream','night'].includes(s.mood)||!/^#[a-f0-9]{6}$/i.test(s.paper))throw Error('Invalid card data.');for(const [key,max]of [['recipient',40],['text',350],['sender',40]])if(typeof s[key]!=='string'||s[key].length>max)throw Error('Invalid card message.');return s;}$('share').onclick=async()=>{try{const s=valid(state()),url=new URL(location.href);url.hash='card='+encode(s);$('link').value=url.href;try{await navigator.clipboard.writeText(url.href);$('status').textContent='Your card link was copied.';}catch{$('link').select();$('status').textContent='Copy the selected link.';}}catch(e){$('status').textContent=e.message;}};try{let data=null;if(location.hash.startsWith('#card=')){if(location.hash.length>5000)throw Error();data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(location.hash.slice(6).replace(/-/g,'+').replace(/_/g,'/')),x=>x.charCodeAt(0))));}else{const raw=localStorage.getItem('sesli-kartpostal');if(raw)data=JSON.parse(raw);}if(data){valid(data);ids.forEach(id=>$(id).value=data[id]);}}catch{$('status').textContent='The card could not be opened. A new card is ready.';}paint();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
