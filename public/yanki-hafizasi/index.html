e:.85rem}progress{width:100%;height:8px;accent-color:#c8a4f4}@media(max-width:600px){header{display:block}main{padding:16px}.pad{min-height:122px}.instructions{grid-template-columns:1fr}.stage{padding:16px}.settings{gap:10px}.scoreboard strong{font-size:1.4rem}}

</head><body><header><div><h1>Echo Memory</h1><p>Watch the sequence, then repeat it.</p></div><a href="../">Tools</a></header><main><div class="settings"><label>Mode <select id="mode"><option value="order">Order</option><option value="rhythm">Order + rhythm</option></select></label><label>Tempo <select id="speed"><option value="1">Normal</option><option value="1.45">Slow</option></select></label><label><input type="checkbox" id="mute"> Mute audio</label></div>
<div class="scoreboard"><div><small>Round</small><strong id="round">—</strong></div><div><small>Lives</small><strong id="lives">3</strong></div><div><small>Score</small><strong id="score">0</strong></div><div><small>Best in this mode</small><strong id="best">0</strong></div></div>
<section class="stage"><div id="status" class="status" role="status" aria-live="polite">Start to see the first sequence.</div><div class="pads"><button class="pad" id="pad0" style="--color:#a0e5d1" aria-label="One, circle, C note">1 · ●<small>C</small></button><button class="pad" id="pad1" style="--color:#eac788" aria-label="Two, triangle, E note">2 · ▲<small>E</small></button><button class="pad" id="pad2" style="--color:#b2c4fa" aria-label="Three, square, G note">3 · ■<small>G</small></button><button class="pad" id="pad3" style="--color:#efa6ca" aria-label="Four, diamond, B note">4 · ◆<small>B</small></button></div><div id="trace" class="trace"></div><progress id="progress" value="0" max="3" aria-label="Number of repeated steps"></progress><div class="actions"><button id="start" class="primary">Start game</button><button id="replay" disabled>Replay (−1 life)</button></div></section>
<p id="controls" class="fine">Use the pads or keys 1–4.</p>
<details><summary>Round and record rules</summary><p>Each completed round adds one step. Finish 20 rounds. Best scores are saved on this device for each mode.</p></details>
</main><script>
'use strict';const $=id=>document.getElementById(id),pads=[0,1,2,3].map(i=>$('pad'+i)),frequency=[261.63,329.63,392,493.88];let context=null,game=null,token=0,flashTokens=[0,0,0,0],holds=new Map();
function getBest(){try{return Number(localStorage.getItem('yanki-best-'+$('mode').value))||0}catch{return 0}}function updateBest(){if(game&&game.score>getBest())try{localStorage.setItem('yanki-best-'+game.mode,String(game.score))}catch{}$('best').textContent=getBest()}
function audioReady(){if($('mute').checked)return;try{context??=new (window.AudioContext||window.webkitAudioContext)();if(context.state==='suspended')context.resume().catch(()=>{})}catch{$('mute').checked=true}}
function tone(index,duration){if($('mute').checked||!context||context.state!=='running')return;const oscillator=context.createOscillator(),gain=context.createGain(),now=context.currentTime;oscillator.type='sine';oscillator.frequency.value=frequency[index];gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.12,now+.02);gain.gain.setValueAtTime(.12,now+Math.max(.03,duration/1000-.05));gain.gain.linearRampToValueAtTime(0,now+duration/1000);oscillator.connect(gain);gain.connect(context.destination);oscillator.start(now);oscillator.stop(now+duration/1000+.02);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()}}
function flash(index,duration){const id=++flashTokens[index];pads[index].classList.add('lit');tone(index,duration);setTimeout(()=>{if(flashTokens[index]===id)pads[index].classList.remove('lit')},duration)}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}function step(){return{pad:Math.floor(Math.random()*4),long:Math.random()>.62}}
function paint(){if(!game)return;$('round').textContent=game.round+' / 20';$('lives').textContent=game.lives;$('score').textContent=game.score;$('progress').max=game.sequence.length;$('progress').value=game.input;$('replay').disabled=game.phase!=='input'||game.lives<=1;pads.forEach(p=>p.disabled=game.phase!=='input');$('mode').disabled=game.phase!=='done';$('speed').disabled=game.phase!=='done';$('start').textContent=game.phase==='done'?"Play again":"Restart game";updateBest()}
async function play(note){const myToken=++token;holds.clear();game.phase='playback';game.input=0;paint();$('trace').textContent='';$('status').textContent=note||"Listen and watch.";await wait(650);for(let i=0;i<game.sequence.length;i++){if(myToken!==token)return;const item=game.sequence[i],duration=(game.mode==='rhythm'?(item.long?720:260):390)*game.speed;flash(item.pad,duration);$('status').textContent="Watch: "+(i+1)+' / '+game.sequence.length+(game.mode==='rhythm'?' · '+(item.long?"long":"short"):'');await wait(duration+230*game.speed)}if(myToken!==token)return;game.phase='input';$('status').textContent="Your turn! Repeat "+game.sequence.length+" steps.";$('trace').textContent='';paint()}
function finish(message){token++;game.phase='done';holds.clear();$('status').textContent=message;$('trace').textContent="Last sequence: "+game.sequence.map(s=>(s.pad+1)+(game.mode==='rhythm'?(s.long?" long":" short"):'')).join(' · ');paint()}
function answer(index,duration){if(!game||game.phase!=='input')return;const expected=game.sequence[game.input],isLong=duration>=450,correct=index===expected.pad&&(game.mode!=='rhythm'||isLong===expected.long);flash(index,Math.min(600,Math.max(180,duration)));if(!correct){game.lives--;paint();if(game.lives<=0){finish("Sequence missed. No lives remaining.");return}play("The next step was "+(expected.pad+1)+(game.mode==='rhythm'?' · '+(expected.long?"long":"short"):'')+" . Watch the sequence again.");return}game.input++;$('trace').textContent="Correct: "+game.input+' / '+game.sequence.length;paint();if(game.input===game.sequence.length){game.score+=game.sequence.length*100+game.round*10;updateBest();if(game.round===20){finish("All twenty rounds complete!");return}game.phase='between';paint();$('status').textContent="Correct! Adding another step.";const myToken=++token;setTimeout(()=>{if(myToken!==token)return;game.round++;game.sequence.push(step());play()},950)}}
function press(index,id){if(!game||game.phase!=='input'||holds.has(id))return;audioReady();holds.set(id,{index,time:performance.now()});pads[index].classList.add('lit')}
function release(id){const held=holds.get(id);if(!held)return;holds.delete(id);pads[held.index].classList.remove('lit');answer(held.index,performance.now()-held.time)}
pads.forEach((pad,index)=>{pad.disabled=true;pad.addEventListener('pointerdown',event=>{if(event.button&&event.button!==0)return;event.preventDefault();pad.setPointerCapture(event.pointerId);press(index,'p'+event.pointerId)});pad.addEventListener('pointerup',event=>release('p'+event.pointerId));pad.addEventListener('pointercancel',event=>{holds.delete('p'+event.pointerId);pad.classList.remove('lit')});pad.addEventListener('click',event=>{if(event.detail===0){audioReady();answer(index,220)}})});
document.addEventListener('keydown',event=>{const index=Number(event.key)-1;if(index<0||index>3||!/[1-4]/.test(event.key)||event.key.length!==1||event.repeat||event.target.tagName==='SELECT')return;event.preventDefault();press(index,'k'+event.key)});document.addEventListener('keyup',event=>release('k'+event.key));window.addEventListener('blur',()=>{holds.clear();pads.forEach(p=>p.classList.remove('lit'))});
function updateControls(){$('controls').textContent=$('mode').value==='rhythm'?"Use pads or keys 1–4. Tap short notes; hold long notes for at least 0.45 seconds.":"Use the pads or keys 1–4."}$('start').onclick=()=>{token++;holds.clear();pads.forEach((p,i)=>{flashTokens[i]++;p.classList.remove('lit')});audioReady();game={mode:$('mode').value,speed:Number($('speed').value),sequence:[step(),step(),step()],round:1,lives:3,score:0,input:0,phase:'playback'};play("Watch the first sequence.")};$('replay').onclick=()=>{if(!game||game.phase!=='input'||game.lives<=1)return;game.lives--;play("Replay (−1 life).")};$('mode').onchange=()=>{updateBest();updateControls()};$('mute').onchange=()=>{if(!$('mute').checked)audioReady()};updateBest();updateControls();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></body></html>
