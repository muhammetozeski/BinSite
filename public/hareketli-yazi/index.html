<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Type — Keyframe typography studio</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1250px;margin:auto;padding:24px}h1{font:32px Georgia}.work{display:grid;grid-template-columns:280px 1fr;gap:24px}p{line-height:1.8}button,input,select{font:inherit;padding:8px;border:1px solid #b8b8b8;background:#ffffff;color:inherit}button{cursor:pointer}button:hover{background:#ffffff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}label{display:grid;gap:6px;margin:12px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair input{width:100%;box-sizing:border-box}canvas{width:100%;height:auto;background:#181818;display:block}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}#scrub{width:100%;box-sizing:border-box}#keys{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}#status{min-height:30px}.small{font-size:12px}#track{width:100%}@media(max-width:750px){.work{display:flex;flex-direction:column-reverse}}</style><main><h1>Motion Type</h1><p>Add position, scale, rotation and opacity keys to text layers. The timeline interpolates their movement.</p><div class="work"><aside><label>Text layer<select id="track"></select></label><button id="addTrack">+ Add text</button><label>Text<input id="text" maxlength="55"></label><label>Color<input id="color" type="color"></label><div class="pair"><label>X<input id="x" type="number" min="-200" max="1100"></label><label>Y<input id="y" type="number" min="-200" max="720"></label><label>Scale<input id="scale" type="number" min="0.1" max="5" step="0.1"></label><label>Rotation, degrees<input id="angle" type="number" min="-720" max="720"></label><label>Opacity<input id="opacity" type="number" min="0" max="1" step="0.1"></label><label>Font size<input id="size" type="number" min="12" max="120"></label></div><label>Transition to the next key<select id="ease"><option value="smooth">Smooth</option><option value="linear">Linear</option><option value="back">Overshoot and settle</option></select></label><div class="bar"><button id="key">Add key at this time</button><button id="removeKey">Remove this key</button></div><p class="small">Editing properties previews a temporary pose. Add a key to keep it, then move the playhead to another time.</p></aside><section><canvas id="stage" width="900" height="520" aria-label="Keyframe text animation"></canvas><label>Time: <output id="time">0,00 sec</output><input id="scrub" type="range" min="0" max="6" step="0.01" value="0"></label><div id="keys"></div><div class="bar"><button id="play">▶ Play</button><button id="sample">Example choreography</button><label>Duration, sec<input id="duration" type="number" min="2" max="20" value="6" style="width:65px"></label><button id="html">Download standalone animation HTML</button><button id="save">Download project</button><button id="open">Open project</button><input id="file" type="file" accept=".json,application/json" hidden></div><p id="status" role="status" aria-live="polite">A three-layer example is ready. Select its keys to inspect the motion.</p></section></div></main><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('stage'),props=['x','y','scale','angle','opacity'];let project=null,selected=0,draft=null,running=false,frame=0,start=0;function interpolate(keys,time){if(time<=keys[0].time)return{...keys[0]};for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(time<=b.time){let t=(time-a.time)/(b.time-a.time);t=a.ease==='smooth'?t*t*(3-2*t):a.ease==='back'?1+2.70158*(t-1)**3+1.70158*(t-1)**2:t;return Object.fromEntries(props.map(p=>[p,a[p]+(b[p]-a[p])*t]));}}return{...keys[keys.length-1]};}function draw(time,override=null){const ctx=canvas.getContext('2d');ctx.fillStyle='#14232c';ctx.fillRect(0,0,900,520);project.tracks.forEach((track,index)=>{const p=override&&index===selected?override:interpolate(track.keys,time);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle*Math.PI/180);ctx.scale(p.scale,p.scale);ctx.globalAlpha=Math.max(0,Math.min(1,p.opacity));ctx.fillStyle=track.color;ctx.font=`bold ${track.size}px system-ui`;ctx.textAlign='center';ctx.fillText(track.text,0,0);ctx.restore();});$('time').textContent=time.toFixed(2)+' sec';}function keyList(){const f=document.createDocumentFragment();for(const key of project.tracks[selected].keys){const button=document.createElement('button');button.textContent=key.time.toFixed(2)+' sec';button.onclick=()=>{stop();$('scrub').value=key.time;loadPose();};f.append(button);}$('keys').replaceChildren(f);}function loadPose(){const track=project.tracks[selected],time=Number($('scrub').value);draft=interpolate(track.keys,time);props.forEach(p=>$(p).value=Number(draft[p].toFixed(3)));$('text').value=track.text;$('color').value=track.color;$('size').value=track.size;const near=track.keys.find(k=>Math.abs(k.time-time)<.02);$('ease').value=near?near.ease:'smooth';keyList();draw(time);}function list(){const f=document.createDocumentFragment();project.tracks.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${t.text||'Text'}`;f.append(o);});$('track').replaceChildren(f);$('track').value=selected;$('duration').value=project.duration;$('scrub').max=project.duration;loadPose();}function sample(){const key=(time,x,y,scale,angle,opacity)=>({time,x,y,scale,angle,opacity,ease:'smooth'});project={version:1,duration:6,tracks:[{text:'IDEA',color:'#f0be68',size:95,keys:[key(0,110,180,.4,-40,0),key(1.4,450,185,1,0,1),key(4,450,185,1,0,1),key(6,750,160,1.5,18,0)]},{text:'finds motion.',color:'#d9edea',size:55,keys:[key(0,450,350,.9,0,0),key(1.4,450,350,.9,0,0),key(2.6,450,310,1,0,1),key(6,450,310,1,0,1)]},{text:'A SMALL KEY, A NEW MOVEMENT',color:'#8fb5c0',size:18,keys:[key(0,450,445,1,0,0),key(3.3,450,445,1,0,0),key(4.3,450,445,1,0,1)]}]};selected=0;$('scrub').value=0;list();}function stop(){running=false;cancelAnimationFrame(frame);$('play').textContent='▶ Play';}function tick(now){if(!running)return;const t=((now-start)/1000)%project.duration;$('scrub').value=t;draw(t);frame=requestAnimationFrame(tick);}$('play').onclick=()=>{if(running){stop();loadPose();return;}draft=null;running=true;start=performance.now()-Number($('scrub').value)*1000;$('play').textContent='Ⅱ Pause';frame=requestAnimationFrame(tick);};$('track').onchange=()=>{selected=Number($('track').value);loadPose();};$('scrub').oninput=()=>{stop();loadPose();};for(const p of props)$(p).oninput=()=>{stop();const value=Number($(p).value);if(!Number.isFinite(value))return;draft[p]=value;draw(Number($('scrub').value),draft);};for(const p of ['text','color','size'])$(p).oninput=()=>{const track=project.tracks[selected];track[p]=p==='size'?Math.max(12,Math.min(120,Number($(p).value)||12)):$(p).value;draw(Number($('scrub').value),draft);};$('key').onclick=()=>{const time=Number($('scrub').value),track=project.tracks[selected],pose=Object.fromEntries(props.map(p=>[p,Number($(p).value)]));if(props.some(p=>!Number.isFinite(pose[p]))||pose.scale<.1||pose.scale>5||pose.opacity<0||pose.opacity>1){$('status').textContent='Enter valid scale and opacity values.';return;}track.keys=track.keys.filter(k=>Math.abs(k.time-time)>.02);track.keys.push({time,...pose,ease:$('ease').value});track.keys.sort((a,b)=>a.time-b.time);loadPose();$('status').textContent='Keyframe saved.';};$('removeKey').onclick=()=>{const track=project.tracks[selected];if(track.keys.length>1){track.keys=track.keys.filter(k=>Math.abs(k.time-Number($('scrub').value))>.02);loadPose();}};$('duration').onchange=()=>{const value=Number($('duration').value);if(Number.isFinite(value)&&value>=2&&value<=20){project.duration=value;$('scrub').max=value;stop();loadPose();}};$('addTrack').onclick=()=>{if(project.tracks.length>=8)return;project.tracks.push({text:'New text',color:'#ffffff',size:55,keys:[{time:0,x:450,y:260,scale:1,angle:0,opacity:1,ease:'smooth'}]});selected=project.tracks.length-1;list();};function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}$('save').onclick=()=>download(new Blob([JSON.stringify(project)],{type:'application/json'}),'motion-type.json');function standaloneEngine(model){const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');const props=['x','y','scale','angle','opacity'];function pose(keys,time){if(time<=keys[0].time)return keys[0];for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(time<=b.time){let t=(time-a.time)/(b.time-a.time);t=a.ease==='smooth'?t*t*(3-2*t):a.ease==='back'?1+2.70158*(t-1)**3+1.70158*(t-1)**2:t;return Object.fromEntries(props.map(p=>[p,a[p]+(b[p]-a[p])*t]));}}return keys[keys.length-1];}function tick(time){const t=time/1000%model.duration;ctx.fillStyle='#14232c';ctx.fillRect(0,0,900,520);model.tracks.forEach(track=>{const p=pose(track.keys,t);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle*Math.PI/180);ctx.scale(p.scale,p.scale);ctx.globalAlpha=Math.max(0,Math.min(1,p.opacity));ctx.fillStyle=track.color;ctx.font=`bold ${track.size}px system-ui`;ctx.textAlign='center';ctx.fillText(track.text,0,0);ctx.restore();});requestAnimationFrame(tick);}requestAnimationFrame(tick);}$('html').onclick=()=>{const data=JSON.stringify(project).replace(/</g,'\\u003c'),html='<!doctype html><html lang="en"><meta charset="utf-8"><title>Motion type</title><style>body{margin:0;background:#181818;display:grid;place-items:center;min-height:100vh}canvas{max-width:100%;height:auto}</style><canvas width="900" height="520" aria-label="Text animation"></canvas><script>('+standaloneEngine.toString()+')('+data+');<'+ '/script></html>';download(new Blob([html],{type:'text/html'}),'text-animation.html');};$('sample').onclick=()=>{stop();sample();};$('open').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{if(file.size>100000)throw Error('The file is too large.');const s=JSON.parse(await file.text());if(!s||s.version!==1||!Number.isFinite(s.duration)||s.duration<2||s.duration>20||!Array.isArray(s.tracks)||s.tracks.length<1||s.tracks.length>8||s.tracks.some(t=>typeof t.text!=='string'||t.text.length>55||!/^#[0-9a-f]{6}$/i.test(t.color)||!Number.isFinite(t.size)||t.size<12||t.size>120||!Array.isArray(t.keys)||t.keys.length<1||t.keys.length>100||t.keys.some(k=>!Number.isFinite(k.time)||k.time<0||k.time>20||props.some(p=>!Number.isFinite(k[p])||Math.abs(k[p])>2000)||k.scale<.1||k.scale>5||k.opacity<0||k.opacity>1||!['smooth','linear','back'].includes(k.ease))))throw Error('Invalid project data.');for(const t of s.tracks){t.keys.sort((a,b)=>a.time-b.time);if(t.keys.some((k,i)=>i&&Math.abs(k.time-t.keys[i-1].time)<.001))throw Error('Two keys cannot share the same time.');}stop();project=s;selected=0;$('scrub').value=0;list();}catch(e){$('status').textContent=e.message;}$('file').value='';};sample();
</script><script src="/assets/revenue.js" data-binsite-revenue defer></script></html>
