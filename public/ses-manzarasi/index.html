<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound Landscape — Build a quiet sound space</title><style>body{margin:0;background:#181818;color:#ffffff;font:15px system-ui}main{max-width:1000px;margin:35px auto;padding:25px}h1{font:37px Georgia;margin:0}p{line-height:1.8;color:#ffffff}.presets{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}button,select,input{font:inherit}button,select{background:#181818;border:1px solid #b8b8b8;color:inherit;padding:12px 18px;cursor:pointer;border-radius:0}button:hover{background:#181818}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffffff;outline-offset:2px}#layers{display:grid;grid-template-columns:1fr 1fr;gap:20px}.layer{padding:24px;background:#181818;border:1px solid #b8b8b8;border-radius:0}.layer h2{font:23px Georgia;margin:0 0 10px}.layer input{width:100%;accent-color:#ffffff}.layer p{font-size:12px;min-height:40px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:25px 0}label{font-size:12px}#status{min-height:30px;color:#ffffff}#link{width:100%;box-sizing:border-box;background:#181818;color:#ffffff;border:1px solid #b8b8b8;padding:10px;font-size:11px}.breath{height:8px;background:#181818;border-radius:0;overflow:hidden}.breath i{display:block;height:100%;width:30%;background:#ffffff}body.playing .breath i{animation:flow 9s ease-in-out infinite alternate}@keyframes flow{to{transform:translateX(230%)}}@media(prefers-reduced-motion:reduce){body.playing .breath i{animation:none}}@media(max-width:600px){main{margin:0}#layers{grid-template-columns:1fr}}</style>

<main><h1>Sound Landscape</h1><p>Mix rain, wind and waves into your own soundscape.</p><div class="presets"><button data-preset="forest">Forest clearing</button><button data-preset="shore">Evening shore</button><button data-preset="rain">Rainy window</button></div><div class="bar"><button id="play">Play soundscape</button><label>Stop timer <select id="minutes"><option value="0">Until I stop it</option><option value="5">5 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">60 minutes</option></select></label><button id="share">Copy mix link</button></div><div id="layers"></div><p id="status" role="status" aria-live="polite">Choose a mix, then press Play.</p><input id="link" hidden readonly aria-label="Soundscape link"><details class="readability-help"><summary>Help</summary><p style="font-size:12px">The timer fades out over the final five seconds.</p></details></main><script>
'use strict';const $=id=>document.getElementById(id),names=['Wind','Rain','Waves','Distant bells'],descriptions=['Soft wind.','Steady, fine rainfall.','Slow waves, rising and receding.','Occasional soft bells.'];let levels=[50,10,25,15],audio=null,master=null,layerGains=[],nodes=[],chimeTimer=0,closeTimer=0,endTimer=0,running=false;for(let i=0;i<4;i++){const box=document.createElement('section');box.className='layer';const h=document.createElement('h2');h.textContent=names[i];const p=document.createElement('p');p.textContent=descriptions[i];const input=document.createElement('input');input.type='range';input.min=0;input.max=100;input.value=levels[i];input.id='layer'+i;input.setAttribute('aria-label',names[i]+' level');input.oninput=()=>{levels[i]=Number(input.value);if(layerGains[i]&&audio)layerGains[i].gain.setTargetAtTime(levels[i]/100*.28,audio.currentTime,.1);};box.append(h,p,input);$('layers').append(box);}function apply(values){levels=values.slice();for(let i=0;i<4;i++){$('layer'+i).value=levels[i];if(layerGains[i]&&audio)layerGains[i].gain.setTargetAtTime(levels[i]/100*.28,audio.currentTime,.1);}}const presets={forest:[75,8,0,20],shore:[20,0,80,8],rain:[25,85,10,0]};document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>apply(presets[b.dataset.preset]));function stop(){running=false;clearInterval(chimeTimer);clearTimeout(closeTimer);clearTimeout(endTimer);nodes.forEach(n=>{try{n.stop();}catch{}n.disconnect();});nodes=[];if(master)master.disconnect();layerGains=[];document.body.classList.remove('playing');$('play').textContent='Play soundscape';}function chime(){if(!running)return;const start=audio.currentTime,base=[220,261.63,293.66][Math.floor(Math.random()*3)];[1,1.5,2].forEach(mult=>{const osc=audio.createOscillator(),env=audio.createGain();osc.frequency.value=base*mult;env.gain.setValueAtTime(.0001,start);env.gain.exponentialRampToValueAtTime(.18,start+.02);env.gain.exponentialRampToValueAtTime(.0001,start+3);osc.connect(env);env.connect(layerGains[3]);osc.start(start);osc.stop(start+3.1);nodes.push(osc);osc.onended=()=>{osc.disconnect();nodes=nodes.filter(n=>n!==osc);};});}function timed(){clearTimeout(closeTimer);clearTimeout(endTimer);if(!running)return;const minutes=Number($('minutes').value);if(!minutes)return;closeTimer=setTimeout(()=>{if(master&&audio){master.gain.setValueAtTime(master.gain.value,audio.currentTime);master.gain.linearRampToValueAtTime(0,audio.currentTime+5);}},minutes*60000-5000);endTimer=setTimeout(()=>{stop();$('status').textContent='The selected timer ended. The soundscape stopped.';},minutes*60000);}async function play(){try{stop();const T=window.AudioContext||window.webkitAudioContext;if(!T)throw Error('This browser does not support sound synthesis.');if(!audio)audio=new T();await audio.resume();master=audio.createGain();master.gain.value=.65;const limiter=audio.createDynamicsCompressor();master.connect(limiter);limiter.connect(audio.destination);const noise=audio.createBuffer(1,audio.sampleRate*3,audio.sampleRate),data=noise.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;layerGains=levels.map(value=>{const g=audio.createGain();g.gain.value=value/100*.28;g.connect(master);return g;});for(let i=0;i<3;i++){const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),envelope=audio.createGain();source.buffer=noise;source.loop=true;filter.type=i===1?'highpass':'lowpass';filter.frequency.value=[650,4300,1000][i];envelope.gain.value=i===2?.6:.8;source.connect(filter);filter.connect(envelope);envelope.connect(layerGains[i]);const lfo=audio.createOscillator(),mod=audio.createGain();lfo.frequency.value=[.07,.21,.095][i];mod.gain.value=i===2?.35:.12;lfo.connect(mod);mod.connect(envelope.gain);lfo.start();source.start();nodes.push(source,lfo);}running=true;chime();chimeTimer=setInterval(chime,5000);document.body.classList.add('playing');$('play').textContent='Stop soundscape';$('status').textContent='Playing. Adjust the mix as you listen.';timed();}catch(e){stop();$('status').textContent=e.message;}}$('play').onclick=()=>{if(running){stop();$('status').textContent='Soundscape stopped.';}else play();};$('minutes').onchange=timed;$('share').onclick=async()=>{const u=new URL(location.href);u.hash='mix='+levels.join('-');$('link').hidden=false;$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Sound mix link copied.';}catch{$('link').select();}};if(location.hash.startsWith('#mix=')){const values=location.hash.slice(5).split('-').map(Number);if(values.length===4&&values.every(v=>Number.isInteger(v)&&v>=0&&v<=100))apply(values);}window.addEventListener('pagehide',stop);
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
