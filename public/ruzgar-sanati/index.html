<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wind Art — Draw invisible forces</title><style>body{margin:0;background:#181818;color:#ffffff;font:14px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:31px}p{line-height:1.8;color:#b8b8b8}.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0}button,input,select{font:inherit}button,select{background:#181818;color:inherit;border:1px solid #b8b8b8;padding:10px 13px;cursor:pointer}button:hover{background:#181818}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffffff;outline-offset:2px}label{display:grid;gap:6px;font-size:12px}input[type=range]{accent-color:#b8b8b8;width:120px}.stage{position:relative}canvas{display:block;width:100%;height:auto;background:#181818;touch-action:none}#overlay{position:absolute;inset:0;background:transparent;cursor:crosshair}#status{min-height:25px}.hint{font-size:12px}</style>

<main><h1>Wind Art</h1><p>Draw wind arrows and guide a stream of moving particles.</p><div class="bar"><button id="play">▶ Start flow</button><button id="reset">Reset particles</button><label>Gravity<input id="gravity" type="range" min="-60" max="100" value="10"></label><label>Wind strength<input id="strength" type="range" min="10" max="180" value="90"></label><label>Trail fade speed<input id="trail" type="range" min="1" max="25" value="5"></label><label>Color<select id="palette"><option value="sea">Sea light</option><option value="ember">Embers</option><option value="rainbow">Color spectrum</option></select></label></div><label>Canvas action<select id="canvasMode"><option value="wind">Draw wind arrows</option><option value="source">Move particle source</option></select></label><div class="stage"><canvas id="art" width="1050" height="650"></canvas><canvas id="overlay" width="1050" height="650" aria-label="Force-arrow editor"></canvas></div><div class="bar"><button id="vortex">Vortex example</button><button id="remove">Remove last wind arrow</button><button id="clear">Remove all wind arrows</button><button id="png">Download artwork</button><button id="share">Copy wind setup link</button></div><input id="link" hidden readonly aria-label="Wind field link" style="width:100%;box-sizing:border-box;padding:8px;font-size:11px"><p id="status" role="status" aria-live="polite">Choose an action above, then drag an arrow or tap a source position.</p><details class="readability-help"><summary>Help</summary><p class="hint">Saved images leave out the arrows. Sharing sends the wind setup, not the exact picture.</p></details></main><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('art'),ctx=canvas.getContext('2d'),overlay=$('overlay'),guide=overlay.getContext('2d');let fields=[],particles=[],source={x:180,y:325},drag=null,running=false,frame=0,last=0;function blank(){ctx.fillStyle='#08141e';ctx.fillRect(0,0,1050,650);}function particle(){return{x:source.x+(Math.random()-.5)*15,y:source.y+(Math.random()-.5)*15,vx:(Math.random()-.5)*70,vy:(Math.random()-.5)*70,life:Math.random()*8+2,hue:Math.random()*70};}function reset(){particles=Array.from({length:700},particle);blank();guides();}function guides(){guide.clearRect(0,0,1050,650);const draw=f=>{guide.strokeStyle='#d0a465';guide.lineWidth=2;guide.beginPath();guide.moveTo(f.x,f.y);guide.lineTo(f.x+f.dx,f.y+f.dy);const a=Math.atan2(f.dy,f.dx);guide.lineTo(f.x+f.dx-12*Math.cos(a-.5),f.y+f.dy-12*Math.sin(a-.5));guide.moveTo(f.x+f.dx,f.y+f.dy);guide.lineTo(f.x+f.dx-12*Math.cos(a+.5),f.y+f.dy-12*Math.sin(a+.5));guide.stroke();};fields.forEach(draw);if(drag)draw(drag);guide.strokeStyle='#84e5ea';guide.beginPath();guide.arc(source.x,source.y,9,0,Math.PI*2);guide.stroke();}function advance(dt){ctx.fillStyle=`rgba(8,20,30,${Number($('trail').value)/100})`;ctx.fillRect(0,0,1050,650);const strength=Number($('strength').value),gravity=Number($('gravity').value);for(let i=0;i<particles.length;i++){const p=particles[i],ox=p.x,oy=p.y;let ax=0,ay=gravity;for(const f of fields){const dist2=(p.x-f.x)**2+(p.y-f.y)**2,falloff=1/(1+dist2/14000),length=Math.hypot(f.dx,f.dy)||1;ax+=f.dx/length*strength*falloff;ay+=f.dy/length*strength*falloff;}p.vx=(p.vx+ax*dt)*Math.exp(-.18*dt);p.vy=(p.vy+ay*dt)*Math.exp(-.18*dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0||p.x<0||p.y<0||p.x>1050||p.y>650){particles[i]=particle();continue;}const palette=$('palette').value,hue=palette==='sea'?165+p.hue*.6:palette==='ember'?10+p.hue*.5:p.hue*5;ctx.strokeStyle=`hsla(${hue} 85% 65% / .55)`;ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(p.x,p.y);ctx.stroke();}}function tick(time){if(!running)return;advance(Math.min(.04,(time-last)/1000));last=time;frame=requestAnimationFrame(tick);}function stop(){running=false;cancelAnimationFrame(frame);$('play').textContent='▶ Start flow';}$('play').onclick=()=>{if(running){stop();return;}running=true;last=performance.now();$('play').textContent='Ⅱ Pause';frame=requestAnimationFrame(tick);};function point(e){const r=overlay.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1050,y:(e.clientY-r.top)/r.height*650};}overlay.onpointerdown=e=>{if(e.button!==0)return;const p=point(e);if(e.shiftKey||$('canvasMode').value==='source'){source=p;guides();return;}if(fields.length>=20){$('status').textContent='Use up to 20 force arrows.';return;}drag={...p,dx:0,dy:0};overlay.setPointerCapture(e.pointerId);};overlay.onpointermove=e=>{if(drag){const p=point(e);drag.dx=p.x-drag.x;drag.dy=p.y-drag.y;guides();}};overlay.onpointerup=()=>{if(drag&&Math.hypot(drag.dx,drag.dy)>10)fields.push({...drag});drag=null;guides();};overlay.onpointercancel=()=>{drag=null;guides();};$('reset').onclick=reset;$('remove').onclick=()=>{fields.pop();guides();};$('clear').onclick=()=>{fields=[];guides();};function vortex(){fields=[{x:350,y:170,dx:180,dy:30},{x:680,y:220,dx:0,dy:160},{x:650,y:480,dx:-200,dy:0},{x:330,y:440,dx:0,dy:-170}];source={x:260,y:320};reset();for(let i=0;i<180;i++)advance(.03);}$('vortex').onclick=vortex;$('png').onclick=()=>canvas.toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='wind-art.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);});$('share').onclick=async()=>{const u=new URL(location.href);u.hash='w='+btoa(JSON.stringify({fields,source,gravity:Number($('gravity').value),strength:Number($('strength').value),trail:Number($('trail').value),palette:$('palette').value}));$('link').hidden=false;$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Force field link copied.';}catch{$('link').select();}};vortex();if(location.hash.startsWith('#w='))try{if(location.hash.length>10000)throw Error();const s=JSON.parse(atob(location.hash.slice(3)));if(!s||!Array.isArray(s.fields)||s.fields.length>20||s.fields.some(f=>!['x','y','dx','dy'].every(k=>Number.isFinite(f[k]))||f.x<0||f.x>1050||f.y<0||f.y>650||Math.abs(f.dx)>1050||Math.abs(f.dy)>650)||!s.source||!Number.isFinite(s.source.x)||!Number.isFinite(s.source.y)||s.source.x<0||s.source.x>1050||s.source.y<0||s.source.y>650||!Number.isFinite(s.gravity)||s.gravity< -60||s.gravity>100||!Number.isFinite(s.strength)||s.strength<10||s.strength>180||!Number.isFinite(s.trail)||s.trail<1||s.trail>25||!['sea','ember','rainbow'].includes(s.palette))throw Error();fields=s.fields;source=s.source;for(const k of ['gravity','strength','trail','palette'])$(k).value=s[k];reset();for(let i=0;i<120;i++)advance(.03);}catch{$('status').textContent='The field could not be opened. A vortex example is ready.';}document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
