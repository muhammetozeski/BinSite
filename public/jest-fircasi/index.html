<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gesture Brush — Turn a movement into a brush</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1200px;margin:auto;padding:25px;display:grid;grid-template-columns:280px 1fr;gap:24px}h1{font:33px Georgia}p{font-size:13px;line-height:1.8}button,input{font:inherit}button{padding:10px 13px;background:#ffffff;color:inherit;border:1px solid #b8b8b8;cursor:pointer;margin:4px}button:hover{background:#ffffff}button:focus-visible,input:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}label{display:grid;gap:8px;margin:18px 0}canvas{width:100%;height:auto;background:#ffffff;display:block;touch-action:none;border:1px solid #b8b8b8}#gesture{background:#ffffff}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}#status{min-height:30px}#color{height:40px;width:100%}@media(max-width:750px){main{display:flex;flex-direction:column}}</style>

<main><aside><h1>Gesture Brush</h1><p>Draw a small gesture, then paint with it as a brush.</p><canvas id="gesture" width="400" height="250" aria-label="New brush gesture recording pad"></canvas><button id="record">Record a new gesture</button><button id="leaf">Leaf brush</button><label>Stamp size<input id="size" type="range" min="15" max="140" value="60"></label><label>Stamp spacing<input id="spacing" type="range" min="8" max="90" value="28"></label><label>Color<input id="color" type="color" value="#9f5d60"></label><label><span><input id="follow" type="checkbox" checked> Rotate stamps along the path</span></label><details class="readability-help"><summary>Help</summary><p>A completed gesture becomes a brush. Existing strokes keep their original brushes. The tool repeats your gesture along a path.</p></details></aside><section><canvas id="art" width="1000" height="700" aria-label="Recorded gesture painting canvas"></canvas><div class="bar"><button id="undo">Undo last stroke</button><button id="clear">Clear canvas</button><button id="demo">Leaf-path example</button><button id="png">Download image</button><button id="save">Download project</button><button id="open">Open project</button><input id="file" type="file" accept=".json,application/json" hidden></div><p id="status" role="status" aria-live="polite">The leaf brush is ready. Drag on the large canvas to make a pattern.</p></section></main><script>
'use strict';const $=id=>document.getElementById(id),art=$('art'),ctx=art.getContext('2d'),pad=$('gesture'),g=pad.getContext('2d');let brushes=[],brush=0,strokes=[],active=null,recording=false,points=[],last=null;function renderBrush(){g.clearRect(0,0,400,250);g.strokeStyle='#6c514c';g.lineWidth=2;g.beginPath();const path=recording?points:(brushes[brush]||[]).map(p=>[200+p[0]*100,125+p[1]*100]);path.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();}function stamp(s){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);ctx.scale(s.size,s.size);ctx.strokeStyle=s.color;ctx.lineWidth=1.3/s.size;ctx.lineJoin='round';ctx.beginPath();brushes[s.brush].forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.restore();}function render(){ctx.fillStyle='#fffcf4';ctx.fillRect(0,0,1000,700);strokes.forEach(line=>line.forEach(stamp));}function p(e,c,w,h){const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width*w,(e.clientY-r.top)/r.height*h];}$('record').onclick=()=>{if(brushes.length>=20){$('status').textContent='Record up to 20 different gestures.';return;}recording=true;points=[];renderBrush();$('status').textContent='Draw one continuous gesture in the small pad.';};pad.onpointerdown=e=>{if(!recording||e.button!==0)return;points=[p(e,pad,400,250)];pad.setPointerCapture(e.pointerId);pad.dataset.drawing='yes';};pad.onpointermove=e=>{if(recording&&pad.dataset.drawing==='yes'&&points.length<500){points.push(p(e,pad,400,250));renderBrush();}};pad.onpointerup=()=>{if(!recording||points.length<2)return;pad.dataset.drawing='';const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),minX=Math.min(...xs),minY=Math.min(...ys),maxX=Math.max(...xs),maxY=Math.max(...ys),scale=Math.max(maxX-minX,maxY-minY,1);brushes.push(points.map(p=>[(p[0]-(minX+maxX)/2)/scale,(p[1]-(minY+maxY)/2)/scale]));brush=brushes.length-1;recording=false;renderBrush();$('status').textContent='Your gesture is now a brush. Draw on the large canvas.';};pad.onpointercancel=()=>{pad.dataset.drawing='';};art.onpointerdown=e=>{if(e.button!==0||recording)return;if(strokes.length>=80){$('status').textContent='The 80-stroke limit is reached.';return;}active=[];strokes.push(active);last=p(e,art,1000,700);active.push({x:last[0],y:last[1],angle:0,size:Number($('size').value),color:$('color').value,brush});art.setPointerCapture(e.pointerId);render();};art.onpointermove=e=>{if(!active||active.length>=300)return;const next=p(e,art,1000,700),dx=next[0]-last[0],dy=next[1]-last[1],distance=Math.hypot(dx,dy),spacing=Number($('spacing').value);if(distance>=spacing){const count=Math.floor(distance/spacing),angle=$('follow').checked?Math.atan2(dy,dx):0;for(let i=1;i<=count;i++){const f=i*spacing/distance;active.push({x:last[0]+dx*f,y:last[1]+dy*f,angle,size:Number($('size').value),color:$('color').value,brush});}const f=count*spacing/distance;last=[last[0]+dx*f,last[1]+dy*f];render();}};art.onpointerup=art.onpointercancel=art.onlostpointercapture=()=>{active=null;};function leaf(){const path=[];for(let i=0;i<=100;i++){const t=i/100*Math.PI*2;path.push([Math.cos(t)*.5,Math.sin(t)*.23]);}path.push([-.5,0],[.5,0]);brushes.push(path);brush=brushes.length-1;renderBrush();}$('leaf').onclick=()=>{if(brushes.length<20){recording=false;leaf();}};function demo(){strokes=[[]];for(let i=0;i<35;i++){const x=70+i*25,y=350+Math.sin(i/6)*120,angle=Math.atan2(Math.cos(i/6)*20,25);strokes[0].push({x,y,angle,size:65,color:i%2?'#56796a':'#a37162',brush});}render();}$('demo').onclick=demo;$('undo').onclick=()=>{strokes.pop();render();};$('clear').onclick=()=>{strokes=[];render();};function download(b,name){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}$('png').onclick=()=>art.toBlob(b=>{if(b)download(b,'gesture-brush.png');});$('save').onclick=()=>download(new Blob([JSON.stringify({version:1,brushes,strokes})],{type:'application/json'}),'gesture-brush.json');$('open').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>3000000)throw Error('The file exceeds the 3 MB limit.');const s=JSON.parse(await f.text());if(!s||s.version!==1||!Array.isArray(s.brushes)||s.brushes.length<1||s.brushes.length>20||s.brushes.some(b=>!Array.isArray(b)||b.length<2||b.length>500||b.some(p=>!Array.isArray(p)||p.length!==2||p.some(v=>!Number.isFinite(v)||Math.abs(v)>1)))||!Array.isArray(s.strokes)||s.strokes.length>80||s.strokes.some(line=>!Array.isArray(line)||line.length>500||line.some(p=>!Number.isFinite(p.x)||!Number.isFinite(p.y)||!Number.isFinite(p.angle)||!Number.isFinite(p.size)||p.size<15||p.size>140||!/^#[0-9a-f]{6}$/i.test(p.color)||!Number.isInteger(p.brush)||p.brush<0||p.brush>=s.brushes.length)))throw Error('Invalid project data.');brushes=s.brushes;strokes=s.strokes;brush=0;recording=false;renderBrush();render();$('status').textContent='Gestures and artwork restored.';}catch(e){$('status').textContent=e.message;}$('file').value='';};leaf();demo();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
