<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ritim Çemberi — Farklı ritimler aynı buluşma</title><style>body{margin:0;background:#17212a;color:#edf5f4;font:14px system-ui}main{max-width:1000px;margin:auto;padding:25px}h1{font-size:30px}p{color:#adc3c8;line-height:1.8}.bar{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin:20px 0}button,input{font:inherit}button{background:#304a59;color:inherit;border:1px solid #5d8291;padding:10px 15px;cursor:pointer}button:hover{background:#476c7d}button:focus-visible,input:focus-visible{outline:3px solid #f8b96e;outline-offset:2px}canvas{width:100%;height:auto;max-height:620px;display:block}#rings{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.ring{background:#243540;padding:15px;border-top:3px solid var(--color)}label{display:grid;gap:7px;font-size:12px}input[type=range]{width:100%;accent-color:var(--color)}input[type=number]{background:#17212a;color:white;border:1px solid #5d8291;padding:7px;width:90px}#status{min-height:25px}#link{width:100%;padding:8px;box-sizing:border-box;color:#edf5f4;background:#243540;border:1px solid #4e6978;font-size:11px}@media(max-width:550px){#rings{grid-template-columns:1fr}}</style><main><h1>Ritim Çemberi</h1><p>Üç bağımsız vuruş sayısı aynı sürede döner. 3'e karşı 4'ün veya 5'e karşı 7'nin nasıl birbirine örüldüğünü duy ve gör.</p><div id="rings"></div><canvas id="clock" width="900" height="620" aria-label="Üç bağımsız ritim halkası"></canvas><div class="bar"><button id="play">▶ Çemberleri başlat</button><button id="stop">Durdur</button><label>Bir turun süresi, saniye<input id="seconds" type="number" min="2" max="16" step="0.5" value="5"></label><button id="example">3 : 4 : 5 örneği</button><button id="share">Oranı paylaş</button></div><input id="link" readonly aria-label="Ritim oranı bağlantısı"><p id="status" role="status" aria-live="polite">Bu bir adım dizicisi değildir: her halka aynı turu farklı sayıda eşit vuruşa böler. Ses yalnızca Başlat ile açılır.</p></main><script>
'use strict';const $=id=>document.getElementById(id),ctx=$('clock').getContext('2d'),colors=['#eeaa68','#72d3c2','#a6a3ef'];let beats=[3,4,5],audio=null,gain=null,running=false,start=0,frame=0,timer=0,next=[0,0,0],period=5;for(let i=0;i<3;i++){const box=document.createElement('div');box.className='ring';box.style.setProperty('--color',colors[i]);const label=document.createElement('label');label.textContent=`${i+1}. halka: ${beats[i]} vuruş`;const range=document.createElement('input');range.type='range';range.min=2;range.max=12;range.value=beats[i];range.id='beat'+i;range.oninput=()=>{stop();beats[i]=Number(range.value);label.firstChild.textContent=`${i+1}. halka: ${beats[i]} vuruş`;draw(0);};label.append(range);const mute=document.createElement('label');mute.style.marginTop='10px';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=true;checkbox.id='sound'+i;mute.append(checkbox,document.createTextNode('Bu halkayı duy'));box.append(label,mute);$('rings').append(box);}function draw(phase){ctx.clearRect(0,0,900,620);for(let r=0;r<3;r++){const radius=230-r*65;ctx.strokeStyle='#435a65';ctx.lineWidth=2;ctx.beginPath();ctx.arc(450,310,radius,0,Math.PI*2);ctx.stroke();for(let i=0;i<beats[r];i++){const angle=i/beats[r]*Math.PI*2-Math.PI/2,x=450+Math.cos(angle)*radius,y=310+Math.sin(angle)*radius,near=Math.abs((phase*beats[r])%1)<.12;ctx.fillStyle=colors[r];ctx.beginPath();ctx.arc(x,y,near&&Math.floor(phase*beats[r])%beats[r]===i?12:7,0,Math.PI*2);ctx.fill();}const angle=phase*Math.PI*2-Math.PI/2;ctx.strokeStyle=colors[r];ctx.beginPath();ctx.moveTo(450,310);ctx.lineTo(450+Math.cos(angle)*radius,310+Math.sin(angle)*radius);ctx.stroke();}ctx.fillStyle='#e8f1ef';ctx.font='22px monospace';ctx.textAlign='center';ctx.fillText(beats.join(' : '),450,315);}function sound(r,time){if(!$('sound'+r).checked)return;const osc=audio.createOscillator(),env=audio.createGain();osc.frequency.value=[220,330,440][r];env.gain.setValueAtTime(.18,time);env.gain.exponentialRampToValueAtTime(.0001,time+.12);osc.connect(env);env.connect(gain);osc.start(time);osc.stop(time+.13);}function schedule(){if(!running)return;for(let r=0;r<3;r++)while(start+next[r]*period/beats[r]<audio.currentTime+.1){const time=start+next[r]*period/beats[r];if(time>=audio.currentTime)sound(r,time);next[r]++;}}function animate(){if(!running)return;draw(((audio.currentTime-start)/period%1+1)%1);frame=requestAnimationFrame(animate);}function stop(){running=false;clearInterval(timer);cancelAnimationFrame(frame);if(gain&&audio)gain.gain.setValueAtTime(0,audio.currentTime);$('play').textContent='▶ Çemberleri başlat';}$('play').onclick=async()=>{if(running){stop();return;}try{period=Number($('seconds').value);if(!Number.isFinite(period)||period<2||period>16)throw Error('Tur süresi 2–16 saniye olmalı.');const T=window.AudioContext||window.webkitAudioContext;if(!audio)audio=new T();await audio.resume();gain=audio.createGain();gain.gain.value=.65;gain.connect(audio.destination);start=audio.currentTime+.05;next=[0,0,0];running=true;$('play').textContent='Ⅱ Duraklat';schedule();timer=setInterval(schedule,25);animate();$('status').textContent='Her turda bütün halkalar başlangıçta tekrar buluşur.';}catch(e){$('status').textContent=e.message;}};$('stop').onclick=stop;$('seconds').onchange=stop;$('example').onclick=()=>{stop();beats=[3,4,5];for(let i=0;i<3;i++){$('beat'+i).value=beats[i];$('beat'+i).parentNode.firstChild.textContent=`${i+1}. halka: ${beats[i]} vuruş`;}draw(0);};$('share').onclick=async()=>{const u=new URL(location.href);u.hash=beats.join('-')+'-'+$('seconds').value;$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Ritim oranı bağlantısı kopyalandı.';}catch{$('link').select();}};if(location.hash){const p=location.hash.slice(1).split('-').map(Number);if(p.length===4&&p.slice(0,3).every(v=>Number.isInteger(v)&&v>=2&&v<=12)&&p[3]>=2&&p[3]<=16){beats=p.slice(0,3);$('seconds').value=p[3];for(let i=0;i<3;i++){$('beat'+i).value=beats[i];$('beat'+i).parentNode.firstChild.textContent=`${i+1}. halka: ${beats[i]} vuruş`;}}}draw(0);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
</script></html>
