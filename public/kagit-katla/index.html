<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Fold — Make a box net</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1100px;margin:auto;padding:25px;display:grid;grid-template-columns:280px 1fr;gap:25px}h1{font:32px Georgia}p{line-height:1.8}label{display:grid;gap:7px;margin:18px 0}input,button{font:inherit;padding:10px;border:1px solid #b8b8b8;background:#ffffff;color:inherit}button{cursor:pointer;margin:4px}button:hover{background:#ffffff}button:focus-visible,input:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}#sheet svg{width:100%;height:auto;max-height:850px;background:white}#status{font-size:13px}#printInfo{font-size:12px}.legend{font-size:12px}input[type=color]{height:40px;width:100%}@media(max-width:700px){main{grid-template-columns:1fr}}@media print{@page{size:A4 portrait;margin:0}body{background:white}main{display:block;margin:0;padding:0}aside,.actions,#status,#printInfo{display:none}#sheet svg{width:210mm;height:297mm;max-height:none}}</style><main><aside><h1>Paper Fold</h1><p>Enter width, depth and height to generate a box net with cut and fold guides.</p><label>Width, millimeters<input id="width" type="number" min="20" max="90" value="50"></label><label>Depth, millimeters<input id="depth" type="number" min="15" max="70" value="35"></label><label>Height, millimeters<input id="height" type="number" min="20" max="100" value="65"></label><label>Box label<input id="title" value="SMALL THINGS" maxlength="25"></label><label>Cover color<input id="color" type="color" value="#e0bb75"></label><button id="generate">Update net</button><p class="legend">Solid black lines: cut.<br>Dashed blue lines: fold.<br>Light gray tabs: glue.</p><p>Fold the tabs inward and join the sides, then close the top and bottom. Print at actual size or 100%.</p></aside><section><div id="sheet"></div><div class="actions"><button id="svg">Download A4 SVG</button><button id="print">Print</button><button id="example">Small gift box</button></div><p id="status" role="status" aria-live="polite"></p><p id="printInfo"></p></section></main><script>
'use strict';const $=id=>document.getElementById(id);let svg='';function esc(v){return String(v).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));}function generate(){const w=Number($('width').value),d=Number($('depth').value),h=Number($('height').value);if(!Number.isFinite(w)||w<20||w>90||!Number.isFinite(d)||d<15||d>70||!Number.isFinite(h)||h<20||h>100){$('status').textContent='Enter dimensions within the indicated ranges.';return;}const tab=8,fullW=2*w+2*d+tab,fullH=h+2*d+2*tab,scale=Math.min(1,190/fullW,265/fullH),x=(210-fullW*scale)/2,y=(297-fullH*scale)/2;let shapes='',folds='';const widths=[w,d,w,d];let cursor=0;for(let i=0;i<4;i++){shapes+=`<rect x="${cursor}" y="${d+tab}" width="${widths[i]}" height="${h}" fill="${i%2?'#fffdf7':$('color').value}" stroke="#222" stroke-width=".35"/>`;if(i>0)folds+=`<path d="M${cursor} ${d+tab}v${h}"/>`;cursor+=widths[i];}shapes+=`<path d="M${cursor} ${d+tab} l${tab} 4 v${h-8} l-${tab} 4 Z" fill="#eee" stroke="#222" stroke-width=".35"/>`;folds+=`<path d="M${cursor} ${d+tab}v${h}"/>`;for(const top of [true,false]){const fy=top?tab:d+tab+h;shapes+=`<rect x="0" y="${fy}" width="${w}" height="${d}" fill="${$('color').value}" stroke="#222" stroke-width=".35"/><path d="M0 ${fy}l-${tab} 4v${d-8}l${tab} 4Z M${w} ${fy}l${tab} 4v${d-8}l-${tab} 4Z" fill="#eee" stroke="#222" stroke-width=".35"/>`;const outer=top?fy:fy+d,dir=top?-1:1;shapes+=`<path d="M0 ${outer}l4 ${dir*tab}h${w-8}l4 ${-dir*tab}Z" fill="#eee" stroke="#222" stroke-width=".35"/>`;folds+=`<path d="M0 ${top?d+tab:fy}h${w} M0 ${fy}v${d} M${w} ${fy}v${d} M0 ${outer}h${w}"/>`;}const fontSize=Math.min(5,w/Math.max(1,$('title').value.length)*1.5);shapes+=`<text x="${w/2}" y="${d+tab+h/2}" text-anchor="middle" font-family="sans-serif" font-size="${fontSize}" fill="#30291d">${esc($('title').value)}</text>`;svg=`<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g transform="translate(${x} ${y}) scale(${scale})">${shapes}<g fill="none" stroke="#fff" stroke-width="1">${folds}</g><g fill="none" stroke="#3364a0" stroke-width=".55" stroke-dasharray="2 1">${folds}</g></g><text x="10" y="287" font-family="sans-serif" font-size="3">Paper Fold · A4 · Scale ${Math.round(scale*100)}% · Control line: 20 mm</text><path d="M170 286h20" stroke="#222" stroke-width=".4"/></svg>`;$('sheet').innerHTML=svg;$('status').textContent=scale<1?`To fit A4, the net was scaled to %${(scale*100).toFixed(1)} of its original size. The finished box measures ${(w*scale).toFixed(1)} × ${(d*scale).toFixed(1)} × ${(h*scale).toFixed(1)} mm.`:`Actual dimensions: ${w} × ${d} × ${h} mm. The net fits A4 at full size.`;$('printInfo').textContent='The printed control line should measure 20 mm. Try a draft sheet first.';}$('generate').onclick=generate;$('example').onclick=()=>{$('width').value=40;$('depth').value=30;$('height').value=45;$('title').value='A SMALL THING FOR YOU';generate();};$('svg').onclick=()=>{if(!svg)return;const u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),a=document.createElement('a');a.href=u;a.download='box-net-a4.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('print').onclick=()=>window.print();generate();
</script><script src="/assets/revenue.js" data-binsite-revenue defer></script></html>
