<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exhibition Builder — Create a walkable gallery</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1250px;margin:auto;padding:24px}h1{font:33px Georgia}p{line-height:1.8}.work{display:grid;grid-template-columns:290px 1fr;gap:24px}label{display:grid;gap:7px;margin:13px 0}button,input,textarea,select{font:inherit;padding:9px;background:#ffffff;color:inherit;border:1px solid #b8b8b8}button{cursor:pointer}button:hover{background:#ffffff}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}canvas{display:block;width:100%;height:auto;background:#ffffff;touch-action:none}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}textarea{resize:vertical;line-height:1.7}#info{padding:20px;background:#ffffff;border:1px solid #ffffff;min-height:60px}#info p{white-space:pre-wrap}#status{min-height:30px}.small{font-size:12px}@media(max-width:800px){.work{display:flex;flex-direction:column-reverse}}</style>

<main><h1>Exhibition Builder</h1><p>Edit the exhibits, then visit or download the walkable gallery.</p><div class="work"><aside><label>Exhibition title<input id="title" maxlength="70" value="Traces of Everyday Light"></label><label>Exhibit<select id="selection"></select></label><label>Exhibit title<input id="name" maxlength="55"></label><label>Description<textarea id="text" rows="6" maxlength="800"></textarea></label><label>Exhibit color<input id="color" type="color"></label><label>Visual motif<select id="motif"><option value="rings">Rings</option><option value="waves">Wave lines</option><option value="tiles">Geometric fragments</option></select></label><div class="bar"><button id="apply">Update exhibit</button><button id="add">+ Add exhibit</button><button id="remove">Remove exhibit</button></div><p class="small">Click an exhibit to select it; click empty space to move it. Up to sixteen exhibits.</p></aside><section><canvas id="gallery" width="1000" height="620" aria-label="Walkable two-dimensional exhibition"></canvas><div class="bar"><button id="edit" aria-pressed="true">Edit mode</button><button id="visit" aria-pressed="false">Visit exhibition</button><button id="read">Read nearby exhibit</button><button id="export">Download gallery HTML</button><button id="save">Download project</button><button id="open">Open project</button><input id="file" type="file" accept=".json,application/json" hidden></div><div id="info"></div><p id="status" role="status" aria-live="polite">Edit mode: select an exhibit or click to move it.</p></section></div></main><script>
'use strict';const $=id=>document.getElementById(id);let scene={version:1,title:'Traces of Everyday Light',exhibits:[{x:250,y:180,name:'The Window Clock',text:'Morning light moves across a wall. One room holds many quiet moments throughout the day. This work imagines an ordinary window as a timeline.',color:'#d2ad68',motif:'rings'},{x:700,y:170,name:'The City Breathes',text:'A walk turns sounds into invisible lines: a distant train, a shutter opening and a brief hello.',color:'#5e8d89',motif:'waves'},{x:420,y:560,name:'Small Maps',text:'A coffee stain can become a continent and a worn wall a street. Geography can be a small game played by the eye.',color:'#b87873',motif:'tiles'}]},selected=0;function galleryEngine(canvas,model,onPick){const ctx=canvas.getContext('2d'),keys=new Set();let mode=onPick?'edit':'visit',visitor={x:120,y:350},destination=null,near=null,last=performance.now();function art(e,index){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle='#5c594c';ctx.fillRect(-73,-60,146,120);ctx.fillStyle=e.color;ctx.fillRect(-65,-52,130,104);ctx.strokeStyle='#fff8db';ctx.lineWidth=2;ctx.beginPath();if(e.motif==='rings'){for(let i=0;i<5;i++){ctx.moveTo(i*10+5,0);ctx.arc(0,0,i*10+5,0,Math.PI*2);}}else if(e.motif==='waves'){for(let row=-35;row<45;row+=12){for(let x=-60;x<=60;x+=3){const y=row+Math.sin(x/15+row)*8;x===-60?ctx.moveTo(x,y):ctx.lineTo(x,y);}}}else{for(let i=0;i<8;i++){const x=(i%4)*28-50,y=Math.floor(i/4)*37-20;ctx.rect(x,y,20,20);}}ctx.stroke();ctx.restore();ctx.fillStyle='#465146';ctx.font='15px Georgia';ctx.textAlign='center';ctx.fillText(e.name,e.x,e.y+83);}function draw(){const camera=mode==='visit'?{x:Math.max(0,Math.min(300,visitor.x-500)),y:Math.max(0,Math.min(180,visitor.y-310))}:{x:150,y:90};ctx.fillStyle='#dbd7cb';ctx.fillRect(0,0,1000,620);ctx.save();ctx.translate(-camera.x,-camera.y);ctx.fillStyle='#f0eadb';ctx.fillRect(30,30,1240,740);ctx.strokeStyle='#aaa58e';ctx.lineWidth=12;ctx.strokeRect(30,30,1240,740);ctx.lineWidth=1;ctx.strokeStyle='#ddd5bf';for(let x=60;x<1270;x+=60){ctx.beginPath();ctx.moveTo(x,35);ctx.lineTo(x,765);ctx.stroke();}model.exhibits.forEach(art);ctx.fillStyle='#42665f';ctx.beginPath();ctx.arc(visitor.x,visitor.y,12,0,Math.PI*2);ctx.fill();if(near&&mode==='visit'){ctx.strokeStyle='#c39a48';ctx.lineWidth=3;ctx.strokeRect(near.x-85,near.y-72,170,145);}ctx.restore();ctx.textAlign='left';ctx.fillStyle='#3b4f44';ctx.font='18px Georgia';ctx.fillText(model.title,25,30);return camera;}function read(){if(!near)return;const box=document.getElementById('info'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=near.name;p.textContent=near.text;box.replaceChildren(h,p);}function tick(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(mode==='visit'){let dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);if(dx||dy)destination=null;else if(destination){const distance=Math.hypot(destination.x-visitor.x,destination.y-visitor.y);if(distance>4){dx=(destination.x-visitor.x)/distance;dy=(destination.y-visitor.y)/distance;}else destination=null;}const length=Math.hypot(dx,dy)||1;visitor.x=Math.max(60,Math.min(1240,visitor.x+dx/length*170*dt));visitor.y=Math.max(70,Math.min(730,visitor.y+dy/length*170*dt));near=model.exhibits.find(e=>Math.hypot(e.x-visitor.x,e.y-visitor.y)<135)||null;}draw();const readButton=document.getElementById('read');if(readButton)readButton.disabled=mode!=='visit'||!near;requestAnimationFrame(tick);}canvas.onpointerdown=event=>{const rect=canvas.getBoundingClientRect(),camera=mode==='visit'?{x:Math.max(0,Math.min(300,visitor.x-500)),y:Math.max(0,Math.min(180,visitor.y-310))}:{x:150,y:90},p={x:(event.clientX-rect.left)/rect.width*1000+camera.x,y:(event.clientY-rect.top)/rect.height*620+camera.y};if(mode==='edit'&&onPick)onPick(p,model.exhibits.findIndex(e=>Math.abs(e.x-p.x)<75&&Math.abs(e.y-p.y)<60));else destination=p;};window.addEventListener('keydown',event=>{if(mode!=='visit'||event.ctrlKey||event.metaKey||event.altKey||['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(event.target.tagName))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(event.key))event.preventDefault();keys.add(event.key.toLowerCase().startsWith('arrow')?event.key:event.key.toLowerCase());if(event.key==='Enter')read();});window.addEventListener('keyup',event=>keys.delete(event.key.toLowerCase().startsWith('arrow')?event.key:event.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());requestAnimationFrame(tick);return{setMode(value){mode=value;destination=null;near=null;keys.clear();},read};}const engine=galleryEngine($('gallery'),scene,(p,index)=>{if(index>=0){applyFields();selected=index;load();}else if(scene.exhibits[selected]){scene.exhibits[selected].x=Math.max(115,Math.min(1180,p.x));scene.exhibits[selected].y=Math.max(120,Math.min(660,p.y));}});function load(){$('selection').replaceChildren(...scene.exhibits.map((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+e.name;return o;}));selected=Math.max(0,Math.min(selected,scene.exhibits.length-1));$('selection').value=selected;const e=scene.exhibits[selected];for(const id of ['name','text','color','motif','apply','remove'])$(id).disabled=!e;$('add').disabled=scene.exhibits.length>=16;if(e)for(const id of ['name','text','color','motif'])$(id).value=e[id];else{$('name').value='';$('text').value='';}}function applyFields(){const e=scene.exhibits[selected];if(e)for(const id of ['name','text','color','motif'])e[id]=$(id).value;}$('selection').onchange=()=>{applyFields();selected=Number($('selection').value);load();};$('apply').onclick=()=>{const e=scene.exhibits[selected];if(e)for(const id of ['name','text','color','motif'])e[id]=$(id).value;load();};$('title').oninput=()=>{scene.title=$('title').value;};$('add').onclick=()=>{applyFields();if(scene.exhibits.length>=16)return;scene.exhibits.push({x:550,y:350,name:'New exhibit',text:'Write the story of this exhibit.',color:'#a8a086',motif:'rings'});selected=scene.exhibits.length-1;load();};$('remove').onclick=()=>{if(!scene.exhibits[selected]||!confirm('Delete this exhibit?'))return;scene.exhibits.splice(selected,1);load();};function mode(value){applyFields();engine.setMode(value);$('edit').setAttribute('aria-pressed',String(value==='edit'));$('visit').setAttribute('aria-pressed',String(value==='visit'));$('status').textContent=value==='edit'?'Edit mode: select an exhibit or click to move it.':'Walk with arrows or W A S D, or click a destination. Press Enter to read a nearby exhibit.';}$('visit').onclick=()=>mode('visit');$('edit').onclick=()=>mode('edit');$('read').onclick=engine.read;function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}$('save').onclick=()=>{applyFields();download(new Blob([JSON.stringify(scene)],{type:'application/json'}),'exhibition-project.json');};$('export').onclick=()=>{applyFields();const data=JSON.stringify(scene).replace(/</g,'\\u003c'),html='<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery visit</title><style>body{margin:0;background:#ffffff;color:#181818;font:15px system-ui}main{max-width:1100px;margin:auto;padding:20px}canvas{width:100%;height:auto}button{padding:12px 20px}p{line-height:1.8;white-space:pre-wrap}#info{background:#ffffff;padding:20px}</style><main><canvas width="1000" height="620" aria-label="Gallery room"></canvas><p>Walk with arrow keys or W A S D, or click a destination. Press Enter or the button to read a nearby exhibit.</p><button id="read">Read nearby exhibit</button><div id="info"></div></main><script>const tour=('+galleryEngine.toString()+')(document.querySelector("canvas"),'+data+');document.getElementById("read").onclick=tour.read;<'+ '/script></html>';download(new Blob([html],{type:'text/html'}),'walkable-gallery.html');};$('open').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>40000)throw Error('The file is too large.');const s=JSON.parse(await f.text());if(!s||s.version!==1||typeof s.title!=='string'||s.title.length>70||!Array.isArray(s.exhibits)||s.exhibits.length>16||s.exhibits.some(e=>typeof e.name!=='string'||e.name.length>55||typeof e.text!=='string'||e.text.length>800||!/^#[0-9a-f]{6}$/i.test(e.color)||!['rings','waves','tiles'].includes(e.motif)||!Number.isFinite(e.x)||e.x<115||e.x>1180||!Number.isFinite(e.y)||e.y<120||e.y>660))throw Error('Invalid exhibition file.');if(!confirm('Replace this exhibition with the selected project?'))return;scene.title=s.title;scene.exhibits=s.exhibits;selected=0;$('title').value=scene.title;load();}catch(e){$('status').textContent=e.message;}$('file').value='';};load();
