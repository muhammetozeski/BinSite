<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Nodes — Write the paths</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1180px;margin:auto;padding:24px}h1{font:32px Georgia}p{line-height:1.8}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,input,textarea,select{font:inherit;border:1px solid #b8b8b8;background:#ffffff;color:inherit;padding:9px}button{cursor:pointer}button:hover{background:#ffffff}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}#editor{display:grid;grid-template-columns:220px 1fr;gap:20px}#list{display:grid;gap:6px;align-content:start}#list button{text-align:left}#list button[aria-pressed=true]{background:#181818;color:white}label{display:grid;gap:7px;margin:14px 0}textarea{resize:vertical;width:100%;box-sizing:border-box}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}#graph svg{width:100%;height:auto;background:#ffffff;border:1px solid #ffffff;margin-top:20px}#play{max-width:700px;margin:30px auto;background:#ffffff;padding:30px;border:1px solid #ffffff}#play h2{font:29px Georgia}#story{white-space:pre-wrap;font:19px/1.9 Georgia}#choices{display:grid;gap:10px;margin-top:25px}#status{min-height:25px;font-size:13px}#link{width:100%;box-sizing:border-box;font-size:11px}[hidden]{display:none!important}@media(max-width:650px){#editor{grid-template-columns:1fr}.pair{grid-template-columns:1fr}}</style>
<style data-static-readability="calm">
html[data-bs-theme="dark"]{color-scheme:dark;background:#15191f;color:#edf2f7}
html[data-bs-theme="dark"] body,html[data-bs-theme="dark"] header{background:#15191f;color:#edf2f7}
body{font-size:16px;line-height:1.5}h1{font-size:clamp(25px,3vw,32px);line-height:1.15;margin-bottom:8px}h2{line-height:1.3}p{line-height:1.55}
html[data-bs-theme="dark"] a{color:#acc9df}
html[data-bs-theme="dark"] :is(.panel,.paper,.stage,.resource,.metric,.aside,aside,.filters,.recipe,.settings,.canvas-wrap){background:#1d252e;color:#edf2f7;border-color:#465564}
html[data-bs-theme="dark"] :is(.notice,.message,.status,.delta){background:#25323d;color:#edf2f7;border-color:#7f9fac}
html[data-bs-theme="dark"] :is(.fine,.hint,.muted,small,footer,header p){color:#c3cdd7}
html[data-bs-theme="dark"] :is(input:not([type="color"]),select,textarea){background:#202a34;color:#edf2f7;border-color:#657585}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell){background:#28343f;color:#edf2f7;border-color:#607181;border-radius:5px}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell):hover{background:#354653}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell):disabled{opacity:1;color:#bac5d0;background:#242d36;border-color:#465564}
html[data-bs-theme="dark"] :is(.accent,.primary),html[data-bs-theme="dark"] button[aria-pressed="true"]:not(.swatch):not(.pad):not(.tile):not(.cell){background:#405e6d;color:#f4f8fa;border-color:#8baab9}
html[data-bs-theme="dark"] :is(.stat,.recipe,.filters){background:#1d252e;color:#edf2f7;border-color:#465564}
input[type="range"],input[type="checkbox"],progress{accent-color:#8baebd}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #b1d0df;outline-offset:3px}
details.readability-help{border-top:1px solid #50606e;padding-top:10px;margin:18px 0;font-size:14px;line-height:1.6}
details.readability-help summary{cursor:pointer;font-weight:650;min-height:34px;display:list-item}
details.readability-help p{max-width:75ch;margin:10px 0}
html[data-bs-theme="dark"] #playMode{background:#405e6d;color:#f4f8fa;border:1px solid #91b0be;font-weight:700}
html[data-bs-theme="dark"] #play{background:#1d252e;color:#edf2f7;border-color:#465564}
</style>

<main><h1>Story Nodes</h1><p>Write a story with choices, then play through its endings.</p><div class="bar"><button id="editMode">Writing desk</button><button id="playMode">Read from the beginning</button><button id="share">Copy reader link</button><button id="download">Save story file</button><button id="open">Open story file</button><input id="file" type="file" accept=".json,application/json" hidden></div><input id="link" hidden readonly aria-label="Branching story link"><p id="status" role="status" aria-live="polite">Choose a scene to edit, or read from the start.</p><section id="editor"><aside><h2>Scenes</h2><div id="list"></div><div class="bar"><button id="add">+ Add scene</button><button id="remove">Delete selected</button></div><details class="readability-help"><summary>Help</summary><p>The first node starts the story. Empty choice text disables that route. A node with no choices is an ending.</p></details></aside><div><label>Scene title<input id="title" maxlength="45"></label><label>Story text<textarea id="body" rows="7" maxlength="900"></textarea></label><div class="pair"><div><label>First choice<input id="choice0" maxlength="65"></label><label>Next scene<select id="target0"></select></label></div><div><label>Second choice<input id="choice1" maxlength="65"></label><label>Next scene<select id="target1"></select></label></div></div><h3>Story map</h3><div id="graph"></div><p id="reach"></p></div></section><section id="play" hidden><h2 id="heading"></h2><div id="story"></div><div id="choices"></div></section></main><script>
'use strict';const $=id=>document.getElementById(id);let nodes=[{id:1,title:'The Last Carriage',body:'You woke on the night train to find every seat empty. A note on the window read: “The next stop is not waiting for you.” A light glowed at the end of the corridor.',choices:[{text:'Walk toward the light',target:2},{text:'Leave at the next stop',target:3}]},{id:2,title:'The Driver Notebook',body:'A notebook lay beside the light. Its final page held a route in your handwriting. You had driven this train for years; the only thing forgotten was why you began.',choices:[{text:'Complete the route',target:4},{text:'Draw a new route',target:5}]},{id:3,title:'The Morning Platform',body:'Morning filled the platform. A child offered you a blank ticket. “Now you can go anywhere,” they said. This time, someone was waiting for you.',choices:[{text:'',target:1},{text:'',target:1}]},{id:4,title:'Coming Home',body:'The sea appeared beyond the final turn. Your childhood station was still there. As the door opened, a voice you had missed for years called your name.',choices:[{text:'',target:1},{text:'',target:1}]},{id:5,title:'The Unmapped Route',body:'The rails divided where the map ended. You opened the windows. You were no longer racing to arrive; you were traveling to discover.',choices:[{text:'',target:1},{text:'',target:1}]}],selected=1,current=1,journey=[];function esc(s){return String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));}function persist(){try{localStorage.setItem('dugum-hikaye',JSON.stringify(nodes));}catch{}}function list(){const f=document.createDocumentFragment();nodes.forEach((n,i)=>{const b=document.createElement('button');b.textContent=(i===0?'Start · ':`${i+1}. `)+(n.title||'Untitled scene');b.setAttribute('aria-pressed',String(n.id===selected));b.onclick=()=>{selected=n.id;load();};f.append(b);});$('list').replaceChildren(f);$('remove').disabled=nodes.length<=1;}function graph(){const height=Math.ceil(nodes.length/4)*100+20;let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 ${height}">`;function pos(id){const i=nodes.findIndex(n=>n.id===id);return{x:15+(i%4)*198,y:15+Math.floor(i/4)*100};}for(const n of nodes)for(const c of n.choices)if(c.text&&nodes.some(t=>t.id===c.target)){const a=pos(n.id),b=pos(c.target);svg+=`<path d="M${a.x+90} ${a.y+50}Q${a.x+90} ${a.y+85} ${b.x+90} ${b.y}" fill="none" stroke="#9c8a9b" stroke-width="2"/>`;}nodes.forEach((n,i)=>{const p=pos(n.id);svg+=`<rect x="${p.x}" y="${p.y}" width="180" height="50" rx="4" fill="${n.id===selected?'#ddc3d5':'#fffdf8'}" stroke="#9c8a9b"/><text x="${p.x+9}" y="${p.y+29}" font-family="sans-serif" font-size="12" fill="#443846">${i+1}. ${esc(n.title.slice(0,19))}</text>`;});$('graph').innerHTML=svg+'</svg>';const seen=new Set(),walk=id=>{if(seen.has(id))return;seen.add(id);const n=nodes.find(n=>n.id===id);if(n)for(const c of n.choices)if(c.text)walk(c.target);};walk(nodes[0].id);const missed=nodes.filter(n=>!seen.has(n.id));$('reach').textContent=missed.length?'Not connected to the start: '+missed.map(n=>n.title||'Untitled scene').join(', '):`All ${nodes.length} scenes connect to the start.`;}function load(){const n=nodes.find(n=>n.id===selected)||nodes[0];selected=n.id;$('title').value=n.title;$('body').value=n.body;for(let i=0;i<2;i++){$('choice'+i).value=n.choices[i].text;const f=document.createDocumentFragment();nodes.forEach(target=>{const option=document.createElement('option');option.value=target.id;option.textContent=target.title||'Untitled node';f.append(option);});$('target'+i).replaceChildren(f);$('target'+i).value=n.choices[i].target;}list();graph();}function update(){const n=nodes.find(n=>n.id===selected);n.title=$('title').value;n.body=$('body').value;for(let i=0;i<2;i++)n.choices[i]={text:$('choice'+i).value,target:Number($('target'+i).value)};list();graph();persist();}['title','body','choice0','choice1','target0','target1'].forEach(id=>$(id).oninput=update);$('add').onclick=()=>{if(nodes.length>=20){$('status').textContent='Use up to 20 nodes.';return;}selected=1+Math.max(...nodes.map(n=>n.id));nodes.push({id:selected,title:'New path',body:'What happens here?',choices:[{text:'',target:nodes[0].id},{text:'',target:nodes[0].id}]});load();persist();};$('remove').onclick=()=>{if(nodes.length<=1)return;nodes=nodes.filter(n=>n.id!==selected);for(const n of nodes)for(const c of n.choices)if(c.target===selected){c.text='';c.target=nodes[0].id;}selected=nodes[0].id;load();persist();};function read(){const n=nodes.find(n=>n.id===current);$('heading').textContent=n.title;$('story').textContent=n.body;const f=document.createDocumentFragment();for(const c of n.choices)if(c.text){const b=document.createElement('button');b.textContent=c.text;b.onclick=()=>{if(journey.length>=100){$('status').textContent='The 100-choice limit is reached. Restart the journey to continue.';return;}journey.push(current);current=c.target;read();};f.append(b);}if(!f.childNodes.length){const end=document.createElement('p');end.textContent='The end.';f.append(end);}$('choices').replaceChildren(f);}$('playMode').onclick=()=>{$('editor').hidden=true;$('play').hidden=false;current=nodes[0].id;journey=[];read();};$('editMode').onclick=()=>{$('editor').hidden=false;$('play').hidden=true;load();};function valid(data){if(!Array.isArray(data)||data.length<1||data.length>20||new Set(data.map(n=>n.id)).size!==data.length||data.some(n=>!Number.isInteger(n.id)||typeof n.title!=='string'||n.title.length>45||typeof n.body!=='string'||n.body.length>900||!Array.isArray(n.choices)||n.choices.length!==2||n.choices.some(c=>typeof c.text!=='string'||c.text.length>65||!data.some(t=>t.id===c.target))))throw Error();return data;}$('share').onclick=async()=>{const u=new URL(location.href);u.hash='h='+btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(nodes))));$('link').hidden=false;$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Reader link copied. Recipients can edit their own version.';}catch{$('link').select();}};$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(nodes,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='story-nodes.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('open').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{if(file.size>100000)throw Error('The story file exceeds 100 KB.');const candidate=valid(JSON.parse(await file.text()));nodes=candidate;selected=current=nodes[0].id;journey=[];$('editor').hidden=false;$('play').hidden=true;load();persist();$('status').textContent='Story opened for editing.';}catch{$('status').textContent='This story file could not be opened. Your current story is unchanged.';}$('file').value='';};try{if(location.hash.startsWith('#h=')){if(location.hash.length>50000)throw Error();nodes=valid(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(location.hash.slice(3)),c=>c.charCodeAt(0)))));$('editor').hidden=true;$('play').hidden=false;current=nodes[0].id;read();}else{const raw=localStorage.getItem('dugum-hikaye');if(raw)nodes=valid(JSON.parse(raw));}}catch{$('status').textContent='The previous story could not be opened. A sample train journey is ready.';}selected=nodes[0].id;load();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
