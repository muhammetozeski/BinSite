<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage Cues — Sound and light rehearsal</title><style>body{margin:0;background:#181818;color:#ffffff;font:14px system-ui}main{max-width:1250px;margin:auto;padding:24px}h1{font:33px Georgia}p{line-height:1.8;color:#ffffff}.work{display:grid;grid-template-columns:310px 1fr;gap:24px}label{display:grid;gap:6px;margin:12px 0}button,input,select{font:inherit;padding:8px;background:#181818;color:inherit;border:1px solid #b8b8b8}button{cursor:pointer}button:hover{background:#181818}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffffff;outline-offset:2px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair input{width:100%;box-sizing:border-box}canvas{width:100%;height:auto;display:block;background:#181818}#scrub{width:100%}.cue{display:grid;grid-template-columns:60px 100px 1fr 60px;gap:8px;align-items:center;background:#181818;padding:10px;margin-bottom:5px}.cue.active{border-left:3px solid #ffffff}.cue button{padding:5px}#status{min-height:28px;color:#ffffff}.small{font-size:12px}@media(max-width:750px){.work{grid-template-columns:1fr}.cue{grid-template-columns:45px 65px 1fr 45px}}</style>
<style data-static-readability="calm">
html[data-bs-theme="dark"]{color-scheme:dark;background:#15191f;color:#edf2f7}
html[data-bs-theme="dark"] body,html[data-bs-theme="dark"] header{background:#15191f;color:#edf2f7}
body{font-size:16px;line-height:1.5}h1{font-size:clamp(25px,3vw,32px);line-height:1.15;margin-bottom:8px}h2{line-height:1.3}p{line-height:1.55}
html[data-bs-theme="dark"] a{color:#acc9df}

html[data-bs-theme="dark"] :is(.fine,.hint,.muted,small,footer,header p){color:#c3cdd7}
html[data-bs-theme="dark"] :is(input:not([type="color"]),select,textarea){background:#202a34;color:#edf2f7;border-color:#657585}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell){background:#28343f;color:#edf2f7;border-color:#607181;border-radius:5px}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell):hover{background:#354653}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell):disabled{opacity:1;color:#bac5d0;background:#242d36;border-color:#465564}
html[data-bs-theme="dark"] :is(.accent,.primary),html[data-bs-theme="dark"] button[aria-pressed="true"]:not(.swatch):not(.pad):not(.tile):not(.cell){background:#405e6d;color:#f4f8fa;border-color:#8baab9}
html[data-bs-theme="dark"] :is(.stat,.recipe,.filters){background:#1d252e;color:#edf2f7;border-color:#465564}
input[type="range"],input[type="checkbox"],progress{accent-color:#8baebd}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #b1d0df;outline-offset:3px}
details.readability-help{border-top:1px solid #50606e;padding-top:10px;margin:18px 0;font-size:14px;line-height:1.6}
details.readability-help summary{cursor:pointer;font-weight:650;min-height:34px;display:list-item}
details.readability-help p{max-width:75ch;margin:10px 0}
html[data-bs-theme="dark"] #play{background:#405e6d;color:#f4f8fa;border:1px solid #91b0be;font-weight:700}
</style>

<main><h1>Stage Cues</h1><p>Rehearse light, synthesized sound and caption cues in the preview.</p><div class="work"><aside><label>Cue name<input id="name" maxlength="40" value="New cue"></label><div class="pair"><label>Time, sec<input id="at" type="number" min="0" max="180" step="0.1" value="3"></label><label>Transition / sound, sec<input id="duration" type="number" min="0.1" max="20" step="0.1" value="1"></label></div><label>Event<select id="type"><option value="light">Light color</option><option value="tone">Synthesized sound</option><option value="text">Stage caption</option><option value="blackout">Blackout</option></select></label><label>Light color<input id="color" type="color" value="#bb824a"></label><label>Sound frequency, Hz<input id="frequency" type="number" min="40" max="2000" value="330"></label><label>Text<input id="text" maxlength="100" value="The next scene"></label><div class="bar"><button id="add">Add cue</button><button id="update">Update selected</button></div><p class="small">Select a cue, change its fields, then update it. Same-time cues follow list order.</p><details class="readability-help"><summary>Limits</summary><p class="small">Up to 80 cues, with start times from 0 to 180 seconds.</p></details><button id="example">Reset to example</button></aside><section><canvas id="stage" width="1000" height="560" aria-label="Virtual stage with sound and light cues"></canvas><label>Rehearsal time: <output id="position">0,00</output> sec<input id="scrub" type="range" min="0" max="15" step="0.01" value="0"></label><div class="bar"><button id="play">Play rehearsal</button><button id="stop">Stop</button><button id="go">Jump to next cue</button><button id="reset">Back to start</button><button id="save">Download project</button><button id="csv">Download cue-sheet CSV</button><button id="open">Open project</button><input id="file" type="file" accept=".json,application/json" hidden></div><div id="cues"></div></section></div><p id="status" role="status" aria-live="polite">Play the example or select a cue to edit it.</p></main><script>
'use strict';const $=id=>document.getElementById(id),ctx=$('stage').getContext('2d');let cues=[],selected=0,time=0,running=false,frame=0,start=0,audio=null,voices=[],scheduled=new Set(),goIndex=0,playRequest=0;function fields(){const type=$('type').value;$('color').parentElement.hidden=type!=='light';$('frequency').parentElement.hidden=type!=='tone';$('text').parentElement.hidden=type!=='text';}$('type').onchange=fields;function rgb(hex){return[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));}function visualAt(t){let color=[18,20,35],text='';for(const c of cues){if(c.time>t)break;if(c.type==='text')text=c.text;else if(c.type==='light'||c.type==='blackout'){const target=c.type==='blackout'?[0,0,0]:rgb(c.color),ratio=Math.min(1,(t-c.time)/c.duration);color=color.map((v,i)=>v+(target[i]-v)*ratio);}}return{color:color.map(Math.round),text};}function draw(){const state=visualAt(time),color=`rgb(${state.color.join(',')})`;ctx.fillStyle='#080910';ctx.fillRect(0,0,1000,560);const glow=ctx.createRadialGradient(500,260,20,500,260,570);glow.addColorStop(0,color);glow.addColorStop(1,'#080910');ctx.fillStyle=glow;ctx.fillRect(0,0,1000,560);ctx.fillStyle='#090a11';ctx.fillRect(0,440,1000,120);for(const x of [370,630]){ctx.beginPath();ctx.arc(x,290,25,0,Math.PI*2);ctx.fill();ctx.fillRect(x-20,320,40,95);ctx.fillRect(x-20,405,13,50);ctx.fillRect(x+7,405,13,50);}ctx.fillStyle='#e9e3d4';ctx.textAlign='center';ctx.font=`${Math.min(35,900/Math.max(1,state.text.length)*1.7)}px Georgia`;ctx.fillText(state.text,500,150);$('position').textContent=time.toFixed(2);$('scrub').value=time;document.querySelectorAll('.cue').forEach((row,i)=>row.classList.toggle('active',i===selected));}async function ready(){if(!audio){const Type=window.AudioContext||window.webkitAudioContext;if(!Type)throw Error('Audio support is unavailable.');audio=new Type();}await audio.resume();}function sound(c,when){const osc=audio.createOscillator(),env=audio.createGain();osc.frequency.value=c.frequency;env.gain.setValueAtTime(.0001,when);env.gain.exponentialRampToValueAtTime(.18,when+.02);env.gain.exponentialRampToValueAtTime(.0001,when+c.duration);osc.connect(env);env.connect(audio.destination);osc.start(when);osc.stop(when+c.duration+.01);voices.push(osc);osc.onended=()=>{osc.disconnect();voices=voices.filter(v=>v!==osc);};}function stop(){playRequest++;running=false;cancelAnimationFrame(frame);voices.forEach(v=>{try{v.stop();}catch{}});voices=[];$('play').textContent='Play rehearsal';}function endTime(){return Math.min(200,Math.max(5,...cues.map(c=>c.time+c.duration+1)));}function tick(now){if(!running)return;time=(now-start)/1000;for(let i=0;i<cues.length;i++){const c=cues[i];if(c.type==='tone'&&!scheduled.has(i)&&c.time>=time-.04&&c.time<time+.12){sound(c,audio.currentTime+Math.max(0,c.time-time));scheduled.add(i);}}if(time>=endTime()){stop();time=endTime();}draw();if(running)frame=requestAnimationFrame(tick);}function load(){const c=cues[selected];if(c){$('name').value=c.name;$('at').value=c.time;for(const p of ['duration','type','color','frequency','text'])$(p).value=c[p];}fields();$('update').disabled=!c;$('add').disabled=cues.length>=80;$('play').disabled=cues.length===0;$('go').disabled=goIndex>=cues.length;draw();}function list(){cues.sort((a,b)=>a.time-b.time);const f=document.createDocumentFragment();cues.forEach((c,i)=>{const row=document.createElement('div');row.className='cue';const when=document.createElement('span');when.textContent=c.time.toFixed(1)+'s';const type=document.createElement('span');type.textContent=c.type;const button=document.createElement('button');button.textContent=c.name;button.onclick=()=>{selected=i;load();};const remove=document.createElement('button');remove.textContent='Delete';remove.onclick=()=>{stop();cues.splice(i,1);goIndex=0;selected=Math.max(0,selected-1);list();};row.append(when,type,button,remove);f.append(row);});$('cues').replaceChildren(f);$('scrub').max=endTime();load();}function form(){const c={name:$('name').value,time:Number($('at').value),duration:Number($('duration').value),type:$('type').value,color:$('color').value,frequency:Number($('frequency').value),text:$('text').value};if(!Number.isFinite(c.time)||c.time<0||c.time>180||!Number.isFinite(c.duration)||c.duration<.1||c.duration>20||!Number.isFinite(c.frequency)||c.frequency<40||c.frequency>2000)throw Error('Check the time, duration and frequency ranges.');return c;}$('add').onclick=()=>{stop();goIndex=0;try{if(cues.length>=80)throw Error('The eighty-cue limit is reached.');const c=form();cues.push(c);list();selected=cues.indexOf(c);load();}catch(e){$('status').textContent=e.message;}};$('update').onclick=()=>{stop();goIndex=0;try{const c=form();if(cues[selected]){cues[selected]=c;list();selected=cues.indexOf(c);load();}}catch(e){$('status').textContent=e.message;}};$('play').onclick=async()=>{if(running){stop();return;}const request=++playRequest;try{await ready();if(request!==playRequest)return;scheduled=new Set(cues.flatMap((c,i)=>c.time<time?[i]:[]));running=true;start=performance.now()-time*1000;$('play').textContent='Pause rehearsal';frame=requestAnimationFrame(tick);}catch(e){$('status').textContent=e.message;}};$('stop').onclick=stop;$('scrub').oninput=()=>{stop();time=Number($('scrub').value);goIndex=cues.findIndex(c=>c.time>time);if(goIndex<0)goIndex=cues.length;$('go').disabled=goIndex>=cues.length;draw();};$('go').onclick=async()=>{stop();if(goIndex>=cues.length){$('status').textContent='All cues are complete. Return to the start to rehearse again.';return;}const cue=cues[goIndex],request=playRequest;time=cue.time;selected=goIndex++;load();if(cue.type==='tone')try{await ready();if(request!==playRequest)return;sound(cue,audio.currentTime);}catch(e){$('status').textContent=e.message;}};$('reset').onclick=()=>{stop();time=0;goIndex=0;$('go').disabled=cues.length===0;draw();};function example(){stop();cues=[{time:0,type:'light',name:'Blue morning',duration:2,color:'#345c8d',frequency:220,text:''},{time:1,type:'text',name:'Title',duration:1,color:'#ffffff',frequency:220,text:'Awakening Light'},{time:2,type:'tone',name:'First sound',duration:1.6,color:'#ffffff',frequency:220,text:''},{time:4,type:'light',name:'Warm encounter',duration:2,color:'#b97d40',frequency:220,text:''},{time:6,type:'text',name:'Turning point',duration:1,color:'#ffffff',frequency:220,text:'Two paths met on the same stage.'},{time:7.5,type:'tone',name:'Response',duration:1.4,color:'#ffffff',frequency:330,text:''},{time:10,type:'text',name:'Final line',duration:1,color:'#ffffff',frequency:220,text:'Beyond the dark, another light.'},{time:12,type:'blackout',name:'Curtain',duration:2,color:'#000000',frequency:220,text:''}];selected=0;time=0;goIndex=0;list();}$('example').onclick=()=>{if(confirm('Replace the cue list with the example?'))example();};function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}$('save').onclick=()=>download(new Blob([JSON.stringify({version:1,cues})],{type:'application/json'}),'stage-cues.json');$('csv').onclick=()=>{const quote=v=>{let text=String(v);if(typeof v==='string'&&['=','+','-','@','\t','\r'].includes(text[0]))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';},rows=[['name','time','type','duration','color','frequency','text'],...cues.map(c=>[c.name,c.time,c.type,c.duration,c.color,c.frequency,c.text])];download(new Blob([rows.map(r=>r.map(quote).join(',')).join('\n')],{type:'text/csv'}),'stage-cues.csv');};$('open').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>70000)throw Error('The file is too large.');const s=JSON.parse(await f.text());if(!s||s.version!==1||!Array.isArray(s.cues)||s.cues.length>80||s.cues.some(c=>typeof c.name!=='string'||c.name.length>40||typeof c.text!=='string'||c.text.length>100||!['light','tone','text','blackout'].includes(c.type)||!Number.isFinite(c.time)||c.time<0||c.time>180||!Number.isFinite(c.duration)||c.duration<.1||c.duration>20||!/^#[0-9a-f]{6}$/i.test(c.color)||!Number.isFinite(c.frequency)||c.frequency<40||c.frequency>2000))throw Error('Invalid rehearsal file.');if(!confirm('Replace the cue list with the selected project?'))return;stop();cues=s.cues;selected=0;time=0;goIndex=0;list();}catch(e){$('status').textContent=e.message;}$('file').value='';};example();document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
