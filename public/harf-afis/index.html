<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Type Poster — Turn words into form</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1100px;padding:25px;margin:auto;display:grid;grid-template-columns:290px 1fr;gap:30px}h1{font:34px Georgia}p{line-height:1.8}label{display:grid;gap:6px;margin:17px 0}input,select,button{font:inherit;padding:9px;border:1px solid #b8b8b8;background:#ffffff;color:inherit}input[type=range]{padding:0}input[type=color]{height:40px;width:100%}button{cursor:pointer;margin:4px}button:hover{background:#ffffff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}#poster svg{width:100%;height:auto;max-height:750px;display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}#status{min-height:25px}.actions{display:flex;flex-wrap:wrap}#link{width:100%;box-sizing:border-box;font-size:11px}@media(max-width:700px){main{grid-template-columns:1fr}aside{order:2}}</style>
<link rel="stylesheet" href="../assets/appearance.css" data-binsite-appearance="style">
<script src="../assets/appearance.js" defer data-binsite-appearance="script"></script>
<main><aside><h1>Type Poster</h1><p>Turn a phrase into a printable poster with letter spacing, layout and white space.</p><label>Main text<input id="title" value="A SMALL SPARK" maxlength="32"></label><label>Subtitle<input id="subtitle" value="A big night for small ideas" maxlength="60"></label><label>Details<input id="detail" value="OCTOBER 24 · IDEA WORKSHOP" maxlength="55"></label><label>Layout<select id="layout"><option value="stack">Stacked words</option><option value="arc">Curved text</option><option value="diagonal">Diagonal headline</option></select></label><label>Font family<select id="font"><option value="serif">Serif</option><option value="sans-serif">Sans serif</option><option value="monospace">Monospace</option></select></label><label>Size<input id="size" type="range" min="28" max="120" value="74"></label><label>Letter spacing<input id="spacing" type="range" min="-3" max="16" value="2"></label><div class="row"><label>Background<input id="bg" type="color" value="#ebc34b"></label><label>Ink<input id="ink" type="color" value="#232623"></label></div><label><span><input id="frame" type="checkbox" checked> Frame and geometric accent</span></label></aside><section><div id="poster"></div><div class="actions"><button id="svg">Download vector SVG</button><button id="png">Download PNG</button><button id="share">Editable link</button></div><input id="link" readonly aria-label="Poster link"><p id="status" role="status" aria-live="polite">The poster uses a 600 × 800 canvas. Enlarge the SVG for printing.</p></section></main><script>
'use strict';const $=id=>document.getElementById(id),keys=['title','subtitle','detail','layout','font','size','spacing','bg','ink','frame'];function esc(s){return String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));}function state(){return Object.fromEntries(keys.map(k=>[k,k==='frame'?$(k).checked:$(k).value]));}function source(){const s=state(),size=Number(s.size),spacing=Number(s.spacing),style=`fill="${s.ink}" font-family="${s.font}" text-anchor="middle"`;let title='';if(s.layout==='arc')title=`<defs><path id="arc" d="M80 420 Q300 120 520 420"/></defs><text ${style} font-size="${size*.7}" letter-spacing="${spacing}"><textPath href="#arc" startOffset="50%">${esc(s.title)}</textPath></text>`;else if(s.layout==='diagonal')title=`<g transform="translate(300 380) rotate(-18)"><text ${style} font-size="${Math.min(size,480/Math.max(1,s.title.length)*1.7)}" letter-spacing="${spacing}" y="0">${esc(s.title)}</text></g>`;else{const words=s.title.split(/\s+/).filter(Boolean),textSize=Math.min(size,Math.max(8,350/Math.max(1,words.length)-15));title=words.map((word,i)=>`<text ${style} x="300" y="${300+i*(textSize+15)-(words.length-1)*(textSize+15)/2}" font-size="${Math.min(textSize,460/Math.max(1,word.length)*1.7)}" letter-spacing="${spacing}" font-weight="700">${esc(word)}</text>`).join('');}return `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800"><rect width="600" height="800" fill="${s.bg}"/>${s.frame?`<rect x="26" y="26" width="548" height="748" fill="none" stroke="${s.ink}" stroke-width="2"/><circle cx="300" cy="560" r="66" fill="none" stroke="${s.ink}" stroke-width="12"/><path d="M300 478 V642 M218 560 H382" stroke="${s.ink}" stroke-width="3"/>`:''}${title}<text ${style} x="300" y="682" font-size="${Math.min(21,510/Math.max(1,s.subtitle.length)*1.65)}">${esc(s.subtitle)}</text><text ${style} x="300" y="725" font-size="13" letter-spacing="1">${esc(s.detail)}</text></svg>`;}function render(){$('poster').innerHTML=source();}keys.forEach(k=>$(k).oninput=render);function download(b,n){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}$('svg').onclick=()=>download(new Blob([source()],{type:'image/svg+xml'}),'type-poster.svg');$('png').onclick=()=>{const u=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'})),image=new Image();image.onload=()=>{const c=document.createElement('canvas');c.width=1200;c.height=1600;c.getContext('2d').drawImage(image,0,0,1200,1600);c.toBlob(b=>{if(b)download(b,'type-poster.png');});URL.revokeObjectURL(u);};image.onerror=()=>{$('status').textContent='The image could not be opened. Use the SVG export instead.';URL.revokeObjectURL(u);};image.src=u;};$('share').onclick=async()=>{const u=new URL(location.href);u.hash='a='+btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(state()))));$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Poster link copied.';}catch{$('link').select();}};if(location.hash.startsWith('#a='))try{if(location.hash.length>4000)throw Error();const s=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(location.hash.slice(3)),c=>c.charCodeAt(0))));if(!['stack','arc','diagonal'].includes(s.layout)||!['serif','sans-serif','monospace'].includes(s.font)||!/^#[0-9a-f]{6}$/i.test(s.bg)||!/^#[0-9a-f]{6}$/i.test(s.ink)||Number(s.size)<28||Number(s.size)>120||Number(s.spacing)<-3||Number(s.spacing)>16||typeof s.frame!=='boolean'||[['title',32],['subtitle',60],['detail',55]].some(([k,n])=>typeof s[k]!=='string'||s[k].length>n))throw Error();keys.forEach(k=>k==='frame'?$(k).checked=s[k]:$(k).value=s[k]);}catch{$('status').textContent='The link could not be opened. An example poster is ready.';}render();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
