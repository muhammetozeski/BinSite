<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harf Afiş — Sözcüğü biçime dönüştür</title><style>body{margin:0;background:#e9e5df;color:#242323;font:14px system-ui}main{max-width:1100px;padding:25px;margin:auto;display:grid;grid-template-columns:290px 1fr;gap:30px}h1{font:34px Georgia}p{line-height:1.8}label{display:grid;gap:6px;margin:17px 0}input,select,button{font:inherit;padding:9px;border:1px solid #aaa093;background:#fffaf0;color:inherit}input[type=range]{padding:0}input[type=color]{height:40px;width:100%}button{cursor:pointer;margin:4px}button:hover{background:#d9c494}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bd7e28;outline-offset:2px}#poster svg{width:100%;height:auto;max-height:750px;display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}#status{min-height:25px}.actions{display:flex;flex-wrap:wrap}#link{width:100%;box-sizing:border-box;font-size:11px}@media(max-width:700px){main{grid-template-columns:1fr}aside{order:2}}</style><main><aside><h1>Harf Afiş</h1><p>Harf aralığı, yerleşim ve boşluk ile bir cümleyi basılabilir bir afişe dönüştür.</p><label>Ana sözcük<input id="title" value="BİR KIVILCIM" maxlength="32"></label><label>Alt satır<input id="subtitle" value="Küçük fikirlerin büyük gecesi" maxlength="60"></label><label>Künye<input id="detail" value="24 EKİM · HAYAL ATÖLYESİ" maxlength="55"></label><label>Yerleşim<select id="layout"><option value="stack">Dikey sözcük yığını</option><option value="arc">Yay biçimi</option><option value="diagonal">Çapraz başlık</option></select></label><label>Yazı ailesi<select id="font"><option value="serif">Kitap karakteri</option><option value="sans-serif">Düz karakter</option><option value="monospace">Eş aralıklı karakter</option></select></label><label>Boyut<input id="size" type="range" min="28" max="120" value="74"></label><label>Harf aralığı<input id="spacing" type="range" min="-3" max="16" value="2"></label><div class="row"><label>Zemin<input id="bg" type="color" value="#ebc34b"></label><label>Mürekkep<input id="ink" type="color" value="#232623"></label></div><label><span><input id="frame" type="checkbox" checked> Çerçeve ve geometrik vurgu</span></label></aside><section><div id="poster"></div><div class="actions"><button id="svg">Vektör SVG indir</button><button id="png">PNG indir</button><button id="share">Düzenlenebilir bağlantı</button></div><input id="link" readonly aria-label="Afiş bağlantısı"><p id="status" role="status" aria-live="polite">Afiş 600 × 800 oranında hazırlanır. SVG dosyası baskı için büyütülebilir.</p></section></main><script>
'use strict';const $=id=>document.getElementById(id),keys=['title','subtitle','detail','layout','font','size','spacing','bg','ink','frame'];function esc(s){return String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));}function state(){return Object.fromEntries(keys.map(k=>[k,k==='frame'?$(k).checked:$(k).value]));}function source(){const s=state(),size=Number(s.size),spacing=Number(s.spacing),style=`fill="${s.ink}" font-family="${s.font}" text-anchor="middle"`;let title='';if(s.layout==='arc')title=`<defs><path id="arc" d="M80 420 Q300 120 520 420"/></defs><text ${style} font-size="${size*.7}" letter-spacing="${spacing}"><textPath href="#arc" startOffset="50%">${esc(s.title)}</textPath></text>`;else if(s.layout==='diagonal')title=`<g transform="translate(300 380) rotate(-18)"><text ${style} font-size="${Math.min(size,480/Math.max(1,s.title.length)*1.7)}" letter-spacing="${spacing}" y="0">${esc(s.title)}</text></g>`;else{const words=s.title.split(/\s+/).filter(Boolean);title=words.map((word,i)=>`<text ${style} x="300" y="${300+i*(size+15)-(words.length-1)*(size+15)/2}" font-size="${Math.min(size,460/Math.max(1,word.length)*1.7)}" letter-spacing="${spacing}" font-weight="700">${esc(word)}</text>`).join('');}return `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800"><rect width="600" height="800" fill="${s.bg}"/>${s.frame?`<rect x="26" y="26" width="548" height="748" fill="none" stroke="${s.ink}" stroke-width="2"/><circle cx="300" cy="560" r="66" fill="none" stroke="${s.ink}" stroke-width="12"/><path d="M300 478 V642 M218 560 H382" stroke="${s.ink}" stroke-width="3"/>`:''}${title}<text ${style} x="300" y="682" font-size="${Math.min(21,510/Math.max(1,s.subtitle.length)*1.65)}">${esc(s.subtitle)}</text><text ${style} x="300" y="725" font-size="13" letter-spacing="1">${esc(s.detail)}</text></svg>`;}function render(){$('poster').innerHTML=source();}keys.forEach(k=>$(k).oninput=render);function download(b,n){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}$('svg').onclick=()=>download(new Blob([source()],{type:'image/svg+xml'}),'harf-afis.svg');$('png').onclick=()=>{const u=URL.createObjectURL(new Blob([source()],{type:'image/svg+xml'})),image=new Image();image.onload=()=>{const c=document.createElement('canvas');c.width=1200;c.height=1600;c.getContext('2d').drawImage(image,0,0,1200,1600);c.toBlob(b=>{if(b)download(b,'harf-afis.png');});URL.revokeObjectURL(u);};image.onerror=()=>{$('status').textContent='Görüntü açılamadı; SVG çıktısını kullanabilirsin.';URL.revokeObjectURL(u);};image.src=u;};$('share').onclick=async()=>{const u=new URL(location.href);u.hash='a='+btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(state()))));$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Afiş bağlantısı kopyalandı.';}catch{$('link').select();}};if(location.hash.startsWith('#a='))try{if(location.hash.length>4000)throw Error();const s=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(location.hash.slice(3)),c=>c.charCodeAt(0))));if(!['stack','arc','diagonal'].includes(s.layout)||!['serif','sans-serif','monospace'].includes(s.font)||!/^#[0-9a-f]{6}$/i.test(s.bg)||!/^#[0-9a-f]{6}$/i.test(s.ink)||Number(s.size)<28||Number(s.size)>120||Number(s.spacing)<-3||Number(s.spacing)>16||typeof s.frame!=='boolean'||[['title',32],['subtitle',60],['detail',55]].some(([k,n])=>typeof s[k]!=='string'||s[k].length>n))throw Error();keys.forEach(k=>k==='frame'?$(k).checked=s[k]:$(k).value=s[k]);}catch{$('status').textContent='Bağlantı açılamadı; örnek afiş hazır.';}render();
</script></html>
