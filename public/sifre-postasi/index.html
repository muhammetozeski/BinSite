<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cipher Post — Turn a sentence into a puzzle</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1050px;margin:auto;padding:26px}h1{font:35px Georgia}p{line-height:1.8}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,input,textarea,select{font:inherit;padding:10px;border:1px solid #b8b8b8;background:#ffffff;color:inherit}button{cursor:pointer}button:hover{background:#ffffff}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}label{display:grid;gap:7px;margin:15px 0}textarea,input[type=text]{width:100%;box-sizing:border-box}#editor{display:grid;grid-template-columns:1fr 1fr;gap:25px}.envelope{background:#ffffff;border:1px solid #b8b8b8;padding:30px;border-top:8px solid #b8b8b8}#cipher{font:22px/1.9 monospace;white-space:pre-wrap;overflow-wrap:anywhere;letter-spacing:2px}#clue{font:italic 18px/1.8 Georgia}#work{font:18px/1.7 monospace;white-space:pre-wrap;background:#ffffff;padding:15px;overflow-wrap:anywhere}#status{min-height:30px;color:#222}#link{width:100%;box-sizing:border-box;font-size:11px}.keys{display:flex;gap:7px;flex-wrap:wrap}.keys span{font:12px monospace;background:#ffffff;padding:7px}.small{font-size:12px}[hidden]{display:none!important}@media(max-width:650px){#editor{grid-template-columns:1fr}.envelope{padding:20px}}</style>

<main><h1>Cipher Post</h1><p>Turn a message into a puzzle for someone to solve.</p><div class="bar"><button id="makeMode" hidden>Write a message</button><button id="example">Solve an example</button></div><section id="editor"><div><label>Secret sentence<textarea id="message" maxlength="250" rows="5">CURIOSITY OPENS THE DOOR</textarea></label><label>Cipher method<select id="method"><option value="shift">Letter-shift wheel</option><option value="dots">Dot-and-dash code</option></select></label><label>Letter shift<input id="shift" type="number" min="1" max="25" value="7"></label><label>Hint<textarea id="hint" maxlength="200" rows="3">I moved as many places as there are days in a week. Move back by the same amount.</textarea></label><button id="create">Create cipher message</button><p class="small">For puzzles, not private messages.</p></div><div><h2>Starting messages</h2><button data-sample="0">Load door message</button><button data-sample="1">Load seaside message</button><button data-sample="2">Load surprise message</button></div></section><section id="player" class="envelope" hidden><h2>Cipher</h2><div id="cipher"></div><p id="clue"></p><div id="wheel"><label>Decoding wheel: <output id="candidateValue">0</output> letters back<input id="candidate" type="range" min="0" max="25" value="0"></label><div id="work"></div><button id="tryWheel">Check wheel result</button></div><label>Your decoded sentence<textarea id="answer" maxlength="300" rows="3" placeholder="Type the decoded message"></textarea></label><button id="check">Check solution</button><details id="codeAlphabet"><summary>Code alphabet</summary><div id="keys" class="keys"></div><p class="small">Code letters are separated by spaces and words by /. The dot-and-dash code supports A–Z, 0–9 and spaces.</p></details></section><p id="status" role="status" aria-live="polite">Write a new message or solve an example.</p><div class="bar"><button id="share" hidden>Copy player link</button><button id="textFile" hidden>Save puzzle text</button></div><input id="link" hidden readonly aria-label="Cipher puzzle link"></main><script>
'use strict';const $=id=>document.getElementById(id),alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ',morse=['.-','-...','-.-.','-..','.','..-.','--.','....','..','.---','-.-','.-..','--','-.','---','.--.','--.-','.-.','...','-','..-','...-','.--','-..-','-.--','--..','-----','.----','..---','...--','....-','.....','-....','--...','---..','----.'],symbols=alphabet+'0123456789';let challenge=null,attempts=0,start=0;function normal(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}function rotate(s,shift){return s.replace(/[A-Z]/g,c=>alphabet[(alphabet.indexOf(c)+shift+26)%26]);}function checksum(s){let hash=2166136261;for(const c of normal(s))hash=Math.imul(hash^c.charCodeAt(0),16777619)>>>0;return hash.toString(16);}function encodeDots(s){return normal(s).split(' ').map(word=>[...word].map(c=>morse[symbols.indexOf(c)]).join(' ')).join(' / ');}function render(){if(!challenge)return;$('makeMode').hidden=false;$('codeAlphabet').hidden=challenge.method!=='dots';$('editor').hidden=true;$('player').hidden=false;$('share').hidden=false;$('textFile').hidden=false;$('cipher').textContent=challenge.cipher;$('clue').textContent=challenge.hint;$('wheel').hidden=challenge.method!=='shift';$('candidate').value=0;$('candidateValue').textContent=0;$('work').textContent=challenge.cipher;$('answer').value='';attempts=0;start=performance.now();$('status').textContent=challenge.method==='shift'?'Move the wheel or enter your decoded sentence.':'Use the code alphabet to decode the sentence.';}function create(){const text=normal($('message').value),method=$('method').value,shift=Number($('shift').value);if(!text){$('status').textContent='Enter a sentence containing letters or digits.';return;}if(method==='shift'&&(!Number.isInteger(shift)||shift<1||shift>25)){$('status').textContent='Choose a shift from 1 to 25.';return;}challenge={version:1,method,cipher:method==='shift'?rotate(text,shift):encodeDots(text),hint:$('hint').value,digest:checksum(text)};render();}$('create').onclick=create;$('makeMode').onclick=()=>{$('editor').hidden=false;$('player').hidden=true;$('makeMode').hidden=true;$('share').hidden=true;$('textFile').hidden=true;$('link').hidden=true;};const samples=[['CURIOSITY OPENS THE DOOR','shift',7,'I moved as many places as there are days in a week. Move back by the same amount.'],['MEET ME BY THE SEA','dots',3,'Read the short and long marks in order. Words are separated by /.'],['MAKE ONE SMALL THING TODAY','shift',13,'I moved halfway around the alphabet. Move the same distance again to return home.']];function updateMethod(){$('shift').disabled=$('method').value!=='shift';}$('method').onchange=updateMethod;function sample(i,play=true){const[text,method,shift,hint]=samples[i];$('message').value=text;$('method').value=method;$('shift').value=shift;$('hint').value=hint;updateMethod();if(play)create();}document.querySelectorAll('[data-sample]').forEach(b=>b.onclick=()=>sample(Number(b.dataset.sample),false));$('example').onclick=()=>sample(0);$('candidate').oninput=()=>{$('candidateValue').textContent=$('candidate').value;$('work').textContent=rotate(challenge.cipher,-Number($('candidate').value));};function check(){if(!challenge)return;const guess=normal($('answer').value);if(!guess){$('status').textContent='Enter a solution first.';return;}attempts++;$('status').textContent=checksum(guess)===challenge.digest?`Solved in ${attempts} attempts and ${Math.floor((performance.now()-start)/1000)} seconds.`:'That is not the correct sentence yet. Check the clue and letter spacing.';}$('check').onclick=check;$('tryWheel').onclick=()=>{$('answer').value=$('work').textContent;check();};symbols.split('').forEach((letter,i)=>{const item=document.createElement('span');item.textContent=letter+' '+morse[i];$('keys').append(item);});function pack(s){return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(s))));}$('share').onclick=async()=>{if(!challenge)return;const u=new URL(location.href);u.hash='p='+pack(challenge);$('link').hidden=false;$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Puzzle link copied.';}catch{$('link').select();}};$('textFile').onclick=()=>{if(!challenge)return;const u=URL.createObjectURL(new Blob([challenge.cipher+'\n\nHint: '+challenge.hint],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='cipher-post.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};if(location.hash.startsWith('#p='))try{if(location.hash.length>7000)throw Error();const s=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(location.hash.slice(3)),c=>c.charCodeAt(0))));if(!s||s.version!==1||!['shift','dots'].includes(s.method)||typeof s.cipher!=='string'||s.cipher.length>2000||typeof s.hint!=='string'||s.hint.length>200||typeof s.digest!=='string'||!/[0-9a-f]{1,8}/.test(s.digest))throw Error();challenge=s;render();}catch{$('status').textContent='The shared message could not be opened. Write a new cipher.';}
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
