<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perspective Room — Sketch your space</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1150px;margin:auto;padding:24px;display:grid;grid-template-columns:270px 1fr;gap:25px}h1{font:31px Georgia}p{line-height:1.8;font-size:13px}label{display:grid;gap:7px;margin:16px 0}button,select,input{font:inherit}button,select{background:#fff;border:1px solid #b8b8b8;padding:9px 13px;color:inherit;cursor:pointer}button:hover{background:#ffffff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}input[type=range]{width:100%;accent-color:#b8b8b8}canvas{width:100%;height:auto;background:#ffffff;display:block}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}#objects{width:100%}#link{width:100%;padding:8px;font-size:11px;box-sizing:border-box}#status{min-height:25px}@media(max-width:750px){main{display:grid;grid-template-columns:1fr}aside{display:contents}aside>h1{grid-row:1}aside>p:first-of-type{grid-row:2}main>section{grid-row:3}}</style>
<style data-static-readability="calm">
html[data-bs-theme="dark"]{color-scheme:dark;background:#15191f;color:#edf2f7}
html[data-bs-theme="dark"] body,html[data-bs-theme="dark"] header{background:#15191f;color:#edf2f7}
body{font-size:16px;line-height:1.5}h1{font-size:clamp(25px,3vw,32px);line-height:1.15;margin-bottom:8px}h2{line-height:1.3}p{line-height:1.55}
html[data-bs-theme="dark"] a{color:#acc9df}
html[data-bs-theme="dark"] :is(.panel,.paper,.stage,.resource,.metric,.aside,aside,.filters,.recipe,.settings,.canvas-wrap){background:#1d252e;color:#edf2f7;border-color:#465564}
html[data-bs-theme="dark"] :is(.notice,.message,.status,.delta){background:#25323d;color:#edf2f7;border-color:#7f9fac}
html[data-bs-theme="dark"] :is(.fine,.hint,.muted,small,footer,header p){color:#c3cdd7}
html[data-bs-theme="dark"] :is(input:not([type="color"]),select,textarea){background:#202a34;color:#edf2f7;border-color:#657585}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell){background:#28343f;color:#edf2f7;border-color:#607181;border-radius:5px}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell):hover{background:#354653}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell):disabled{opacity:1;color:#bac5d0;background:#242d36;border-color:#465564}
html[data-bs-theme="dark"] :is(.accent,.primary),html[data-bs-theme="dark"] button[aria-pressed="true"]:not(.swatch):not(.pad):not(.tile):not(.cell){background:#405e6d;color:#f4f8fa;border-color:#8baab9}
html[data-bs-theme="dark"] :is(.stat,.recipe,.filters){background:#1d252e;color:#edf2f7;border-color:#465564}
input[type="range"],input[type="checkbox"],progress{accent-color:#8baebd}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #b1d0df;outline-offset:3px}
details.readability-help{border-top:1px solid #50606e;padding-top:10px;margin:18px 0;font-size:14px;line-height:1.6}
details.readability-help summary{cursor:pointer;font-weight:650;min-height:34px;display:list-item}
details.readability-help p{max-width:75ch;margin:10px 0}
html[data-bs-theme="dark"] #add{background:#405e6d;color:#f4f8fa;border:1px solid #91b0be;font-weight:700}
</style>

<link rel="stylesheet" href="../assets/appearance.css" data-binsite-appearance="style">
<script src="../assets/appearance.js" defer data-binsite-appearance="script"></script>
<main><aside><h1>Perspective Room</h1><p>Arrange a room and move the camera to find your view.</p><label>New item<select id="type"><option value="sofa">Sofa</option><option value="table">Table</option><option value="bed">Bed</option><option value="shelf">Cabinet</option><option value="plant">Plant stand</option></select></label><button id="add">Add to room</button><label>Selected item<select id="objects"></select></label><label>Right / left<input id="x" type="range" min="-170" max="170" value="0"></label><label>Front / back<input id="z" type="range" min="-120" max="120" value="0"></label><label>Furniture color<input id="color" type="color" value="#ba8172"></label><div class="bar"><button id="rotate">Rotate 90°</button><button id="remove">Remove furniture</button></div><label>Camera direction<input id="yaw" type="range" min="-70" max="70" value="-25"></label><label>Camera elevation<input id="elevation" type="range" min="15" max="65" value="30"></label><details class="readability-help"><summary>Help</summary><p>This is an arrangement sketch, not a measured floor plan.</p></details></aside><section><canvas id="room" width="950" height="650" aria-label="Depth-projected room sketch"></canvas><div class="bar"><button id="demo">Reset to reading room</button><button id="clear">Empty room</button><button id="png">Download image</button><button id="share">Copy layout link</button></div><input id="link" hidden readonly aria-label="Room layout link"><p id="status" role="status" aria-live="polite">Select an item to move or rotate it.</p></section></main><script>
'use strict';const $=id=>document.getElementById(id),ctx=$('room').getContext('2d'),sizes={sofa:[135,65,65],table:[95,60,48],bed:[95,150,38],shelf:[110,30,135],plant:[35,35,95]},names={sofa:'Sofa',table:'Table',bed:'Bed',shelf:'Cabinet',plant:'Plant stand'};let objects=[],selected=0;function project(x,y,z){const yaw=Number($('yaw').value)*Math.PI/180,el=Number($('elevation').value)*Math.PI/180,rx=x*Math.cos(yaw)-z*Math.sin(yaw),rz=x*Math.sin(yaw)+z*Math.cos(yaw),depth=rz*Math.cos(el)+y*Math.sin(el),factor=700/(700+depth);return{x:475+rx*factor,y:385+(-y*Math.cos(el)+rz*Math.sin(el))*factor,depth};}function polygon(points,color,stroke='#73877c'){const projected=points.map(p=>project(...p));ctx.beginPath();projected.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}function render(){ctx.fillStyle='#f5f3ec';ctx.fillRect(0,0,950,650);polygon([[-210,0,-160],[210,0,-160],[210,0,160],[-210,0,160]],'#d4c6ac');polygon([[-210,0,-160],[210,0,-160],[210,210,-160],[-210,210,-160]],'#e4e7df');polygon([[-210,0,-160],[-210,0,160],[-210,210,160],[-210,210,-160]],'#d8e0d9');for(let x=-200;x<=200;x+=50){const a=project(x,0,-160),b=project(x,0,160);ctx.beginPath();ctx.strokeStyle='#b2aa96';ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}const faces=[];objects.forEach((o,index)=>{let[w,d,h]=sizes[o.type];if(o.rot)[w,d]=[d,w];const x=o.x-w/2,z=o.z-d/2,v=[[x,0,z],[x+w,0,z],[x+w,0,z+d],[x,0,z+d],[x,h,z],[x+w,h,z],[x+w,h,z+d],[x,h,z+d]];for(const[ids,alpha]of [[[0,1,5,4],.18],[[1,2,6,5],.3],[[2,3,7,6],.08],[[3,0,4,7],.22],[[4,5,6,7],0]]){const points=ids.map(i=>v[i]);faces.push({points,color:o.color,alpha,index,depth:points.reduce((s,p)=>s+project(...p).depth,0)/4});}});faces.sort((a,b)=>b.depth-a.depth).forEach(f=>{polygon(f.points,f.color,f.index===selected?'#a27c36':'#5f6f69');if(f.alpha){ctx.fillStyle=`rgba(0,0,0,${f.alpha})`;ctx.fill();}});ctx.fillStyle='#556459';ctx.font='13px system-ui';}function updateList(){const f=document.createDocumentFragment();objects.forEach((o,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`${i+1}. ${names[o.type]}`;f.append(option);});$('objects').replaceChildren(f);selected=Math.max(0,Math.min(selected,objects.length-1));$('objects').value=selected;loadControls();}function loadControls(){for(const id of ['objects','x','z','color','rotate','remove'])$(id).disabled=!objects[selected];if(objects[selected]){const o=objects[selected];$('x').value=o.x;$('z').value=o.z;$('color').value=o.color;}render();}$('objects').onchange=()=>{selected=Number($('objects').value);loadControls();};for(const id of ['x','z','color'])$(id).oninput=()=>{const o=objects[selected];if(o){o[id]=id==='color'?$(id).value:Number($(id).value);render();}};['yaw','elevation'].forEach(id=>$(id).oninput=render);$('rotate').onclick=()=>{if(objects[selected])objects[selected].rot=!objects[selected].rot;render();};$('remove').onclick=()=>{objects.splice(selected,1);updateList();};$('add').onclick=()=>{if(objects.length>=18){$('status').textContent='The 18-object limit is reached.';return;}objects.push({type:$('type').value,x:0,z:30,color:$('color').value,rot:false});selected=objects.length-1;updateList();};function demo(){objects=[{type:'sofa',x:80,z:-95,color:'#bd8272',rot:false},{type:'table',x:80,z:10,color:'#bd9b66',rot:false},{type:'shelf',x:-120,z:-110,color:'#7d9689',rot:false},{type:'plant',x:-145,z:95,color:'#5e8d68',rot:false}];selected=0;updateList();}$('demo').onclick=demo;$('clear').onclick=()=>{objects=[];updateList();};$('png').onclick=()=>$('room').toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='perspektif-room.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);});$('share').onclick=async()=>{const u=new URL(location.href);u.hash='r='+btoa(JSON.stringify({objects,yaw:Number($('yaw').value),elevation:Number($('elevation').value)}));$('link').hidden=false;$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Layout link copied.';}catch{$('link').select();}};demo();if(location.hash.startsWith('#r='))try{if(location.hash.length>7000)throw Error();const s=JSON.parse(atob(location.hash.slice(3)));if(!s||!Array.isArray(s.objects)||s.objects.length>18||s.objects.some(o=>!sizes[o.type]||!Number.isFinite(o.x)||!Number.isFinite(o.z)||Math.abs(o.x)>170||Math.abs(o.z)>120||!/^#[0-9a-f]{6}$/i.test(o.color)||typeof o.rot!=='boolean')||!Number.isFinite(s.yaw)||Math.abs(s.yaw)>70||!Number.isFinite(s.elevation)||s.elevation<15||s.elevation>65)throw Error();objects=s.objects;$('yaw').value=s.yaw;$('elevation').value=s.elevation;updateList();}catch{$('status').textContent='The layout could not be opened. A reading-room example is ready.';}
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
