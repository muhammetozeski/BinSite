<!doctype html>
<html data-bs-theme="dark" lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d4a"><title>Route Master — Visit every city once</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f1e9;color:#19333a;font:16px/1.55 system-ui,sans-serif}header,main{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:2rem;margin:0}h2{margin:0 0 12px;font-size:1.1rem}p{margin:8px 0}a{color:inherit}button,select,input{font:inherit}button,select{border:1px solid #9aafb3;padding:10px 15px;background:white;color:inherit;cursor:pointer}button:hover{background:#e3eff0}button:disabled{opacity:.45;cursor:default}.primary{background:#173d4a;color:white}.primary:hover{background:#245667}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:20px}.panel{background:#fffdf8;border:1px solid #d9dfd7;padding:20px}.toolbar,.actions,.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stats{margin:14px 0}.stats span{background:#e9efea;padding:7px 10px;font-size:.92rem}.map{width:100%;min-height:300px;display:block;background:#eaf0e8;}.edge{stroke:#aebbb4;stroke-width:2}.edge.used{stroke:#16856d;stroke-width:5}.edge-label{fill:#5c7067;font-size:10px;paint-order:stroke;stroke:#eaf0e8;stroke-width:3px}.city{cursor:pointer}.city circle{fill:white;stroke:#738c83;stroke-width:2}.city.available circle{stroke:#16856d;stroke-width:4}.city.visited circle{fill:#bedcd0}.city.current circle{fill:#173d4a;stroke:#173d4a}.city text{fill:#19333a;font-size:12px;font-weight:700;pointer-events:none}.city.current text{fill:white}.city.hint circle{stroke:#d47913;stroke-width:6}.message{min-height:55px;margin:14px 0;padding:12px;background:#f1f4ed;border-left:4px solid #16856d}.route{overflow-wrap:anywhere;font-weight:600}.fine{font-size:.85rem;color:#5a6e66}ol{padding-left:20px}.score{font-size:2.4rem;line-height:1.2;color:#16856d}.mobile-picks{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.mobile-picks button{padding:6px 10px}summary{cursor:pointer;font-weight:600}@media(max-width:760px){header{align-items:flex-start;flex-direction:column;padding-bottom:0}.layout{grid-template-columns:1fr}main{padding:16px}.map{min-height:240px}.panel{padding:14px}}@media(prefers-reduced-motion:no-preference){.city circle{transition:fill .15s}}

body{background:#fff;color:#111}header{background:#fff;color:#111}a{color:#0645ad}.panel,.paper,.stage,.resource,.metric,.aside,aside{background:#fff;color:#111}.notice,.message,.status,.delta{background:#f0f0f0;color:#111;border-left-color:#111}.fine,.muted{color:#444}button:not(.pad):not(.tile){background:#111;color:#fff;border:1px solid #111}input,textarea,select{background:#fff;color:#111;border:1px solid #111}.pad.lit{box-shadow:none}
</style>
<link rel="stylesheet" href="../assets/appearance.css" data-binsite-appearance="style">
<script src="../assets/appearance.js" defer data-binsite-appearance="script"></script>

<style data-static-readability="calm">
html[data-bs-theme="dark"]{color-scheme:dark;background:#15191f;color:#edf2f7}
html[data-bs-theme="dark"] body,html[data-bs-theme="dark"] header{background:#15191f;color:#edf2f7}
body{font-size:16px;line-height:1.5}h1{font-size:clamp(25px,3vw,32px);line-height:1.15;margin-bottom:8px}h2{line-height:1.3}p{line-height:1.55}
html[data-bs-theme="dark"] a{color:#acc9df}
html[data-bs-theme="dark"] :is(.panel,.paper,.stage,.resource,.metric,.aside,aside,.filters,.recipe,.settings,.canvas-wrap){background:#1d252e;color:#edf2f7;border-color:#465564}
html[data-bs-theme="dark"] :is(.notice,.message,.status,.delta){background:#25323d;color:#edf2f7;border-color:#7f9fac}
html[data-bs-theme="dark"] :is(.fine,.hint,.muted,small,footer,header p){color:#c3cdd7}
html[data-bs-theme="dark"] :is(input:not([type="color"]),select,textarea){background:#202a34;color:#edf2f7;border-color:#657585}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell){background:#28343f;color:#edf2f7;border-color:#607181;border-radius:5px}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell):hover{background:#354653}
html[data-bs-theme="dark"] button:not(.pad):not(.tile):not(.swatch):not(.cell):disabled{opacity:1;color:#bac5d0;background:#242d36;border-color:#465564}
html[data-bs-theme="dark"] :is(.accent,.primary),html[data-bs-theme="dark"] button[aria-pressed="true"]:not(.swatch):not(.pad):not(.tile):not(.cell){background:#405e6d;color:#f4f8fa;border-color:#8baab9}
html[data-bs-theme="dark"] :is(.stat,.recipe,.filters){background:#1d252e;color:#edf2f7;border-color:#465564}
input[type="range"],input[type="checkbox"],progress{accent-color:#8baebd}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #b1d0df;outline-offset:3px}
details.readability-help{border-top:1px solid #50606e;padding-top:10px;margin:18px 0;font-size:14px;line-height:1.6}
details.readability-help summary{cursor:pointer;font-weight:650;min-height:34px;display:list-item}
details.readability-help p{max-width:75ch;margin:10px 0}
html[data-bs-theme="dark"] #newMap{background:#405e6d;color:#f4f8fa;border:1px solid #91b0be;font-weight:700}
</style>
</head><body>
<header><div><h1>Route Master</h1><p>Visit every city once, ending at the flag. Shorter routes score more.</p></div><a href="../">Tools</a></header>
<main><div class="toolbar"><label>Difficulty <select id="difficulty"><option value="6">6 cities · Warm-up</option><option value="8" selected>8 cities · Explorer</option><option value="10">10 cities · Expert</option><option value="12">12 cities · Marathon</option></select></label><button id="newMap" class="primary">New map</button><button id="daily">Daily map</button><span id="seedLabel" class="fine"></span></div>
<div class="stats" aria-label="Game status"><span id="visits"></span><span id="distance"></span><span id="record"></span></div>
<div class="layout"><section class="panel"><svg id="map" class="map" viewBox="0 0 640 440" role="img" aria-label="Cities and connecting roads"></svg><div id="choices" class="mobile-picks" aria-label="Available next cities"></div><div id="message" class="message" aria-live="polite"></div><p id="route" class="route"></p><div class="actions"><button id="undo">Undo</button><button id="reset">Restart route</button><button id="hint">Hint (−100 points)</button></div></section>
<aside class="panel"><h2>Route score</h2><div id="score" class="score">—</div><p id="comparison" class="fine"></p><details><summary>Daily maps and records</summary><p>The daily map uses the same date and city count. Best scores are saved on this device.</p></details></aside></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
let game, path, hintCount, highlighted=-1;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}
function hash(text){let n=2166136261;for(const c of text)n=Math.imul(n^c.charCodeAt(0),16777619);return n>>>0}
function shuffle(items,random){for(let i=items.length-1;i>0;i--){let j=Math.floor(random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}
function generate(count,seed){const random=rng(seed), nodes=Array.from({length:count},(_,i)=>{const angle=(i/count)*Math.PI*2-Math.PI/2;return{x:320+Math.cos(angle)*(210+random()*35),y:220+Math.sin(angle)*(145+random()*25)}}), edges=Array.from({length:count},()=>Array(count).fill(0));const link=(a,b)=>{edges[a][b]=edges[b][a]=Math.round(Math.hypot(nodes[a].x-nodes[b].x,nodes[a].y-nodes[b].y)/10)};const route=[0,...shuffle(Array.from({length:count-2},(_,i)=>i+1),random),count-1];for(let i=1;i<count;i++)link(route[i-1],route[i]);let attempts=0,extra=0;while(extra<count&&attempts++<count*count){const a=Math.floor(random()*count),b=Math.floor(random()*count);if(a!==b&&!edges[a][b]){link(a,b);extra++}}return{count,seed,nodes,edges,memo:new Map()}}
function shortest(current,mask){const full=(1<<game.count)-1;if(mask===full)return current===game.count-1?{cost:0,next:-1}:{cost:Infinity,next:-1};const key=mask*16+current;if(game.memo.has(key))return game.memo.get(key);let result={cost:Infinity,next:-1};for(let n=0;n<game.count;n++){if(mask&(1<<n)||!game.edges[current][n]||(n===game.count-1&&(mask|(1<<n))!==full))continue;const rest=shortest(n,mask|(1<<n)),cost=game.edges[current][n]+rest.cost;if(cost<result.cost)result={cost,next:n}}game.memo.set(key,result);return result}
function currentMask(){return path.reduce((mask,n)=>mask|(1<<n),0)}
function totalDistance(){return path.slice(1).reduce((sum,n,i)=>sum+game.edges[path[i]][n],0)}
function available(){const current=path.at(-1);return game.edges[current].map((weight,i)=>({weight,i})).filter(({weight,i})=>weight&&!path.includes(i)&&(i!==game.count-1||path.length===game.count-1))}
function cityName(i){return String.fromCharCode(65+i)}
function storageGet(key){try{return Number(localStorage.getItem(key))||0}catch{return 0}}
function setRecord(score){const key='rota-ustasi-best-'+game.count;if(score>storageGet(key)){try{localStorage.setItem(key,String(score))}catch{}}}
function el(tag,attrs,text){let element=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))element.setAttribute(k,v);if(text!==undefined)element.textContent=text;return element}
function paint(note){const current=path.at(-1),options=available(),distance=totalDistance(),done=path.length===game.count;const svg=$('map');svg.replaceChildren();for(let a=0;a<game.count;a++)for(let b=a+1;b<game.count;b++)if(game.edges[a][b]){const from=game.nodes[a],to=game.nodes[b],used=path.some((n,i)=>i&&((n===a&&path[i-1]===b)||(n===b&&path[i-1]===a)));svg.append(el('line',{x1:from.x,y1:from.y,x2:to.x,y2:to.y,class:'edge'+(used?' used':'')}));svg.append(el('text',{x:(from.x+to.x)/2,y:(from.y+to.y)/2-4,class:'edge-label','text-anchor':'middle'},game.edges[a][b]))}game.nodes.forEach((point,i)=>{const group=el('g',{class:'city'+(options.some(n=>n.i===i)?' available':'')+(path.includes(i)?' visited':'')+(current===i?' current':'')+(highlighted===i?' hint':'')});group.append(el('circle',{cx:point.x,cy:point.y,r:19}));group.append(el('text',{x:point.x,y:point.y+4,'text-anchor':'middle'},cityName(i)));group.append(el('title',{},cityName(i)+(i===0?" · Start":i===game.count-1?" · Finish":'')));if(i===game.count-1)group.append(el('text',{x:point.x+23,y:point.y-17,'aria-hidden':'true'},'⚑'));group.addEventListener('click',()=>visit(i));svg.append(group)});
$('choices').replaceChildren(...options.map(({i,weight})=>{const b=document.createElement('button');b.textContent=cityName(i)+' → '+weight+' km';b.onclick=()=>visit(i);return b}));$('visits').textContent=path.length+' / '+game.count+" cities";$('distance').textContent=distance+' km';$('route').textContent=path.map(cityName).join(' → ');$('undo').disabled=path.length===1;$('hint').disabled=done;$('score').textContent='—';$('comparison').textContent='';
if(done){const optimal=shortest(0,1).cost,score=Math.max(0,Math.round(1000*optimal/distance)-hintCount*100);setRecord(score);$('score').textContent=score;$('comparison').textContent="Shortest route: "+optimal+" km. Your route: "+distance+' km. '+hintCount+" hints.";$('message').textContent=distance===optimal?"Perfect route! You visited every city using the shortest possible route.":"Every city visited! Reset the route to look for a shorter connection."}
else $('message').textContent=note||(options.length?"Choose a city with a green outline.": "This route reaches a dead end. Undo a step and try another connection.");$('record').textContent="Best at this difficulty: "+storageGet('rota-ustasi-best-'+game.count)}
function visit(i){if(!available().some(n=>n.i===i))return;path.push(i);highlighted=-1;paint()}
function start(seed,label){const count=Number($('difficulty').value);game=generate(count,seed);path=[0];hintCount=0;highlighted=-1;$('seedLabel').textContent=label+" · Map "+seed;paint("You are in city A. Visit every city once and finish at "+cityName(count-1)+" .")}
$('newMap').onclick=()=>start(Math.floor(Math.random()*4294967295),"Free play");$('difficulty').onchange=()=>$('newMap').click();$('daily').onclick=()=>{const day=new Date().toLocaleDateString('sv-SE');start(hash(day+'-'+$('difficulty').value),"Daily "+day)};$('undo').onclick=()=>{if(path.length>1)path.pop();highlighted=-1;paint()};$('reset').onclick=()=>{path=[0];highlighted=-1;paint()};$('hint').onclick=()=>{const result=shortest(path.at(-1),currentMask());if(result.next===-1){paint("There is no complete route from here. Undo a step; no hint points were charged.");return}hintCount++;highlighted=result.next;paint("Next city on the shortest complete continuation: "+cityName(highlighted)+". This hint costs 100 points.")};$('newMap').click();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></body></html>
