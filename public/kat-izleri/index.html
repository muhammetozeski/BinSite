<!doctype html><html data-bs-theme="dark" lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fold Geometry — Hinged paper surfaces</title><style>body{margin:0;background:#ffffff;color:#181818;font:14px system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font:33px Georgia}p{line-height:1.8}.work{display:grid;grid-template-columns:280px 1fr;gap:25px}label{display:grid;gap:7px;margin:17px 0}input[type=range]{width:100%;accent-color:#b8b8b8}button,input{font:inherit}button{padding:10px 14px;border:1px solid #b8b8b8;background:#ffffff;color:inherit;cursor:pointer}button:hover{background:#ffffff}button:focus-visible,input:focus-visible{outline:3px solid #b8b8b8;outline-offset:2px}canvas{width:100%;height:auto;display:block;background:#ffffff}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#link{width:100%;box-sizing:border-box;padding:9px;font-size:11px}#status{min-height:30px}.small{font-size:12px}@media(max-width:750px){.work{grid-template-columns:1fr}}</style>
<style data-static-readability="calm">

<main><h1>Fold Geometry</h1><p>Adjust three hinges to fold four panels, then download the shape.</p><div class="work"><aside><div id="folds"></div><label>Fold progress<input id="progress" type="range" min="0" max="100" value="100"></label><label>View left / right<input id="yaw" type="range" min="-180" max="180" value="-30"></label><label>View up / down<input id="pitch" type="range" min="-75" max="75" value="25"></label><label>Paper color<input id="color" type="color" value="#e3be7b"></label><label><span><input id="triangles" type="checkbox"> Show triangle mesh</span></label><div class="bar"><button id="accordion">Accordion</button><button id="roof">Shelter</button><button id="spiral">Curl</button></div><details class="readability-help"><summary>Model dimensions</summary><p class="small">Parallel hinges; 100 × 200 unit panels. Surfaces may intersect; collision and material strength are not simulated.</p></details></aside><section><canvas id="paper" width="1000" height="650" aria-label="Actual triangle surface calculated from fold angles"></canvas><div class="bar"><button id="play">Animate folding</button><button id="obj">Download OBJ model</button><button id="png">Download PNG</button><button id="share">Copy fold link</button></div><input id="link" readonly aria-label="Fold geometry link"><p id="status" role="status" aria-live="polite">OBJ export keeps the current fold progress. The view angle only affects PNG.</p></section></div></main><script>
'use strict';const $=id=>document.getElementById(id),ctx=$('paper').getContext('2d');let angles=[70,-140,140],running=false,frame=0;for(let i=0;i<3;i++){const label=document.createElement('label'),value=document.createElement('output');value.id='angleValue'+i;value.textContent=angles[i]+'°';label.append(document.createTextNode((i+1)+'. fold angle '),value);const input=document.createElement('input');input.id='angle'+i;input.type='range';input.min=-170;input.max=170;input.value=angles[i];input.oninput=()=>{stop();angles[i]=Number(input.value);value.textContent=angles[i]+'°';draw();};label.append(input);$('folds').append(label);}function stop(){running=false;cancelAnimationFrame(frame);$('play').textContent='Animate folding';}function mesh(){const progress=Number($('progress').value)/100,vertices=[],faces=[];let x=-200,z=0,angle=0;vertices.push([x,-100,z],[x,100,z]);for(let panel=0;panel<4;panel++){if(panel>0)angle+=angles[panel-1]*Math.PI/180*progress;x+=100*Math.cos(angle);z+=100*Math.sin(angle);vertices.push([x,-100,z],[x,100,z]);const a=panel*2,b=a+2;faces.push([a,b,b+1],[a,b+1,a+1]);}const center=[0,0,0];vertices.forEach(v=>v.forEach((n,i)=>center[i]+=n/vertices.length));return{vertices:vertices.map(v=>v.map((n,i)=>n-center[i])),faces};}function project(p){const yaw=Number($('yaw').value)*Math.PI/180,pitch=Number($('pitch').value)*Math.PI/180,x=p[0]*Math.cos(yaw)-p[2]*Math.sin(yaw),z=p[0]*Math.sin(yaw)+p[2]*Math.cos(yaw),y=p[1]*Math.cos(pitch)-z*Math.sin(pitch),depth=p[1]*Math.sin(pitch)+z*Math.cos(pitch),scale=850/(850+depth);return{x:500+x*scale*1.65,y:330+y*scale*1.65,depth};}function draw(){ctx.fillStyle='#f7f9fb';ctx.fillRect(0,0,1000,650);const data=mesh(),vertices=data.vertices.map(project),hex=$('color').value,base=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)),faces=data.faces.map((ids,index)=>({ids,index,depth:ids.reduce((sum,id)=>sum+vertices[id].depth,0)/3})).sort((a,b)=>b.depth-a.depth);for(const face of faces){const [a,b,c]=face.ids.map(i=>data.vertices[i]),ab=b.map((v,i)=>v-a[i]),ac=c.map((v,i)=>v-a[i]),normal=[ab[1]*ac[2]-ab[2]*ac[1],ab[2]*ac[0]-ab[0]*ac[2],ab[0]*ac[1]-ab[1]*ac[0]],shade=.5+.5*Math.abs(normal[2]/(Math.hypot(...normal)||1));ctx.fillStyle='rgb('+base.map(v=>Math.round(v*shade)).join(',')+')';ctx.beginPath();face.ids.forEach((id,i)=>i?ctx.lineTo(vertices[id].x,vertices[id].y):ctx.moveTo(vertices[id].x,vertices[id].y));ctx.closePath();ctx.fill();if($('triangles').checked){ctx.strokeStyle='#826f50';ctx.lineWidth=1;ctx.stroke();}}ctx.strokeStyle='#3b617e';ctx.lineWidth=2;for(let hinge=1;hinge<4;hinge++){const a=vertices[hinge*2],b=vertices[hinge*2+1];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}for(const id of [0,1,8,9]){ctx.fillStyle='#3b617e';ctx.beginPath();ctx.arc(vertices[id].x,vertices[id].y,4,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#607388';ctx.font='14px monospace';ctx.fillText('10 vertices · 8 triangles · Fold progress '+$('progress').value+'%',25,620);}['progress','yaw','pitch','color','triangles'].forEach(id=>$(id).oninput=()=>{if(id==='progress')stop();draw();});function preset(values){stop();angles=values;angles.forEach((v,i)=>{$('angle'+i).value=v;$('angleValue'+i).textContent=v+'°';});draw();}$('accordion').onclick=()=>preset([70,-140,140]);$('roof').onclick=()=>preset([90,-90,-90]);$('spiral').onclick=()=>preset([65,65,65]);function tick(time){if(!running)return;$('progress').value=(1-Math.cos(time/1000))*50;draw();frame=requestAnimationFrame(tick);}$('play').onclick=()=>{running=!running;$('play').textContent=running?'Pause folding':'Animate folding';if(running)frame=requestAnimationFrame(tick);else cancelAnimationFrame(frame);};function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}$('obj').onclick=()=>{stop();const data=mesh(),text='# Fold Geometry mesh\n'+data.vertices.map(v=>'v '+v.map(x=>x.toFixed(6)).join(' ')).join('\n')+'\n'+data.faces.map(ids=>'f '+ids.map(i=>i+1).join(' ')).join('\n');download(new Blob([text],{type:'text/plain'}),'folded-paper.obj');};$('png').onclick=()=>{stop();$('paper').toBlob(b=>{if(b)download(b,'fold-geometry.png');});};$('share').onclick=async()=>{stop();const u=new URL(location.href);u.hash='f='+btoa(JSON.stringify({angles,progress:Number($('progress').value),yaw:Number($('yaw').value),pitch:Number($('pitch').value),color:$('color').value}));$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Fold geometry link copied.';}catch{$('link').select();}};if(location.hash.startsWith('#f='))try{if(location.hash.length>2000)throw Error();const s=JSON.parse(atob(location.hash.slice(3)));if(!s||!Array.isArray(s.angles)||s.angles.length!==3||s.angles.some(v=>!Number.isFinite(v)||Math.abs(v)>170)||!Number.isFinite(s.progress)||s.progress<0||s.progress>100||!Number.isFinite(s.yaw)||Math.abs(s.yaw)>180||!Number.isFinite(s.pitch)||Math.abs(s.pitch)>75||!/^#[0-9a-f]{6}$/i.test(s.color))throw Error();for(const id of ['progress','yaw','pitch','color'])$(id).value=s[id];preset(s.angles);}catch{$('status').textContent='The fold design could not be opened. An accordion example is ready.';}draw();
</script><script src="/assets/revenue.js" data-binsite-revenue data-ads="on" defer></script></html>
