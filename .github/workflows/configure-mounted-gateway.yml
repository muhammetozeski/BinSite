name: Configure existing Interlock gateway
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Preserve existing Interlock invitation keys and configure the authenticated gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node deployment/ensure-interlock-gateway.mjs
